# Certificates: Manage and issue certificates

---

# Removal of certificates with state: "absent". This reaps all data of the
# certificate: the acme.sh data below run_acmesh_cfg_cert_home (which also
# stops the automated renewal for it), the acmesh-reload-* systemd units and
# the installed certificate files. Directories holding installed files are
# kept, they may be shared with other software.
- name: "Cert | Default | Disable reload path unit(s) of certificate(s) with state 'absent' (best-effort)"
  ansible.builtin.systemd_service:
    name: "{{ __run_acmesh_reload_unit_prefix }}{{ item['unit_name'] }}.path"
    enabled: false
    state: "stopped"
  failed_when:
    - false # the unit might not exist (e.g. certificate without reloadcmd)
  when:
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_certs_absent_cleanup }}"
  loop_control:
    label: "{{ item['domain'] }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Cert | Default | Delete reload unit file(s) of certificate(s) with state 'absent'"
  ansible.builtin.file:
    path: "{{ __run_acmesh_reload_unitfile_dir }}/{{ __run_acmesh_reload_unit_prefix }}{{ item[0]['unit_name'] }}.{{ item[1] }}"
    state: "absent"
  when:
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_certs_absent_cleanup | ansible.builtin.product(['path', 'service']) }}"
  loop_control:
    label: "{{ item[0]['domain'] }} ({{ item[1] }})"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Cert | Default | Disable deploy unit(s) of certificate(s) with state 'absent' (best-effort)"
  ansible.builtin.systemd_service:
    name: "{{ __run_acmesh_deploy_unit_prefix }}{{ item[0]['unit_name'] }}.{{ item[1] }}"
    enabled: false
    state: "stopped"
  failed_when:
    - false # the unit might not exist (e.g. certificate with strategy "direct")
  when:
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_certs_absent_cleanup | ansible.builtin.product(['path', 'service']) }}"
  loop_control:
    label: "{{ item[0]['domain'] }} ({{ item[1] }})"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Cert | Default | Delete deploy unit file(s) of certificate(s) with state 'absent'"
  ansible.builtin.file:
    path: "{{ __run_acmesh_deploy_unitfile_dir }}/{{ __run_acmesh_deploy_unit_prefix }}{{ item[0]['unit_name'] }}.{{ item[1] }}"
    state: "absent"
  when:
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_certs_absent_cleanup | ansible.builtin.product(['path', 'service']) }}"
  loop_control:
    label: "{{ item[0]['domain'] }} ({{ item[1] }})"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Cert | Default | Delete certificate data and installed files of certificate(s) with state 'absent'"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  when:
    - run_acmesh_certs is ansible.builtin.defined
  loop: >-
    {{
      (__run_acmesh_certs_absent_cleanup | ansible.builtin.map(attribute='cert_dirs') | ansible.builtin.flatten)
      + (__run_acmesh_certs_absent_cleanup | ansible.builtin.map(attribute='installed_files') | ansible.builtin.flatten)
      + (__run_acmesh_certs_absent_cleanup | ansible.builtin.map(attribute='staging_dir') | ansible.builtin.list)
      + (__run_acmesh_certs_absent_cleanup | ansible.builtin.map(attribute='manifest_path') | ansible.builtin.list)
    }}


# Removal of unmanaged certificate data (opt-in): when
# run_acmesh_certs_delete_unmanaged is enabled, acme.sh certificate data below
# run_acmesh_cfg_cert_home that does not belong to any certificate listed in
# run_acmesh_certs gets removed (which also stops the automated renewal for
# it), as do acmesh-reload-* units the current configuration does not define.
# Installed certificate files of unmanaged certificates are not touched (their
# paths are unknown to the role).
- name: "Cert | Default | Find certificate data directories (unmanaged certificate data removal)"
  ansible.builtin.find:
    paths: "{{ run_acmesh_cfg_cert_home }}"
    file_type: "directory"
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool
  register: __run_acmesh_certhome_dirs_found


- name: "Cert | Default | Determine unmanaged certificate data directories"
  ansible.builtin.set_fact:
    # acme.sh stores a certificate's data in "<domain>", "<domain>_ecc" or
    # "<domain>_rsa" below the certificate home; strip the suffix to compare
    # against the configured primary domains.
    __run_acmesh_certhome_dirs_unmanaged: >-
      {%- set dirs = [] -%}
      {%- for _dir in (__run_acmesh_certhome_dirs_found['files'] | ansible.builtin.default([])
                       | ansible.builtin.map(attribute='path') | ansible.builtin.list) -%}
      {%-   set _domain = (_dir | ansible.builtin.basename) | ansible.builtin.regex_replace('(_ecc|_rsa)$', '') -%}
      {%-   if _domain not in __run_acmesh_certs_known_domains -%}
      {%-     set _ = dirs.append(_dir) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ dirs }}
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool


- name: "Cert | Default | Delete unmanaged certificate data directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool
  loop: "{{ __run_acmesh_certhome_dirs_unmanaged | ansible.builtin.default([]) }}"


- name: "Cert | Default | Find reload unit files (unmanaged certificate data removal)"
  ansible.builtin.find:
    paths: "{{ __run_acmesh_reload_unitfile_dir }}"
    patterns:
      - "{{ __run_acmesh_reload_unit_prefix }}*.path"
      - "{{ __run_acmesh_reload_unit_prefix }}*.service"
    file_type: "file"
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool
  register: __run_acmesh_reload_unitfiles_present


- name: "Cert | Default | Determine unmanaged reload unit files"
  ansible.builtin.set_fact:
    __run_acmesh_reload_unitfiles_unmanaged: >-
      {%- set files = [] -%}
      {%- set _expected = [] -%}
      {%- for _unit in __run_acmesh_reload_units -%}
      {%-   set _ = _expected.append(__run_acmesh_reload_unit_prefix ~ _unit['name'] ~ '.path') -%}
      {%-   set _ = _expected.append(__run_acmesh_reload_unit_prefix ~ _unit['name'] ~ '.service') -%}
      {%- endfor -%}
      {%- for _file in (__run_acmesh_reload_unitfiles_present['files'] | ansible.builtin.default([])
                        | ansible.builtin.map(attribute='path') | ansible.builtin.list) -%}
      {%-   if (_file | ansible.builtin.basename) not in _expected -%}
      {%-     set _ = files.append(_file) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ files }}
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool


- name: "Cert | Default | Disable unmanaged acmesh-reload-*.path unit(s) (best-effort)"
  ansible.builtin.systemd_service:
    name: "{{ item | ansible.builtin.basename }}"
    enabled: false
    state: "stopped"
  failed_when:
    - false
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool
  loop: >-
    {{
      __run_acmesh_reload_unitfiles_unmanaged | ansible.builtin.default([])
      | ansible.builtin.select('ansible.builtin.search', '\.path$')
      | ansible.builtin.list
    }}
  loop_control:
    label: "{{ item | ansible.builtin.basename }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Cert | Default | Delete unmanaged reload unit files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool
  loop: "{{ __run_acmesh_reload_unitfiles_unmanaged | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ item | ansible.builtin.basename }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


# Staged deployment resources (acmesh-deploy-* units, manifests, staging
# directories) the current configuration does not define are swept the same
# way. Expected are exactly the resources of managed certificates with
# strategy "staged"; resources of managed "direct" certificates are already
# removed unconditionally by the strategy transition handling in
# tasks/config/default.yml.
- name: "Cert | Default | Find deploy unit files and manifests (unmanaged certificate data removal)"
  ansible.builtin.find:
    paths:
      - "{{ __run_acmesh_deploy_unitfile_dir }}"
      - "{{ __run_acmesh_deploy_manifest_dir_path }}"
    patterns:
      - "{{ __run_acmesh_deploy_unit_prefix }}*.path"
      - "{{ __run_acmesh_deploy_unit_prefix }}*.service"
      - "*.json"
    file_type: "file"
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool
  register: __run_acmesh_deploy_files_present


- name: "Cert | Default | Find staging directories (unmanaged certificate data removal)"
  ansible.builtin.find:
    paths: "{{ run_acmesh_cfg_cert_deploy_base_dir }}"
    file_type: "directory"
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool
  register: __run_acmesh_deploy_stagingdirs_present


- name: "Cert | Default | Determine unmanaged staged deployment resources"
  ansible.builtin.set_fact:
    __run_acmesh_deploy_resources_unmanaged: >-
      {%- set paths = [] -%}
      {%- set _expected = [] -%}
      {%- for _entry in __run_acmesh_install_normalized_staged -%}
      {%-   set _ = _expected.append(__run_acmesh_deploy_unit_prefix ~ _entry['cert_id'] ~ '.path') -%}
      {%-   set _ = _expected.append(__run_acmesh_deploy_unit_prefix ~ _entry['cert_id'] ~ '.service') -%}
      {%-   set _ = _expected.append(_entry['cert_id'] ~ '.json') -%}
      {%-   set _ = _expected.append(_entry['cert_id']) -%}
      {%- endfor -%}
      {%- for _file in (__run_acmesh_deploy_files_present['files'] | ansible.builtin.default([])
                        | ansible.builtin.map(attribute='path') | ansible.builtin.list) -%}
      {%-   set _dir = _file | ansible.builtin.dirname -%}
      {%-   set _base = _file | ansible.builtin.basename -%}
      {%-   set _is_manifest = (_dir == __run_acmesh_deploy_manifest_dir_path) and (_base is ansible.builtin.match('^.*\.json$')) -%}
      {%-   set _is_unitfile = (_dir == __run_acmesh_deploy_unitfile_dir) and
                               (_base is ansible.builtin.match('^' ~ __run_acmesh_deploy_unit_prefix ~ '.*\.(path|service)$')) -%}
      {%-   if (_is_manifest or _is_unitfile) and (_base not in _expected) -%}
      {%-     set _ = paths.append(_file) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- for _dir in (__run_acmesh_deploy_stagingdirs_present['files'] | ansible.builtin.default([])
                       | ansible.builtin.map(attribute='path') | ansible.builtin.list) -%}
      {%-   if (_dir | ansible.builtin.basename) not in _expected -%}
      {%-     set _ = paths.append(_dir) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ paths }}
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool


- name: "Cert | Default | Disable unmanaged acmesh-deploy-* unit(s) (best-effort)"
  ansible.builtin.systemd_service:
    name: "{{ item | ansible.builtin.basename }}"
    enabled: false
    state: "stopped"
  failed_when:
    - false
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool
  loop: >-
    {{
      __run_acmesh_deploy_resources_unmanaged | ansible.builtin.default([])
      | ansible.builtin.select('ansible.builtin.search', '\.(path|service)$')
      | ansible.builtin.list
    }}
  loop_control:
    label: "{{ item | ansible.builtin.basename }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Cert | Default | Delete unmanaged staged deployment resources"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - run_acmesh_certs_delete_unmanaged | ansible.builtin.bool
  loop: "{{ __run_acmesh_deploy_resources_unmanaged | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ item | ansible.builtin.basename }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


# These tasks for copying existing certificates can be useful in non-production
# environments during development to avoid hitting CA rate limits or encountering
# similar restrictions.
- name: "Cert | Default | Check for pre-seeded cert dirs (RSA) at local source"
  delegate_to: "localhost"
  become: false
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/files/acme.sh/certhome/{{ item }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  when:
    - run_acmesh_certs is ansible.builtin.defined
  loop: >
    {{ __run_acmesh_certs_managed | ansible.builtin.selectattr('domains', 'ansible.builtin.defined')
       | ansible.builtin.map(attribute='domains') | ansible.builtin.flatten
       | ansible.builtin.selectattr('name', 'ansible.builtin.defined')
       | ansible.builtin.map(attribute='name') | ansible.builtin.unique }}
  register: __run_acmesh_local_preseed_rsa_result


- name: "Cert | Default | Show data about pre-seeded cert dirs (RSA) at local source"
  ansible.builtin.debug:
    var: __run_acmesh_local_preseed_rsa_result
    verbosity: 3
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - __run_acmesh_local_preseed_rsa_result is ansible.builtin.defined


- name: "Cert | Default | Pre-seed already issued certs (RSA) from local source (if any)"
  ansible.builtin.copy:
    src: "{{ item['stat']['path'] }}"
    dest: "{{ run_acmesh_cfg_cert_home }}"
    owner: "{{ run_acmesh_user }}"
    group: "{{ run_acmesh_group }}"
    directory_mode: "{{ __run_acmesh_cfg_cert_home_dir_mode }}"
    mode: "{{ __run_acmesh_cfg_cert_home_file_mode }}"
    remote_src: false
    decrypt: true
    force: false # do not overwrite anything if already existing on target
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - item['stat'] is ansible.builtin.defined
    - item['stat']['exists']
    - item['stat']['path'] is ansible.builtin.defined
  loop: "{{ __run_acmesh_local_preseed_rsa_result['results'] }}"


- name: "Cert | Default | Check for pre-seeded cert dirs (ECC) at local source"
  delegate_to: "localhost"
  become: false
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/files/acme.sh/certhome/{{ item }}_ecc"
    get_checksum: false
    get_mime: false
    get_attributes: false
  when:
    - run_acmesh_certs is ansible.builtin.defined
  loop: >
    {{ __run_acmesh_certs_managed | ansible.builtin.selectattr('domains', 'ansible.builtin.defined')
       | ansible.builtin.map(attribute='domains') | ansible.builtin.flatten
       | ansible.builtin.selectattr('name', 'ansible.builtin.defined')
       | ansible.builtin.map(attribute='name') | ansible.builtin.unique }}
  register: __run_acmesh_local_preseed_ecc_result


- name: "Cert | Default | show data about pre-seeded cert dirs (ECC) at local source"
  ansible.builtin.debug:
    var: __run_acmesh_local_preseed_ecc_result
    verbosity: 3
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - __run_acmesh_local_preseed_ecc_result is ansible.builtin.defined


- name: "Cert | Default | Pre-seed already issued certs (ECC) from local source (if any)"
  ansible.builtin.copy:
    src: "{{ item['stat']['path'] }}"
    dest: "{{ run_acmesh_cfg_cert_home }}"
    owner: "{{ run_acmesh_user }}"
    group: "{{ run_acmesh_group }}"
    directory_mode: "{{ __run_acmesh_cfg_cert_home_dir_mode }}"
    mode: "{{ __run_acmesh_cfg_cert_home_file_mode }}"
    remote_src: false
    decrypt: true
    force: false # do not overwrite anything if already existing on target
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - item['stat'] is ansible.builtin.defined
    - item['stat']['exists']
    - item['stat']['path'] is ansible.builtin.defined
  loop: "{{ __run_acmesh_local_preseed_ecc_result['results'] }}"


- name: "Cert | Default | Pre-seed ACME account.key files, re-register ACME account"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to manage acme.sh's
  #   internal account key files, which live in CA-specific subdirectories
  #   whose paths depend on the ACME directory URL.
  # - The script computes the CA directory path by replicating acme.sh's
  #   _initpath logic (server alias to URL resolution, then URL to directory
  #   mapping). This avoids running --register-account before seeding, which
  #   would create an orphaned ACME account with a throwaway key.
  # - The script follows the pattern of the hook config update task below.
  ansible.builtin.shell:
    cmd: |
      set -u # Fail on unset vars
      set -o pipefail # Fail if any pipe cmd fails
      set -e # Exit on errors

      # Input parameters
      CONFIG_HOME={{ run_acmesh_cfg_config_home | ansible.builtin.quote }}
      ACMESH_HOME={{ run_acmesh_cfg_home | ansible.builtin.quote }}
      SERVER={{ item['server'] | ansible.builtin.quote }}
      ACCOUNT_KEY_CONTENT={{ item['account_key'] | ansible.builtin.quote }}
      ACCOUNT_KEY_CONTENT="$(printf '%s' "${ACCOUNT_KEY_CONTENT}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')" # trim

      CHANGES_MADE=0

      # Resolve server alias to ACME directory URL.
      # Mirrors acme.sh's built-in CA alias mapping (see CA_NAMES variable).
      ACME_DIRECTORY=""
      case "${SERVER}" in
        ZeroSSL.com|zerossl)
          ACME_DIRECTORY="https://acme.zerossl.com/v2/DV90" ;;

        LetsEncrypt.org|letsencrypt)
          ACME_DIRECTORY="https://acme-v02.api.letsencrypt.org/directory" ;;

        LetsEncrypt.org_test|letsencrypt_test|letsencrypttest)
          ACME_DIRECTORY="https://acme-staging-v02.api.letsencrypt.org/directory" ;;

        SSL.com|sslcom)
          ACME_DIRECTORY="https://acme.ssl.com/sslcom-dv-rsa" ;;

        Google.com|google)
          ACME_DIRECTORY="https://dv.acme-v02.api.pki.goog/directory" ;;

        Google.com_test|googletest|google_test)
          ACME_DIRECTORY="https://dv.acme-v02.test-api.pki.goog/directory" ;;

        Actalis.com|actalis.com|actalis)
          ACME_DIRECTORY="https://acme-api.actalis.com/acme/directory" ;;

        https://*|http://*)
          ACME_DIRECTORY="${SERVER}" ;;

        *)
          printf "error: Unknown server alias '%s'. Use a known alias " "${SERVER}" 1>&2
          printf "(letsencrypt, letsencrypt_test, zerossl, sslcom, google, " 1>&2
          printf "google_test, actalis) or a full ACME directory URL.\n" 1>&2
          exit 1
          ;;
      esac

      # Compute CA directory path (mirrors acme.sh _initpath logic, see _ACME_SERVER_HOST,
      # _ACME_SERVER_PATH and CA_DIR).
      # acme.sh stores account keys in: <config_home>/ca/<host>/<path>/account.key
      ACME_HOST=$(printf '%s' "${ACME_DIRECTORY}" | cut -d : -f 2 | tr -s / | cut -d / -f 2)
      ACME_PATH=$(printf '%s' "${ACME_DIRECTORY}" | cut -d : -f 2- | tr -s / | cut -d / -f 3-)
      CA_DIR="${CONFIG_HOME}/ca/${ACME_HOST}/${ACME_PATH}"
      ACCOUNT_KEY_FILE="${CA_DIR}/account.key"

      # Create the CA directory and seed the account key before running
      # --register-account. acme.sh checks for an existing account.key
      # and uses it instead of generating a new one. The directory chain is
      # handed over to the service user, which runs acme.sh (and has to write
      # account.json and friends next to the key).
      mkdir -p "${CA_DIR}"
      chown -R {{ run_acmesh_user | ansible.builtin.quote }}:{{ run_acmesh_group | ansible.builtin.quote }} "${CONFIG_HOME}/ca"

      # Compare current key with expected key
      CURRENT_KEY=""
      if [ -f "${ACCOUNT_KEY_FILE}" ]
      then
          CURRENT_KEY=$(cat "${ACCOUNT_KEY_FILE}")
          CURRENT_KEY="$(printf '%s' "${CURRENT_KEY}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')" # trim
      fi

      if [ "${CURRENT_KEY}" != "${ACCOUNT_KEY_CONTENT}" ]
      then
          printf "Updating account key for server %s\n" "${SERVER}"
          printf '%s\n' "${ACCOUNT_KEY_CONTENT}" > "${ACCOUNT_KEY_FILE}"
          chmod 0600 "${ACCOUNT_KEY_FILE}"
          chown {{ run_acmesh_user | ansible.builtin.quote }}:{{ run_acmesh_group | ansible.builtin.quote }} "${ACCOUNT_KEY_FILE}"
          CHANGES_MADE=1
      fi

      # account.json (the ACME registration response cache) is not pre-seeded.
      # Per RFC 8555 section 7.3.1, the CA identifies accounts by their public
      # key. When --register-account runs below with the seeded account.key,
      # the CA recognizes the existing account and returns its metadata
      # (account URL, contact info), which acme.sh can save as account.json
      # automatically if needed. Pre-seeding it would save one network
      # round-trip but adds interface complexity for no practical benefit.

      # Register with CA using the seeded key (no orphaned account).
      # On first run, this registers the seeded key with the CA.
      # On subsequent runs with no changes, this is a no-op.
      if [ "${CHANGES_MADE}" = "1" ]
      then
          {{ __run_acmesh_setpriv_run_as_user }} -- "${ACMESH_HOME}/acme.sh" \
            --register-account \
            --config-home "${CONFIG_HOME}" \
            --server "${SERVER}" \
            {{ '--accountemail ' ~ (run_acmesh_cfg_accountemail | ansible.builtin.quote)
                if ((run_acmesh_cfg_accountemail is ansible.builtin.defined) and
                    (run_acmesh_cfg_accountemail))
                else
                '' }} \
            {{ '--ca-bundle ' ~ (run_acmesh_cfg_ca_bundle | ansible.builtin.quote)
                if ((run_acmesh_cfg_ca_bundle is ansible.builtin.defined) and
                    (run_acmesh_cfg_ca_bundle))
                else
                '' }} \
            {{ '--ca-path ' ~ (run_acmesh_cfg_ca_path | ansible.builtin.quote)
                if ((run_acmesh_cfg_ca_path is ansible.builtin.defined) and
                    (run_acmesh_cfg_ca_path))
                else
                '' }} > /dev/null 2>&1 || true
          printf "Changed: Registered account for server %s." "${SERVER}"
      fi

      exit 0
    executable: "/bin/bash" # Support for other shells untested (so far)
  args:
    chdir: "{{ run_acmesh_cfg_home }}"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_cfg_account_keys is ansible.builtin.defined
    - (run_acmesh_cfg_account_keys | ansible.builtin.length) > 0
  changed_when:
    - __run_acmesh_account_preseed_result is ansible.builtin.success
    - ('Changed') in __run_acmesh_account_preseed_result['stdout']
  failed_when:
    - __run_acmesh_account_preseed_result is ansible.builtin.failed
  loop: "{{ run_acmesh_cfg_account_keys | ansible.builtin.default([]) }}"
  register: __run_acmesh_account_preseed_result
  no_log: true
  notify:
    - "run_acmesh: set ownership and permissions"


- name: "Cert | Default | Register ACME accounts for dns-persist-01 domains"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to interact with the
  #   used command.
  ansible.builtin.command:
    # Per RFC 8555 section 7.3.1, the CA identifies accounts by their public
    # key. When --register-account runs below with an already existing
    # account.key, the CA recognizes the existing account and returns its
    # metadata (account URL, contact info), so on subsequent runs with no
    # key changes, this is a no-op.
    cmd: >
      {{ __run_acmesh_setpriv_run_as_user }} -- ./acme.sh
        --register-account
        --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }}
        --server {{ item | ansible.builtin.quote }}
        {{ '--accountemail ' ~ (run_acmesh_cfg_accountemail | ansible.builtin.quote)
            if ((run_acmesh_cfg_accountemail is ansible.builtin.defined) and
                (run_acmesh_cfg_accountemail))
            else
            '' }}
        {{ '--ca-bundle ' ~ (run_acmesh_cfg_ca_bundle | ansible.builtin.quote)
            if ((run_acmesh_cfg_ca_bundle is ansible.builtin.defined) and
                (run_acmesh_cfg_ca_bundle))
            else
            '' }}
        {{ '--ca-path ' ~ (run_acmesh_cfg_ca_path | ansible.builtin.quote)
            if ((run_acmesh_cfg_ca_path is ansible.builtin.defined) and
                (run_acmesh_cfg_ca_path))
            else
            '' }}
  args:
    chdir: "{{ run_acmesh_cfg_home }}"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - (__run_acmesh_dns_persist_servers | ansible.builtin.length) > 0
  changed_when:
    - __run_acmesh_register_result is ansible.builtin.success
    - ('Registered') in __run_acmesh_register_result['stdout']
  failed_when:
    - __run_acmesh_register_result is ansible.builtin.failed
    - ('Already registered') not in __run_acmesh_register_result['stdout'] | ansible.builtin.default('')
  loop: "{{ __run_acmesh_dns_persist_servers }}"
  vars:
    __run_acmesh_dns_persist_servers: >-
      {%- set servers = [] -%}
      {%- for cert in __run_acmesh_certs_managed -%}
        {%- for domain in (cert['domains'] | ansible.builtin.default([])) -%}
          {%- if (domain['challenge'] is ansible.builtin.defined) and
                 (domain['challenge']['type'] is ansible.builtin.defined) and
                 (domain['challenge']['type'] == 'dns_persist') -%}
            {%- set _ = servers.append(cert['server'] | ansible.builtin.default('letsencrypt')) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ servers | ansible.builtin.unique | ansible.builtin.list }}
  register: __run_acmesh_register_result


- name: "Cert | Default | Generate dns-persist-01 TXT record values"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to interact with the
  #   used command.
  ansible.builtin.command:
    cmd: >
      {{ __run_acmesh_setpriv_run_as_user }} -- ./acme.sh
        --make-dns-persist-value
        --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }}
        --domain {{ item['domain'] | ansible.builtin.quote }}
        --server {{ item['server'] | ansible.builtin.quote }}
        {{ '--dns-persist-wildcard'
            if ((item['dns_persist_wildcard'] is ansible.builtin.defined) and
                (item['dns_persist_wildcard']))
            else
            '' }}
        {{ '--dns-persist-ca-name ' ~ (item['dns_persist_ca_name'] | ansible.builtin.quote)
            if ((item['dns_persist_ca_name'] is ansible.builtin.defined) and
                (item['dns_persist_ca_name']))
            else
            '' }}
        {{ '--dns-persist-days ' ~ (item['dns_persist_days'] | ansible.builtin.quote)
            if ((item['dns_persist_days'] is ansible.builtin.defined) and
                (item['dns_persist_days']))
            else
            '' }}
  args:
    chdir: "{{ run_acmesh_cfg_home }}"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - (__run_acmesh_dns_persist_domains | ansible.builtin.length) > 0
  changed_when:
    - false
  loop: "{{ __run_acmesh_dns_persist_domains }}"
  vars:
    __run_acmesh_dns_persist_domains: >-
      {%- set domains = [] -%}
      {%- for cert in __run_acmesh_certs_managed -%}
        {%- for domain in (cert['domains'] | ansible.builtin.default([])) -%}
          {%- if (domain['challenge'] is ansible.builtin.defined) and
                 (domain['challenge']['type'] is ansible.builtin.defined) and
                 (domain['challenge']['type'] == 'dns_persist') -%}
            {%- set _ = domains.append({
              'domain': domain['name'],
              'server': cert['server'] | ansible.builtin.default('letsencrypt'),
              'dns_persist_wildcard': domain['challenge']['dns_persist_wildcard'] | ansible.builtin.default(false),
              'dns_persist_ca_name': domain['challenge']['dns_persist_ca_name'] | ansible.builtin.default(''),
              'dns_persist_days': domain['challenge']['dns_persist_days'] | ansible.builtin.default('')
            }) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ domains }}
  register: __run_acmesh_dns_persist_values_result


- name: "Cert | Default | Display dns-persist-01 TXT record instructions"
  ansible.builtin.debug:
    msg: |-
      dns-persist-01: DNS TXT Resource Record (RR) Instructions

      If not already done, publish the following TXT RR(s) in your DNS:
      {% for result in __run_acmesh_dns_persist_values_result['results'] | ansible.builtin.default([]) %}
      {% if result['stdout'] is ansible.builtin.defined %}

        Domain: {{ result['item']['domain'] }}
        Record name: _validation-persist.{{ result['item']['domain'] }}
        Record type: TXT
        Record value: {{ result['stdout'] | ansible.builtin.trim }}
      {% endif %}
      {% endfor %}

      Multiple TXT records at the same name are valid (one per ACME account/CA).
      The record is tied to your ACME account key - do not lose the account key
      (if the account key is lost, delete the old DNS RR, create a new ACME
      account, and publish new DNS RR(s)).
  when:
    - __run_acmesh_is_installed
    - __run_acmesh_dns_persist_values_result is ansible.builtin.defined
    - (__run_acmesh_dns_persist_values_result['results'] | ansible.builtin.default([]) | ansible.builtin.length) > 0


- name: "Cert | Default | Pause for dns-persist-01 TXT record publication"
  ansible.builtin.pause:
    seconds: "{{ run_acmesh_dns_persist_pause | ansible.builtin.int }}"
    prompt: >-
      Waiting for dns-persist-01 TXT records to be published (see instructions
      above). Press ENTER to continue immediately if records are already in place,
      or wait for the timeout ({{ run_acmesh_dns_persist_pause }}s) to expire.
  when:
    - __run_acmesh_is_installed
    - run_acmesh_dns_persist_pause is ansible.builtin.defined
    - (run_acmesh_dns_persist_pause | ansible.builtin.int) > 0
    - __run_acmesh_dns_persist_values_result is ansible.builtin.defined
    - (__run_acmesh_dns_persist_values_result['results'] | ansible.builtin.default([]) | ansible.builtin.length) > 0


- name: "Cert | Default | Issue certificate(s)"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to interact with the
  #   used command.
  # - Inline templating allows for safe and efficient parameter handling,
  #   avoiding the need for multiple additional tasks with little to no benefit.
  ansible.builtin.command:
    # The setpriv prefix runs acme.sh as the service user. A certificate using
    # the "standalone" or "alpn" challenge on a privileged port (< 1024)
    # additionally gets CAP_NET_BIND_SERVICE as ambient capability, exactly
    # like acmesh-renewal.service grants it for the renewal (AmbientCapabilities=).
    cmd: >
      {{ __run_acmesh_setpriv_run_as_user }}
      {{ '--inh-caps +net_bind_service --ambient-caps +net_bind_service'
          if (__run_acmesh_issue_needs_net_bind | ansible.builtin.bool)
          else
          '' }}
      -- ./acme.sh
        --issue
        --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }}
        --certhome {{ run_acmesh_cfg_cert_home | ansible.builtin.quote }}
        {% for item_domain in item['domains'] %}
          --domain {{ item_domain['name'] | ansible.builtin.quote }}
          {{ '--dns ' ~ (item_domain['challenge']['dns_provider'] | ansible.builtin.quote)
              if ((item_domain['challenge'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] == 'dns') and
                  (item_domain['challenge']['dns_provider'] is ansible.builtin.defined) and
                  (item_domain['challenge']['dns_provider']))
              else
              '' }}
          {{ '--domain-alias ' ~ (item_domain['challenge']['domain_alias'] | ansible.builtin.quote)
              if ((item_domain['challenge']['domain_alias'] is ansible.builtin.defined) and
                  (item_domain['challenge']['domain_alias']))
              else
              '' }}
          {{ '--challenge-alias ' ~ (item_domain['challenge']['challenge_alias'] | ansible.builtin.quote)
              if ((item_domain['challenge']['challenge_alias'] is ansible.builtin.defined) and
                  (item_domain['challenge']['challenge_alias']))
              else
              '' }}
          {{ '--webroot ' ~ (item_domain['challenge']['webroot'] | ansible.builtin.quote)
              if ((item_domain['challenge'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] == 'webroot') and
                  (item_domain['challenge']['webroot'] is ansible.builtin.defined) and
                  (item_domain['challenge']['webroot']))
              else
              '' }}
          {{ '--standalone'
              if ((item_domain['challenge'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] == 'standalone'))
              else
              '' }}
          {{ '--httpport ' ~ (item_domain['challenge']['httpport'] | ansible.builtin.quote)
              if ((item_domain['challenge']['httpport'] is ansible.builtin.defined) and
                  (item_domain['challenge']['httpport']))
              else
              '' }}
          {{ '--alpn'
              if ((item_domain['challenge'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] == 'alpn'))
              else
              '' }}
          {{ '--tlsport ' ~ (item_domain['challenge']['tlsport'] | ansible.builtin.quote)
              if ((item_domain['challenge']['tlsport'] is ansible.builtin.defined) and
                  (item_domain['challenge']['tlsport']))
              else
              '' }}
          {{ '--dns-persist'
              if ((item_domain['challenge'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] == 'dns_persist'))
              else
              '' }}
          {{ '--dns-persist-wildcard'
              if ((item_domain['challenge'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] == 'dns_persist') and
                  (item_domain['challenge']['dns_persist_wildcard'] is ansible.builtin.defined) and
                  (item_domain['challenge']['dns_persist_wildcard']))
              else
              '' }}
          {{ '--dns-persist-ca-name ' ~ (item_domain['challenge']['dns_persist_ca_name'] | ansible.builtin.quote)
              if ((item_domain['challenge'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] == 'dns_persist') and
                  (item_domain['challenge']['dns_persist_ca_name'] is ansible.builtin.defined) and
                  (item_domain['challenge']['dns_persist_ca_name']))
              else
              '' }}
          {{ '--dns-persist-days ' ~ (item_domain['challenge']['dns_persist_days'] | ansible.builtin.quote)
              if ((item_domain['challenge'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] is ansible.builtin.defined) and
                  (item_domain['challenge']['type'] == 'dns_persist') and
                  (item_domain['challenge']['dns_persist_days'] is ansible.builtin.defined) and
                  (item_domain['challenge']['dns_persist_days']))
              else
              '' }}
        {% endfor %}
        {{ '--force'
            if ((item['force'] is ansible.builtin.defined) and
                (item['force']))
            else
            '' }}
        {{ '--debug'
            if ((item['debug'] is ansible.builtin.defined) and
                (item['debug']))
            else
            '' }}
        {{ '--dnssleep ' ~ (item['dnssleep'] | ansible.builtin.quote)
            if (item['dnssleep'] is ansible.builtin.defined)
            else
            '' }}
        {{ '--pre-hook ' ~ (item['pre_hook'] | ansible.builtin.quote)
            if ((item['pre_hook'] is ansible.builtin.defined) and
                (item['pre_hook']))
            else
            '' }}
        {{ '--post-hook ' ~ (item['post_hook'] | ansible.builtin.quote)
            if ((item['post_hook'] is ansible.builtin.defined) and
                (item['post_hook']))
            else
            '' }}
        {{ '--renew-hook ' ~ (item['renew_hook'] | ansible.builtin.quote)
            if ((item['renew_hook'] is ansible.builtin.defined) and
                (item['renew_hook']))
            else
            '' }}
        {{ '--server ' ~ (item['server'] | ansible.builtin.quote)
            if ((item['server'] is ansible.builtin.defined) and
                (item['server']))
            else
            '--server letsencrypt' }}
        {{ '--ca-bundle ' ~ (run_acmesh_cfg_ca_bundle | ansible.builtin.quote)
            if ((run_acmesh_cfg_ca_bundle is ansible.builtin.defined) and
                (run_acmesh_cfg_ca_bundle))
            else
            '' }}
        {{ '--ca-path ' ~ (run_acmesh_cfg_ca_path | ansible.builtin.quote)
            if ((run_acmesh_cfg_ca_path is ansible.builtin.defined) and
                (run_acmesh_cfg_ca_path))
            else
            '' }}
        {{  item['extra_flags']
            if (item['extra_flags'] is ansible.builtin.defined)
            else
            '' }}
  args:
    chdir: "{{ run_acmesh_cfg_home }}"
  # HOME mirrors the environment of the renewal service unit. The environment
  # is preserved across the setpriv user switch, so the DNS API credentials
  # reach acme.sh as before.
  environment: >-
    {{
      {'HOME': run_acmesh_cfg_home}
      | ansible.builtin.combine(run_acmesh_environment | ansible.builtin.default({}))
      | ansible.builtin.combine(item['environment'] | ansible.builtin.default({}))
    }}
  vars:
    # Whether this certificate needs CAP_NET_BIND_SERVICE for issuance: same
    # logic as __run_acmesh_renewal_needs_net_bind (vars/main.yml), but for a
    # single certificate.
    __run_acmesh_issue_needs_net_bind: >-
      {%- set ns = namespace(need=false) -%}
      {%- for _domain in (item['domains'] | ansible.builtin.default([])) -%}
      {%-   set _challenge = _domain['challenge'] | ansible.builtin.default({}) -%}
      {%-   set _type = _challenge['type'] | ansible.builtin.default('') -%}
      {%-   if _type == 'standalone' and ((_challenge['httpport'] | ansible.builtin.default(80) | ansible.builtin.int) < 1024) -%}
      {%-     set ns.need = true -%}
      {%-   elif _type == 'alpn' and ((_challenge['tlsport'] | ansible.builtin.default(443) | ansible.builtin.int) < 1024) -%}
      {%-     set ns.need = true -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.need }}
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
  changed_when:
    - __run_acmesh_issue_result is ansible.builtin.success
    - ('Cert success') in __run_acmesh_issue_result['stdout']
  # Exit status 2 is acme.sh's RENEW_SKIP ("nothing to do", e.g. the
  # certificate is not due for renewal yet); every other nonzero status is a
  # real failure. Deliberately not matched against stdout: acme.sh prints
  # "Domains not changed" before it decides whether to renew, so a renewal
  # that starts and then fails (challenge, DNS API, CA error) still carries
  # that text and would be swallowed.
  failed_when:
    - __run_acmesh_issue_result is ansible.builtin.failed
    - (__run_acmesh_issue_result['rc'] | ansible.builtin.default(1)) != 2
  loop: "{{ __run_acmesh_certs_managed }}"
  register: __run_acmesh_issue_result
  # The task environment carries the DNS API credentials (global and
  # per-certificate) and the loop item includes the per-certificate ones, so its
  # output must not be logged. Note: a "-vvv" run still exposes the environment
  # in the connection plugin's EXEC line, which no_log cannot suppress.
  no_log: true
  notify:
    - "run_acmesh: set ownership and permissions"


# Only the immediate destination directories are managed with the effective
# (merged) directory permissions; existing ancestors such as /etc/ssl or
# /etc/ssl/private are never changed. Missing ancestors are created
# neutrally first (root, default umask): ansible.builtin.file would
# otherwise apply the leaf's - possibly restrictive - ownership and mode to
# every intermediate directory it creates, locking other consumers (or other
# certificates) out of a shared parent.
- name: "Cert | Default | Create missing parent directories for certificate installation(s)"
  # No owner/group/mode on purpose (noqa risky-file-permissions): specifying
  # them would also reconcile already existing ancestors on every run, which
  # this role must never do. Newly created ancestors get root's defaults
  # (0755 with the standard umask), keeping them traversable for everyone.
  ansible.builtin.file: # noqa: risky-file-permissions
    path: "{{ item['path'] | ansible.builtin.dirname }}"
    state: "directory"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_install_directories_flat }}"
  loop_control:
    label: "{{ item['domain'] }}: {{ item['path'] | ansible.builtin.dirname }}"


- name: "Cert | Default | Create and reconcile target directories for certificate installation(s)"
  ansible.builtin.file:
    path: "{{ item['path'] }}"
    state: "directory"
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    mode: "{{ item['mode'] }}"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_install_directories_flat }}"
  loop_control:
    label: "{{ item['domain'] }}: {{ item['path'] }}"


# Guard against a destructive fallback: acme.sh stores the paths handed to
# "--install-cert" as its Le_Real*Path values, so invoking it without the
# file flags does not just skip the installation, it CLEARS the previously
# stored installation configuration of that certificate. The install task
# derives those flags from the normalized data; if that lookup ever fails to
# resolve for a certificate which configures install paths, the run must stop
# here instead of silently wiping the certificate's installation settings.
- name: "Cert | Default | Check the installation data resolves for every certificate and fail if unmet"
  ansible.builtin.assert:
    that:
      - "(__run_acmesh_install_unresolved | ansible.builtin.length) == 0"
    fail_msg: >-
      The normalized installation data could not be resolved for the following
      certificate(s): {{ __run_acmesh_install_unresolved | ansible.builtin.join(', ') }}.
      Running "acme.sh --install-cert" without the file paths would clear the
      stored installation configuration of those certificates, so the run
      stops here. Please report this together with the output of
      "ansible-playbook ... --tags run_acmesh_cert -vv".
    quiet: true
  vars:
    __run_acmesh_install_unresolved: >-
      {%- set offenders = [] -%}
      {%- for _cert in __run_acmesh_certs_no_secrets -%}
      {%-   set _install = _cert['install'] | ansible.builtin.default({}) -%}
      {%-   set _ns = namespace(paths=false) -%}
      {%-   for _key in ['ca_file', 'cert_file', 'fullchain_file', 'key_file'] -%}
      {%-     if (((_install[_key] | ansible.builtin.default('')) | ansible.builtin.length) > 0) -%}
      {%-       set _ns.paths = true -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   set _domain = (_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('') -%}
      {%-   set _found = __run_acmesh_install_normalized
                         | ansible.builtin.selectattr('domain', 'ansible.builtin.equalto', _domain)
                         | ansible.builtin.list -%}
      {%-   if _ns.paths and ((_found | ansible.builtin.length) == 0) -%}
      {%-     set _ = offenders.append(_domain) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ offenders }}
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined


# The installation itself is no_log (it carries the DNS API credentials in its
# environment), so the resolved paths would otherwise never be visible. This
# task shows them without any credential: the normalized data is built from
# the credential-free certificate view.
- name: "Cert | Default | Show the resolved certificate installation paths"
  ansible.builtin.debug:
    msg:
      - "domain: {{ item['domain'] }}"
      - "strategy: {{ item['strategy'] }}"
      - >-
        acme.sh --install-cert writes to:
        {{ item['artifacts'] | ansible.builtin.dict2items
           | ansible.builtin.map(attribute='value')
           | ansible.builtin.map(attribute=(item['strategy'] == 'staged') | ansible.builtin.ternary('staging', 'dest'))
           | ansible.builtin.list | ansible.builtin.join(', ') }}
    verbosity: 2
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_install_normalized }}"
  loop_control:
    label: "{{ item['domain'] }}"


- name: "Cert | Default | Install certificate(s)"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to interact with the
  #   used command.
  # - Inline templating allows for safe and efficient parameter handling,
  #   avoiding the need for multiple additional tasks with little to no benefit.
  ansible.builtin.command:
    # The setpriv prefix runs acme.sh as the service user, see vars/main.yml.
    # Certificates with the (default) "staged" strategy point acme.sh at the
    # internal staging paths; acme.sh persists them as its Le_Real*Path values
    # and reuses them during renewals, so renewals also stage and the
    # acmesh-deploy-* units publish to the final destinations. The "direct"
    # strategy keeps pointing at the final paths (pre-4.0.0 behavior).
    cmd: >
      {{ __run_acmesh_setpriv_run_as_user }} -- ./acme.sh
        --install-cert
        --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }}
        --certhome {{ run_acmesh_cfg_cert_home | ansible.builtin.quote }}
        --domain {{ item['domain'] | ansible.builtin.quote }}
        {{ '--ca-file ' ~ ((__run_acmesh_install_artifacts['ca_file']['staging']
                            if (__run_acmesh_install_staged | ansible.builtin.bool)
                            else __run_acmesh_install_artifacts['ca_file']['dest']) | ansible.builtin.quote)
            if ('ca_file' in __run_acmesh_install_artifacts)
            else
            '' }}
        {{ '--cert-file ' ~ ((__run_acmesh_install_artifacts['cert_file']['staging']
                              if (__run_acmesh_install_staged | ansible.builtin.bool)
                              else __run_acmesh_install_artifacts['cert_file']['dest']) | ansible.builtin.quote)
            if ('cert_file' in __run_acmesh_install_artifacts)
            else
            '' }}
        {{ '--fullchain-file ' ~ ((__run_acmesh_install_artifacts['fullchain_file']['staging']
                                   if (__run_acmesh_install_staged | ansible.builtin.bool)
                                   else __run_acmesh_install_artifacts['fullchain_file']['dest']) | ansible.builtin.quote)
            if ('fullchain_file' in __run_acmesh_install_artifacts)
            else
            '' }}
        {{ '--key-file ' ~ ((__run_acmesh_install_artifacts['key_file']['staging']
                             if (__run_acmesh_install_staged | ansible.builtin.bool)
                             else __run_acmesh_install_artifacts['key_file']['dest']) | ansible.builtin.quote)
            if ('key_file' in __run_acmesh_install_artifacts)
            else
            '' }}
  args:
    chdir: "{{ run_acmesh_cfg_home }}"
  vars:
    # The loop item already carries this certificate's installation data, so
    # there is no runtime correlation that could resolve to nothing (see
    # __run_acmesh_install_loop in vars/main.yml on why that would be
    # destructive).
    __run_acmesh_install_artifacts: "{{ item['install_data']['artifacts'] }}"
    __run_acmesh_install_staged: "{{ item['install_data']['strategy'] == 'staged' }}"
  # HOME mirrors the environment of the renewal service unit. The environment
  # is preserved across the setpriv user switch, so the DNS API credentials
  # reach acme.sh as before.
  environment: >-
    {{
      {'HOME': run_acmesh_cfg_home}
      | ansible.builtin.combine(run_acmesh_environment | ansible.builtin.default({}))
      | ansible.builtin.combine(item['environment'] | ansible.builtin.default({}))
    }}
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
  changed_when:
    - __run_acmesh_install_result is ansible.builtin.success
    - ('Cert success') in __run_acmesh_install_result['stdout']
  # No --reloadcmd is passed to acme.sh: reload commands run via root-side
  # acmesh-reload-* systemd path units watching the installed files (see
  # tasks/config/default.yml), so acme.sh reload errors cannot occur here.
  # A nonzero exit status always fails the role: acme.sh prints "Installing"
  # for every file before writing it, so a partial installation (e.g. a
  # private key that cannot be written) still produces that output while
  # leaving already deployed files stale.
  failed_when:
    - __run_acmesh_install_result is ansible.builtin.failed
  loop: "{{ __run_acmesh_install_loop }}"
  loop_control:
    label: "{{ item['domain'] }}"
  register: __run_acmesh_install_result
  # As with issuing: the task environment carries the DNS API credentials and the
  # loop item includes the per-certificate ones. See the no_log note above.
  no_log: true
  notify:
    - "run_acmesh: set ownership and permissions"


# Staged deployment: after acme.sh wrote the staging files, the root-owned
# acmesh-deploy-* service publishes them. The helper's read-only --check mode
# is the single source of truth for deployment drift (content, ownership,
# modes); the service is only started when it reports drift (exit code 3) or
# when its last (possibly path-triggered) run failed, so converged runs stay
# idempotent while earlier failures still resurface here.
- name: "Cert | Default | Apply pending systemd changes before staged deployment"
  ansible.builtin.meta: "flush_handlers"


- name: "Cert | Default | Get information about the deployment manifest(s) (staged deployment)"
  ansible.builtin.stat:
    path: "{{ __run_acmesh_deploy_manifest_dir_path }}/{{ item['cert_id'] }}.json"
    get_checksum: false
    get_mime: false
    get_attributes: false
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_install_normalized_staged }}"
  loop_control:
    label: "{{ item['domain'] }}"
  register: __run_acmesh_deploy_manifest_stat


- name: "Cert | Default | Get information about the staged certificate file(s) (staged deployment)"
  ansible.builtin.stat:
    path: "{{ item['staging'] }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_install_staging_files_flat }}"
  loop_control:
    label: "{{ item['domain'] }}: {{ item['artifact'] }}"
  register: __run_acmesh_deploy_staging_stat


- name: "Cert | Default | Check acme.sh populated the staging area(s) and fail if unmet"
  # Without this, an unpopulated staging area only surfaces as a low-level
  # open() error of the deploy helper, which hides the actual cause.
  ansible.builtin.assert:
    that:
      - "(__run_acmesh_deploy_staging_missing | ansible.builtin.length) == 0"
    fail_msg: >-
      acme.sh did not write the following staged certificate file(s):
      {{ __run_acmesh_deploy_staging_missing | ansible.builtin.join(', ') }}.
      The staged installation strategy needs them before the root-side deploy
      service can publish anything. This usually means the certificate could
      not be issued or renewed (see the output of the issuance task and
      {{ run_acmesh_cfg_logfile }}), so there is nothing to stage yet. The
      certificate files at the final destinations were not modified.
    quiet: true
  vars:
    __run_acmesh_deploy_staging_missing: >-
      {%- set missing = [] -%}
      {%- for _res in (__run_acmesh_deploy_staging_stat['results'] | ansible.builtin.default([])) -%}
      {%-   if (not (_res['skipped'] | ansible.builtin.default(false))) and
             (_res['stat'] is ansible.builtin.defined) and (not _res['stat']['exists']) -%}
      {%-     set _ = missing.append(_res['item']['staging']) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ missing }}
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - not ansible_check_mode


- name: "Cert | Default | Check for staged deployment drift (staged deployment)"
  # The command module is used here: the deploy helper is the single source
  # of truth for deployment state and its --check mode is read-only. This is
  # the exact command line of the acmesh-deploy-* service's ExecStart=, so a
  # broken helper or interpreter path surfaces during the Ansible run instead
  # of at the next renewal. Exit code 3 means "drift, deployment needed" and
  # is not a failure. Runs in check mode too (read-only) to report pending
  # deployment changes; skipped while the manifest does not exist yet (fresh
  # or migrating host in check mode).
  ansible.builtin.command:
    argv:
      - "{{ __run_acmesh_deploy_python_exec_path }}"
      - "{{ __run_acmesh_deploy_helper_path }}"
      - "--check"
      - "{{ __run_acmesh_deploy_manifest_dir_path }}/{{ item['item']['cert_id'] }}.json"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - item['stat'] is ansible.builtin.defined
    - item['stat']['exists']
  changed_when:
    - false
  failed_when:
    - (__run_acmesh_deploy_check_result['rc'] | ansible.builtin.default(0)) not in [0, 3]
  check_mode: false
  loop: "{{ __run_acmesh_deploy_manifest_stat['results'] | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ item['item']['domain'] | ansible.builtin.default('skipped') }}"
  register: __run_acmesh_deploy_check_result


- name: "Cert | Default | Get the last result of the deploy service unit(s) (staged deployment)"
  # The command module is used here: ansible.builtin.systemd_service cannot
  # query a unit's last result without changing its state. A previously
  # failed (e.g. path-triggered, during renewal) deployment must resurface:
  # the service gets started again below even without content drift.
  ansible.builtin.command:
    argv:
      - "{{ __run_acmesh_systemctl_exec_path }}"
      - "show"
      - "--property=Result"
      - "{{ __run_acmesh_deploy_unit_prefix }}{{ item['item']['cert_id'] }}.service"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - item['stat'] is ansible.builtin.defined
    - item['stat']['exists']
  changed_when:
    - false
  check_mode: false
  loop: "{{ __run_acmesh_deploy_manifest_stat['results'] | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ item['item']['domain'] | ansible.builtin.default('skipped') }}"
  register: __run_acmesh_deploy_unit_result


- name: "Cert | Default | Determine certificates requiring deployment (staged deployment)"
  ansible.builtin.set_fact:
    __run_acmesh_deploy_pending: >-
      {%- set pending = [] -%}
      {%- for _res in (__run_acmesh_deploy_check_result['results'] | ansible.builtin.default([])) -%}
      {%-   if (not (_res['skipped'] | ansible.builtin.default(false))) and
             ((_res['rc'] | ansible.builtin.default(0)) == 3) -%}
      {%-     set _ = pending.append(_res['item']['item']['cert_id']) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- for _res in (__run_acmesh_deploy_unit_result['results'] | ansible.builtin.default([])) -%}
      {%-   if (not (_res['skipped'] | ansible.builtin.default(false))) and
             ((_res['stdout'] | ansible.builtin.default('Result=success') | ansible.builtin.trim) != 'Result=success') and
             (_res['item']['item']['cert_id'] not in pending) -%}
      {%-     set _ = pending.append(_res['item']['item']['cert_id']) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ pending }}
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined


- name: "Cert | Default | Deploy staged certificate file(s) via the deploy service unit(s)"
  # Deliberately started through systemd instead of calling the helper
  # directly: a failing deployment leaves the acmesh-deploy-* unit in a
  # failed state (visible via systemctl --failed) exactly like later
  # path-triggered runs, and systemd's job coalescing plus the helper's
  # per-certificate lock keep a concurrent path-triggered start safe.
  ansible.builtin.systemd_service:
    name: "{{ __run_acmesh_deploy_unit_prefix }}{{ item['cert_id'] }}.service"
    state: "started"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - item['cert_id'] in (__run_acmesh_deploy_pending | ansible.builtin.default([]))
  loop: "{{ __run_acmesh_install_normalized_staged }}"
  loop_control:
    label: "{{ item['domain'] }}"


- name: "Cert | Default | Manage (enable and start) acmesh-deploy-*.path unit(s)"
  # Armed after the first synchronous deployment; future renewals then
  # trigger the deployment automatically.
  ansible.builtin.systemd_service:
    name: "{{ __run_acmesh_deploy_unit_prefix }}{{ item['item']['cert_id'] }}.path"
    enabled: true
    state: "started"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - item['stat'] is ansible.builtin.defined
    - item['stat']['exists']
  loop: "{{ __run_acmesh_deploy_manifest_stat['results'] | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ item['item']['domain'] | ansible.builtin.default('skipped') }}"


# Verification and reconciliation of the final files and their metadata, for
# both strategies. For "staged" this is a no-op after a successful deployment
# (the helper already applied ownership and modes); for "direct" it is the
# enforcement of the effective permissions. External changes (e.g. a chmod by
# a later playbook task) are overwritten on the next run - express such
# requirements via install.permissions instead.
- name: "Cert | Default | Get information about the installed certificate file(s)"
  ansible.builtin.stat:
    path: "{{ item['dest'] }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
  loop: "{{ __run_acmesh_install_artifacts_flat }}"
  loop_control:
    label: "{{ item['domain'] }}: {{ item['dest'] }}"
  register: __run_acmesh_installed_files_stat


- name: "Cert | Default | Reconcile ownership and permissions of the installed certificate file(s)"
  ansible.builtin.file:
    path: "{{ item['item']['dest'] }}"
    state: "file"
    owner: "{{ item['item']['owner'] }}"
    group: "{{ item['item']['group'] }}"
    mode: "{{ item['item']['mode'] }}"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - item['stat'] is ansible.builtin.defined
    - item['stat']['exists']
  loop: "{{ __run_acmesh_installed_files_stat['results'] | ansible.builtin.default([]) }}"
  loop_control:
    label: >-
      {{ item['item']['domain'] | ansible.builtin.default('skipped') }}:
      {{ item['item']['dest'] | ansible.builtin.default('') }}


- name: "Cert | Default | Check every configured certificate file is deployed and fail if unmet"
  ansible.builtin.assert:
    that:
      - "(__run_acmesh_installed_files_missing | ansible.builtin.length) == 0"
    fail_msg: >-
      The following configured certificate file(s) do not exist after
      installation and deployment:
      {{ __run_acmesh_installed_files_missing | ansible.builtin.join(', ') }}.
    quiet: true
  vars:
    __run_acmesh_installed_files_missing: >-
      {%- set missing = [] -%}
      {%- for _res in (__run_acmesh_installed_files_stat['results'] | ansible.builtin.default([])) -%}
      {%-   if (not (_res['skipped'] | ansible.builtin.default(false))) and
             (_res['stat'] is ansible.builtin.defined) and (not _res['stat']['exists']) -%}
      {%-     set _ = missing.append(_res['item']['dest']) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ missing }}
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - not ansible_check_mode


- name: "Cert | Default | Verify the staged deployment(s) are complete (staged deployment)"
  # The command module is used here: same read-only helper probe as above; a
  # nonzero exit (including remaining drift) fails the role because the
  # deployment just ran.
  ansible.builtin.command:
    argv:
      - "{{ __run_acmesh_deploy_python_exec_path }}"
      - "{{ __run_acmesh_deploy_helper_path }}"
      - "--check"
      - "{{ __run_acmesh_deploy_manifest_dir_path }}/{{ item['item']['cert_id'] }}.json"
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - not ansible_check_mode
    - item['stat'] is ansible.builtin.defined
    - item['stat']['exists']
  changed_when:
    - false
  failed_when:
    - __run_acmesh_deploy_verify_result is ansible.builtin.failed
  loop: "{{ __run_acmesh_deploy_manifest_stat['results'] | ansible.builtin.default([]) }}"
  loop_control:
    label: "{{ item['item']['domain'] | ansible.builtin.default('skipped') }}"
  register: __run_acmesh_deploy_verify_result


- name: "Cert | Default | Update certificate hook and reload cmd configurations"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to interact with the
  #   acme.sh configuration file of a certificate. This needs complex string
  #   processing with base64 encoding/decoding, multiple Ansible tasks would
  #   be overkill. Feel free to write an Ansible module instead and remove this
  #   then (patched welcome).
  # - This is a workaround for an upstream issue and might get removed when
  #   the functionality gets added upstream:
  #   https://github.com/acmesh-official/acme.sh/issues/3936.
  #
  # Notes on the command or script itself:
  #
  # See the official documentation for a explanation of the influenced feature
  # https://github.com/acmesh-official/acme.sh/wiki/Using-pre-hook-post-hook-renew-hook-reloadcmd
  ansible.builtin.shell:
    cmd: |
      set -u # Fail on unset vars
      set -o pipefail # Fail if any pipe cmd fails
      set -e # Exit on errors

      # Input parameters
      CERT_HOME={{ run_acmesh_cfg_cert_home | ansible.builtin.quote }}
      PRIMARY_DOMAIN={{ item['domains'][0]['name'] | ansible.builtin.quote }}
      EXPECTED_PRE_HOOK={{ item['pre_hook'] | ansible.builtin.default('') | ansible.builtin.quote }}
      EXPECTED_POST_HOOK={{ item['post_hook'] | ansible.builtin.default('') | ansible.builtin.quote }}
      EXPECTED_RENEW_HOOK={{ item['renew_hook'] | ansible.builtin.default('') | ansible.builtin.quote }}
      # Always empty: reload commands are executed by the root-side
      # acmesh-reload-* systemd path units, not by acme.sh. This also clears
      # any Le_ReloadCmd stored by acme.sh or by version 2.x and below of this
      # role, which would otherwise fail (or run with unexpected privileges)
      # during unprivileged renewal.
      EXPECTED_RELOAD_CMD=''

      # Function: Decode base64 value from config line
      decode_value() {
          local line="${1}"
          base64_value=$(printf '%s' "${line}" | {{ __run_acmesh_sed_exec_path }} -n 's/.*__ACME_BASE64__START_\([^_]*\)__ACME_BASE64__END_.*/\1/p')
          if [ -n "${base64_value}" ]
          then
              printf '%s' "${base64_value}" | {{ __run_acmesh_base64_exec_path }} -d
          else
              printf ''
          fi
      }

      # Function: Base64 encode value from config line
      encode_value() {
          local value="$1"
          if [ -n "$value" ]
          then
              printf '%s' "__ACME_BASE64__START_$(printf '%s' "$value" | {{ __run_acmesh_base64_exec_path }} -w 0)__ACME_BASE64__END_"
          else
              printf ''
          fi
      }

      # Function: update a hook or renew command in config file
      update_b64option_in_config() {
          local config_file="${1}"
          local b64option_name="${2}"
          local new_value="${3}"
          local encoded_value="$(encode_value "${new_value}")"

          if [ -n "${encoded_value}" ]
          then
              # Update existing line
              if {{ __run_acmesh_grep_exec_path }} -q "^${b64option_name}=" "${CONFIG_FILE}"
              then
                  {{ __run_acmesh_sed_exec_path }} -i "s|^${b64option_name}=.*|${b64option_name}='${encoded_value}'|" "${CONFIG_FILE}"
              # Add new line
              else
                  printf '%s\n' "${b64option_name}='${encoded_value}'" >> "${CONFIG_FILE}"
              fi
          else
              # Set empty value in extsting line
              if {{ __run_acmesh_grep_exec_path }} -q "^${b64option_name}=" "${CONFIG_FILE}"
              then
                  {{ __run_acmesh_sed_exec_path }} -i "s|^${b64option_name}=.*|${b64option_name}=''|" "${CONFIG_FILE}"
              # Add new line
              else
                  printf '%s\n' "${b64option_name}=''" >> "${CONFIG_FILE}"
              fi
          fi
      }

      # Find the certificate config file. Try different possible locations:
      # ECC (most common / default), RSA, or unspecified (legacy default RSA)
      CONFIG_FILE=""
      for suffix in "_ecc" "_rsa" ""
      do
          possible_path="${CERT_HOME}/${PRIMARY_DOMAIN}${suffix}/${PRIMARY_DOMAIN}.conf"
          if [ -f "${possible_path}" ]
          then
              CONFIG_FILE="${possible_path}"
              break
          fi
      done
      if [ -z "${CONFIG_FILE}" ]
      then
          printf "error: No certificate config file found for domain: %s" "${PRIMARY_DOMAIN}" 1>&2
          exit 1
      fi

      # Process config file
      CURRENT_PRE_HOOK=""
      CURRENT_POST_HOOK=""
      CURRENT_RENEW_HOOK=""
      CURRENT_RELOAD_CMD=""
      while IFS= read -r line
      do
          case "${line}" in
              Le_PreHook=*)
                  CURRENT_PRE_HOOK="$(decode_value "${line}")"
                  ;;
              Le_PostHook=*)
                  CURRENT_POST_HOOK="$(decode_value "${line}")"
                  ;;
              Le_RenewHook=*)
                  CURRENT_RENEW_HOOK="$(decode_value "${line}")"
                  ;;
              Le_ReloadCmd=*)
                  CURRENT_RELOAD_CMD="$(decode_value "${line}")"
                  ;;
          esac
      done < "${CONFIG_FILE}"

      # Track if any changes are made
      CHANGES_MADE=0

      # Compare and update options if different
      if [ ! "$CURRENT_PRE_HOOK" = "${EXPECTED_PRE_HOOK}" ]
      then
          printf "Updating %s for %s: '%s' -> '%s'\n" "Le_PreHook" "${PRIMARY_DOMAIN}" "${CURRENT_PRE_HOOK}" "${EXPECTED_PRE_HOOK}"
          update_b64option_in_config "${CONFIG_FILE}" "Le_PreHook" "${EXPECTED_PRE_HOOK}"
          CHANGES_MADE=1
      fi

      if [ ! "$CURRENT_POST_HOOK" = "${EXPECTED_POST_HOOK}" ]
      then
          printf "Updating %s for %s: '%s' -> '%s'\n" "Le_PostHook" "${PRIMARY_DOMAIN}" "${CURRENT_POST_HOOK}" "${EXPECTED_POST_HOOK}"
          update_b64option_in_config "${CONFIG_FILE}" "Le_PostHook" "${EXPECTED_POST_HOOK}"
          CHANGES_MADE=1
      fi

      if [ ! "$CURRENT_RENEW_HOOK" = "${EXPECTED_RENEW_HOOK}" ]
      then
          printf "Updating %s for %s: '%s' -> '%s'\n" "Le_RenewHook" "${PRIMARY_DOMAIN}" "${CURRENT_RENEW_HOOK}" "${EXPECTED_RENEW_HOOK}"
          update_b64option_in_config "${CONFIG_FILE}" "Le_RenewHook" "${EXPECTED_RENEW_HOOK}"
          CHANGES_MADE=1
      fi

      if [ ! "${CURRENT_RELOAD_CMD}" = "${EXPECTED_RELOAD_CMD}" ]
      then
          printf "Updating %s for %s: '%s' -> '%s'\n" "Le_ReloadCmd" "${PRIMARY_DOMAIN}" "${CURRENT_RELOAD_CMD}" "${EXPECTED_RELOAD_CMD}"
          update_b64option_in_config "${CONFIG_FILE}" "Le_ReloadCmd" "${EXPECTED_RELOAD_CMD}"
          CHANGES_MADE=1
      fi

      if [ "${CHANGES_MADE}" = "1" ]
      then
          printf "Changed config file: Updated configuration for certificate %s." "${PRIMARY_DOMAIN}"
      fi

      exit 0
    executable: "/bin/bash" # Support for other shells untested (so far)
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - item is ansible.builtin.defined
    - item['domains'] is ansible.builtin.defined
    - (item['domains'] | ansible.builtin.length) > 0
  failed_when:
    - (__run_acmesh_cmdupdates_result is ansible.builtin.failed) or
      ((__run_acmesh_cmdupdates_result['stderr_lines'] | ansible.builtin.length) > 0)
  changed_when:
    - __run_acmesh_cmdupdates_result is ansible.builtin.success
    - __run_acmesh_cmdupdates_result['stdout'] | ansible.builtin.trim | ansible.builtin.length > 0
  # This task does not need the DNS API credentials, so it iterates over the
  # credential-free view to keep its (useful) output while avoiding leaking the
  # per-certificate "environment" values in item labels or on failure.
  loop: "{{ __run_acmesh_certs_no_secrets }}"
  register: __run_acmesh_cmdupdates_result
  notify:
    - "run_acmesh: set ownership and permissions"


- name: "Cert | Default | Display hook and reload cmd configuration update results"
  ansible.builtin.debug:
    msg: "{{ item }}"
    verbosity: 3
  when:
    - __run_acmesh_is_installed
    - run_acmesh_certs is ansible.builtin.defined
    - item | ansible.builtin.length > 0
  loop: >-
    {{
      __run_acmesh_cmdupdates_result['results'] | ansible.builtin.default([])
      | ansible.builtin.selectattr('stdout_lines', 'ansible.builtin.defined')
      | ansible.builtin.selectattr('stdout_lines')
      | ansible.builtin.map(attribute='stdout_lines')
      | ansible.builtin.list
    }}


- name: "Cert | Default | Gather certificate information"
  ansible.builtin.command:
    cmd: >
      {{ __run_acmesh_setpriv_run_as_user }} -- ./acme.sh --list --certhome {{ run_acmesh_cfg_cert_home | ansible.builtin.quote }}
  args:
    chdir: "{{ run_acmesh_cfg_home }}"
  when:
    - __run_acmesh_is_installed
    - ansible_verbosity > 3
  changed_when:
    - false
  register: __run_acmesh_list_domains_result


- name: "Cert | Default | Show certificate information"
  ansible.builtin.debug:
    msg: "{{ __run_acmesh_list_domains_result['stdout_lines'] }}"
    verbosity: 3
  when:
    - __run_acmesh_is_installed
    - __run_acmesh_list_domains_result is ansible.builtin.defined
    - ansible_verbosity > 3
