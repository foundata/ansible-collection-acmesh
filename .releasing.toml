# How this collection is released, read by foundata's `release` command:
# https://github.com/foundata/releasing/blob/main/docs/ansible-collections.md
#
# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later
#
# The version lives in galaxy.yml, antsibull-changelog owns the changelog and
# the artifact is one tarball on Ansible Galaxy. galaxy.yml lists this file
# under build_ignore so that it never ships.
repository = "foundata/ansible-collection-acmesh"
ecosystem = "ansible-collection"

# The Galaxy page renders the README without the HTML block and without
# loading the badge image, so the header becomes one line and the badge a
# text link. Only the shipped copy changes; the committed README keeps both.
[[readmes]]
collapse-header = true
simplify-badges = true
