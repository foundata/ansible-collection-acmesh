    - name: "Molecule | Verify | Gather stats for installed certificate files (webroot challenge)"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "/etc/pki/tls/certs/acmesh-webroot.test/ca.cer"
        - "/etc/pki/tls/certs/acmesh-webroot.test/cert.cer"
        - "/etc/pki/tls/certs/acmesh-webroot.test/fullchain.cer"
        - "/etc/pki/tls/certs/acmesh-webroot.test/cert.key"
      register: __testing_acmesh_webroot_cert_files_stat


    - name: "Molecule | Verify | Check existence, permissions and ownership: installed certificate files (webroot challenge)"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isreg']
          - item['stat']['mode'] == '0640'
          - item['stat']['pw_name'] == run_acmesh_user
          - item['stat']['gr_name'] == run_acmesh_group
        fail_msg: "{{ item['stat']['path'] }} does not exist or has incorrect permissions/ownership"
      loop: "{{ __testing_acmesh_webroot_cert_files_stat['results'] | ansible.builtin.default([]) }}"
      loop_control:
        label: "{{ item['stat']['path'] | ansible.builtin.default('undefined') }}"
      when:
        - __testing_acmesh_webroot_cert_files_stat['results'] is ansible.builtin.defined
        - __testing_acmesh_webroot_cert_files_stat['results'] | ansible.builtin.length > 0


    - name: "Molecule | Verify | Read certificate SAN (Subject Alternative Name) (webroot challenge)"
      ansible.builtin.command:
        argv:
          - "openssl"
          - "x509"
          - "-in"
          - "/etc/pki/tls/certs/acmesh-webroot.test/cert.cer"
          - "-noout"
          - "-ext"
          - "subjectAltName"
      changed_when: false
      register: __testing_acmesh_webroot_cert_san


    - name: "Molecule | Verify | Assert certificate SAN contains expected domain (webroot challenge)"
      ansible.builtin.assert:
        that:
          - "'acmesh-webroot.test' in __testing_acmesh_webroot_cert_san['stdout']"
        fail_msg: >-
          Webroot certificate SAN does not contain 'acmesh-webroot.test'.
          Got: {{ __testing_acmesh_webroot_cert_san['stdout'] }}
        success_msg: "Webroot certificate SAN matches: {{ __testing_acmesh_webroot_cert_san['stdout'] }}"
      when:
        - __testing_acmesh_webroot_cert_san is ansible.builtin.defined


## Reload decoupling: root-side acmesh-reload-* path/service units

- name: "Molecule | Verify | Reload units (webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Gather stats for the reload unit files (webroot challenge)"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.path"
        - "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.service"
      register: __testing_acmesh_reload_files_stat


    - name: "Molecule | Verify | Assert reload unit files exist with root ownership (webroot challenge)"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isreg']
          - item['stat']['pw_name'] == 'root'
          - item['stat']['gr_name'] == 'root'
        fail_msg: "{{ item['item'] }} does not exist or is not owned by root:root"
      loop: "{{ __testing_acmesh_reload_files_stat['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"


    - name: "Molecule | Verify | Read the reload service unit file (webroot challenge)"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.service"
      register: __testing_acmesh_reload_serviceunit_content


    - name: "Molecule | Verify | Assert the reload command is inlined into ExecStart (webroot challenge)"
      # Fidelity of the (systemd-escaped) inlined command is proven end-to-end
      # by the marker content assertions below, which compare the output of
      # the escaping-torture reloadcmd byte-identically.
      ansible.builtin.assert:
        that:
          - >-
            'ExecStart=/bin/sh -c "' in
            (__testing_acmesh_reload_serviceunit_content['content'] | ansible.builtin.b64decode)
        fail_msg: "The reload service unit does not inline the reload command into ExecStart."


    - name: "Molecule | Verify | Get acmesh-reload path unit state (webroot challenge)"
      ansible.builtin.command:
        argv:
          - "systemctl"
          - "show"
          - "acmesh-reload-acmesh-webroot.test.path"
          - "--property=ActiveState,UnitFileState"
      changed_when:
        - false
      register: __testing_acmesh_reload_path_state


    - name: "Molecule | Verify | Assert acmesh-reload path unit is active and enabled (webroot challenge)"
      ansible.builtin.assert:
        that:
          - "'ActiveState=active' in __testing_acmesh_reload_path_state['stdout']"
          - "'UnitFileState=enabled' in __testing_acmesh_reload_path_state['stdout']"
        fail_msg: >-
          The acmesh-reload path unit is not active/enabled:
          {{ __testing_acmesh_reload_path_state['stdout'] }}


    # The converge run installed the certificate files, which must have
    # triggered the path unit; the reloadcmd writes the executing username
    # into the marker file, proving the reload ran as root.
    - name: "Molecule | Verify | Gather stats for the reload marker file written during converge (webroot challenge)"
      ansible.builtin.stat:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_reload_marker_stat


    - name: "Molecule | Verify | Assert the reload marker file was written during converge (webroot challenge)"
      ansible.builtin.assert:
        that:
          - __testing_acmesh_reload_marker_stat['stat']['exists']
        fail_msg: >-
          /var/tmp/acmesh-reload-webroot-marker does not exist: installing the
          certificate files did not trigger the acmesh-reload path unit.


    # Functional round-trip: an unprivileged write to the watched file (as done
    # by the renewal service) must trigger the root-side reload. "dd" with
    # "conv=notrunc" and zero blocks opens the file for writing and closes it
    # again without altering its content, firing the close-after-write event
    # the path unit watches.
    - name: "Molecule | Verify | Remove the reload marker file (webroot challenge)"
      ansible.builtin.file:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        state: "absent"


    - name: "Molecule | Verify | Touch the watched certificate file as the service user (webroot challenge)"
      ansible.builtin.command:
        argv:
          - "runuser"
          - "-u"
          - "{{ run_acmesh_user }}"
          - "--"
          - "dd"
          - "if=/dev/null"
          - "of=/etc/pki/tls/certs/acmesh-webroot.test/fullchain.cer"
          - "conv=notrunc"
      changed_when:
        - true


    - name: "Molecule | Verify | Wait for the reload marker file to reappear (webroot challenge)"
      ansible.builtin.stat:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_reload_marker_stat_retrigger
      until:
        - __testing_acmesh_reload_marker_stat_retrigger['stat']['exists']
      retries: 15
      delay: 2


    - name: "Molecule | Verify | Read the reload marker file (webroot challenge)"
      ansible.builtin.slurp:
        src: "/var/tmp/acmesh-reload-webroot-marker"
      register: __testing_acmesh_reload_marker_content


    - name: "Molecule | Verify | Assert the reload command ran as root and unaltered after an unprivileged file write (webroot challenge)"
      # The expected value starts with "root" (the executing username) and
      # continues with the escaping-torture characters of the configured
      # reloadcmd, so this proves the root context and the byte-identical
      # command round-trip through the systemd unit in one comparison.
      ansible.builtin.assert:
        that:
          - >-
            (__testing_acmesh_reload_marker_content['content'] | ansible.builtin.b64decode | ansible.builtin.trim)
            == __testing_reload_marker_expected
        fail_msg: >-
          The reload command did not run as root or was altered by the systemd
          escaping (marker content:
          {{ __testing_acmesh_reload_marker_content['content'] | ansible.builtin.b64decode | ansible.builtin.trim }};
          expected: {{ __testing_reload_marker_expected }}).
        success_msg: >-
          An unprivileged write to the watched certificate file triggered the
          reload command, which ran as root with byte-identical content.


## Renewal parity
#
# A forced renewal as the unprivileged service user must work end-to-end (issue
# #20). This emulates what acmesh-renewal.service does, including the webroot
# challenge against pebble, the reinstallation of the certificate files and the
# root-side reload trigger.

- name: "Molecule | Verify | Renewal as the service user (webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Remove the reload marker file again (webroot challenge)"
      ansible.builtin.file:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        state: "absent"


    - name: "Molecule | Verify | Force a renewal as the service user (webroot challenge)"
      ansible.builtin.command:
        cmd: >
          runuser -u {{ run_acmesh_user | ansible.builtin.quote }} --
          ./acme.sh
            --renew
            --force
            --ecc
            --domain acmesh-webroot.test
            --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }}
            --certhome {{ run_acmesh_cfg_cert_home | ansible.builtin.quote }}
      args:
        chdir: "{{ run_acmesh_cfg_home }}"
      environment:
        # Mirror the Environment= of acmesh-renewal.service
        HOME: "{{ run_acmesh_cfg_home }}"
      changed_when:
        - true
      register: __testing_acmesh_forced_renewal


    - name: "Molecule | Verify | Assert the forced renewal succeeded (webroot challenge)"
      ansible.builtin.assert:
        that:
          - __testing_acmesh_forced_renewal['rc'] == 0
          - "'Cert success' in __testing_acmesh_forced_renewal['stdout']"
        fail_msg: >-
          Renewing the certificate as the unprivileged service user failed:
          {{ __testing_acmesh_forced_renewal['stdout'] | ansible.builtin.default('') }}
          {{ __testing_acmesh_forced_renewal['stderr'] | ansible.builtin.default('') }}


    - name: "Molecule | Verify | Wait for the reload marker file after the renewal (webroot challenge)"
      ansible.builtin.stat:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_reload_marker_stat_renewal
      until:
        - __testing_acmesh_reload_marker_stat_renewal['stat']['exists']
      retries: 15
      delay: 2


    - name: "Molecule | Verify | Read the reload marker file after the renewal (webroot challenge)"
      ansible.builtin.slurp:
        src: "/var/tmp/acmesh-reload-webroot-marker"
      register: __testing_acmesh_reload_marker_content_renewal


    - name: "Molecule | Verify | Assert the renewal reinstalled the certificate and triggered the root-side reload"
      ansible.builtin.assert:
        that:
          - >-
            (__testing_acmesh_reload_marker_content_renewal['content'] | ansible.builtin.b64decode | ansible.builtin.trim)
            == __testing_reload_marker_expected
        fail_msg: >-
          The unprivileged renewal did not trigger the root-side reload
          (marker content:
          {{ __testing_acmesh_reload_marker_content_renewal['content'] | ansible.builtin.b64decode | ansible.builtin.trim }};
          expected: {{ __testing_reload_marker_expected }}).
        success_msg: >-
          The unprivileged renewal reinstalled the certificate files and the
          reload command ran as root.


    # The renewal ran without any Ansible ownership fixups afterwards, so this
    # is a meaningful check that the whole acme.sh runtime operates as the
    # service user (a root-owned file here would mean some step still runs
    # with too many privileges).
    - name: "Molecule | Verify | Find files not owned by the service user after the unprivileged renewal"
      ansible.builtin.command:
        argv:
          - "find"
          - "{{ run_acmesh_cfg_home }}"
          - "{{ run_acmesh_cfg_config_home }}"
          - "{{ run_acmesh_cfg_cert_home }}"
          - "/etc/pki/tls/certs/acmesh-webroot.test"
          - "!"
          - "-user"
          - "{{ run_acmesh_user }}"
      changed_when:
        - false
      register: __testing_acmesh_foreign_owned_files


    - name: "Molecule | Verify | Assert no foreign-owned files exist after the unprivileged renewal"
      ansible.builtin.assert:
        that:
          - (__testing_acmesh_foreign_owned_files['stdout'] | ansible.builtin.trim | ansible.builtin.length) == 0
        fail_msg: >-
          Files not owned by {{ run_acmesh_user }} found after the unprivileged
          renewal: {{ __testing_acmesh_foreign_owned_files['stdout_lines'] | ansible.builtin.default([]) }}


## Declarative certificate removal
#
# The run_acmesh_certs_delete_unmanaged sweep reaps certificate data and reload
# units of unlisted certificates, and a per-certificate state "absent" removes
# everything belonging to that certificate (including the installed files).

- name: "Molecule | Verify | Unmanaged certificate data removal (delete_unmanaged sweep)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Plant stray certificate data directory"
      ansible.builtin.file:
        path: "{{ run_acmesh_cfg_cert_home }}/stray-reap.test_ecc"
        state: "directory"
        owner: "{{ run_acmesh_user }}"
        group: "{{ run_acmesh_group }}"
        mode: "u=rwx,g=rx,o="


    - name: "Molecule | Verify | Plant stray certificate config file"
      ansible.builtin.copy:
        dest: "{{ run_acmesh_cfg_cert_home }}/stray-reap.test_ecc/stray-reap.test.conf"
        content: |
          Le_Domain='stray-reap.test'
        owner: "{{ run_acmesh_user }}"
        group: "{{ run_acmesh_group }}"
        mode: "u=rw,g=r,o="


    - name: "Molecule | Verify | Plant stray reload path unit file"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/acmesh-reload-stray-reap.test.path"
        content: |
          [Unit]
          Description=stray reload unit for reap testing

          [Path]
          PathChanged=/var/tmp/nonexistent-stray-reap-watch

          [Install]
          WantedBy=multi-user.target
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r" # 0644


    - name: "Molecule | Verify | Plant stray reload service unit file"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/acmesh-reload-stray-reap.test.service"
        content: |
          [Unit]
          Description=stray reload unit for reap testing

          [Service]
          Type=oneshot
          ExecStart=/bin/true
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r" # 0644


    - name: "Molecule | Verify | Include the foundata.acmesh.run role (with run_acmesh_certs_delete_unmanaged)"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_certs_delete_unmanaged: true


    - name: "Molecule | Verify | Gather stats for stray and managed resources after the sweep"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "{{ run_acmesh_cfg_cert_home }}/stray-reap.test_ecc"
        - "/etc/systemd/system/acmesh-reload-stray-reap.test.path"
        - "/etc/systemd/system/acmesh-reload-stray-reap.test.service"
        - "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test_ecc"
        - "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.path"
      register: __testing_acmesh_sweep_stat


    - name: "Molecule | Verify | Assert the sweep removed stray resources and kept managed ones"
      ansible.builtin.assert:
        that:
          - not __testing_acmesh_sweep_stat['results'][0]['stat']['exists']
          - not __testing_acmesh_sweep_stat['results'][1]['stat']['exists']
          - not __testing_acmesh_sweep_stat['results'][2]['stat']['exists']
          - __testing_acmesh_sweep_stat['results'][3]['stat']['exists']
          - __testing_acmesh_sweep_stat['results'][4]['stat']['exists']
        fail_msg: >-
          run_acmesh_certs_delete_unmanaged did not remove exactly the stray
          resources: {{ __testing_acmesh_sweep_stat['results']
                        | ansible.builtin.map(attribute='stat.exists') | ansible.builtin.list }}
          for {{ __testing_acmesh_sweep_stat['results']
                 | ansible.builtin.map(attribute='item') | ansible.builtin.list }}
        success_msg: >-
          The sweep removed the stray certificate data and reload units while
          keeping the managed webroot certificate untouched.


- name: "Molecule | Verify | Per-certificate removal (state 'absent', webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Include the foundata.acmesh.run role (webroot certificate with state 'absent')"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_certs: >-
          {{
            [
              (__testing_state['run_acmesh_certs']
               | ansible.builtin.selectattr('domains.0.name', 'ansible.builtin.equalto', 'acmesh-webroot.test')
               | ansible.builtin.first)
              | ansible.builtin.combine({'state': 'absent'})
            ]
          }}


    - name: "Molecule | Verify | Gather stats for the removed webroot certificate resources"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test"
        - "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test_ecc"
        - "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test_rsa"
        - "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.path"
        - "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.service"
        - "/etc/pki/tls/certs/acmesh-webroot.test/ca.cer"
        - "/etc/pki/tls/certs/acmesh-webroot.test/cert.cer"
        - "/etc/pki/tls/certs/acmesh-webroot.test/fullchain.cer"
        - "/etc/pki/tls/certs/acmesh-webroot.test/cert.key"
      register: __testing_acmesh_certabsent_stat


    - name: "Molecule | Verify | Assert all data of the removed certificate is gone"
      ansible.builtin.assert:
        that:
          - not item['stat']['exists']
        fail_msg: "{{ item['item'] }} still exists although the certificate was removed with state 'absent'"
      loop: "{{ __testing_acmesh_certabsent_stat['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"


    - name: "Molecule | Verify | Gather stats for the installation directory of the removed certificate"
      ansible.builtin.stat:
        path: "/etc/pki/tls/certs/acmesh-webroot.test"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_certabsent_installdir_stat


    - name: "Molecule | Verify | Assert the installation directory of the removed certificate is kept"
      # Only the installed files get removed; the directory may be shared
      # with other software.
      ansible.builtin.assert:
        that:
          - __testing_acmesh_certabsent_installdir_stat['stat']['exists']
          - __testing_acmesh_certabsent_installdir_stat['stat']['isdir']
        fail_msg: >-
          The installation directory was removed although only the installed
          certificate files of a state=absent certificate may be deleted.


- name: "Molecule | Verify | Reload units: negative check (dns-persist-01 certificate, empty reloadcmd)"
