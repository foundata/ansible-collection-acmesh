# List of package names to be installed when run_acmesh_state is
# set to "present".
__run_acmesh_packages_install:
  # We maintain this package list separately from the platform-specific
  # variables in this directory because these packages likely have the same
  # names across both supported platforms and unsupported, best-effort
  # platforms.
  #
  # For executing this role and/or Ansible itself
  - "git" # Download release form upstream
  # For acme.sh
  - "curl" # Communicate with the CA
  - "openssl"


# List of package names to be uninstalled when run_acmesh_state is
# set to "absent". This variable is useful when __run_acmesh_packages_install
# contains packages that are required for the managed software to function but
# should not be removed during uninstallation, as doing so could break other
# software. This is usually the case if there are common dependencies like
# "curl" or "openssl" which typically should remain installed even after
# uninstalling the software managed by this role.
__run_acmesh_packages_uninstall: []


# List of package names to be removed unconditionally before installation
# (e.g., to prevent conflicts or resolve incompatibilities).
__run_acmesh_packages_removal: []


# List of paths of files and directories to be removed unconditionally after
# installation. This is useful for removing default configuration resources
# that would otherwise create confusion or conflict with custom configurations
# managed by this role.
__run_acmesh_paths_removal: []


# Dictionary of files to be overwritten with a managed comment instead of being
# deleted. Keys are file paths; values are the single-line comment characters to
# use. This is needed on platforms where the package manager reinstalls deleted
# files on package update. Restored files would conflict with the managed
# configuration, while modified files are preserved. For example, RPM with
# %config(noreplace) restores missing files but preserves modified ones.
__run_acmesh_paths_neutralize: {}


# Path to the environment file sourced in /etc/profile.d/. This file ensures
# that acme.sh environment variables are set for all users.
__run_acmesh_profiled_envfile_path: "/etc/profile.d/acme.sh.env.sh"


# Path to the systemd service unit file for acme.sh certificate renewal. This
# defines the command and execution environment for automated certificate renewal.
__run_acmesh_systemd_renewal_servicefile_path: "/etc/systemd/system/acmesh-renewal.service"
__run_acmesh_systemd_renewal_servicefile_owner: "root"
__run_acmesh_systemd_renewal_servicefile_group: "root"
__run_acmesh_systemd_renewal_servicefile_mode: "u=rw,g=r,o=r" # 0644


# Path to the systemd timer unit file for acme.sh certificate renewal. This
# timer schedules the execution of the renewal service at regular intervals.
__run_acmesh_systemd_renewal_timerfile_path: "/etc/systemd/system/acmesh-renewal.timer"
__run_acmesh_systemd_renewal_timerfile_owner: "root"
__run_acmesh_systemd_renewal_timerfile_group: "root"
__run_acmesh_systemd_renewal_timerfile_mode: "u=rw,g=r,o=r" # 0644


# modes for differt acme.sh directories and files
__run_acmesh_cfg_home_dir_mode: "u=rwx,g=rx,o=" # 0750; used for run_acmesh_cfg_home
__run_acmesh_cfg_config_home_dir_mode: "u=rwx,g=rx,o=" # 0750; used for run_acmesh_cfg_config_home

__run_acmesh_cfg_account_key_file_mode: "u=rw,g=,o=" # 0600; especially sensitiv when dns-persist-01 is used

__run_acmesh_cfg_cert_home_dir_mode: "u=rwx,g=rx,o=,g+s" # 2750 (new files inherit directory group); used for run_acmesh_cfg_cert_home
__run_acmesh_cfg_cert_home_file_mode: "u=rw,g=r,o=" # 0640; used for files in run_acmesh_cfg_cert_home

__run_acmesh_cfg_cert_install_dir_mode: "{{ __run_acmesh_cfg_cert_home_dir_mode }}"
__run_acmesh_cfg_cert_install_file_mode: "{{ __run_acmesh_cfg_cert_home_file_mode }}"

__run_acmesh_cfg_logfile_file_mode: "u=rw,g=,o=" # 0600; used for run_acmesh_cfg_logfile


# Paths of misc executables and resources.
__run_acmesh_sha1sum_exec_path: "/usr/bin/sha1sum"
__run_acmesh_base64_exec_path: "/usr/bin/base64"
__run_acmesh_sed_exec_path: "/usr/bin/sed"
__run_acmesh_grep_exec_path: "/usr/bin/grep"
__run_acmesh_setpriv_exec_path: "/usr/bin/setpriv"
__run_acmesh_systemctl_exec_path: "/usr/bin/systemctl"


# Command prefix that switches to the unprivileged service user before running
# acme.sh, so that issuance and installation run in the same context as the
# automated renewal (acmesh-renewal.service, User=) and permission problems
# surface immediately instead of weeks later at the first renewal.
#
# setpriv (util-linux) is used instead of Ansible's become/become_user because
# it does not depend on a become plugin or on sudo being installed, keeps the
# task environment (DNS API credentials, HOME), and can grant ambient
# capabilities where a certificate needs a privileged port (see the issue
# task). The role runs as root, so no PAM or password handling is involved.
# Tasks append "--" and the actual command; the issue task inserts
# "--inh-caps +net_bind_service --ambient-caps +net_bind_service" first when a
# privileged-port standalone/alpn challenge is configured.
__run_acmesh_setpriv_run_as_user: >-
  {{ __run_acmesh_setpriv_exec_path }}
  --reuid {{ run_acmesh_user | ansible.builtin.quote }}
  --regid {{ run_acmesh_group | ansible.builtin.quote }}
  --init-groups


