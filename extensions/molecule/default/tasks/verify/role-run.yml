          - run_acmesh_certs[0]['install']['fullcain_file'] is not ansible.builtin.defined
          - run_acmesh_certs[1]['install']['fullcain_file'] is not ansible.builtin.defined
        fail_msg: "Deprecated fullcain_file alias normalization disturbed run_acmesh_certs."
        success_msg: "Deprecated fullcain_file alias was normalized without disturbing run_acmesh_certs."
      vars:
        __testing_run_acmesh_certs_fullcain_alias_expected:
          - domains:
              - name: "fullcain-alias.test"
                challenge:
                  type: "dns"
                  dns_provider: "dns_inwx"
                  challenge_alias: "_acme-challenge.fullcain-alias.test.example.net"
                  domain_alias: "fullcain-alias-validation.test"
              - name: "www.fullcain-alias.test"
                challenge:
                  type: "webroot"
                  webroot: "/var/www/acmesh-test/www"
                  httpport: 8080
              - name: "alpn.fullcain-alias.test"
                challenge:
                  type: "alpn"
                  tlsport: 8443
              - name: "persist.fullcain-alias.test"
                challenge:
                  type: "dns_persist"
                  dns_persist_wildcard: true
                  dns_persist_ca_name: "letsencrypt-test"
                  dns_persist_days: 14
            install:
              ca_file: "/tmp/fullcain-alias.test/ca.cer"
              cert_file: "/tmp/fullcain-alias.test/cert.cer"
              fullchain_file: "/tmp/fullcain-alias.test/fullchain.cer"
              key_file: "/tmp/fullcain-alias.test/cert.key"
              reloadcmd: "true reload_alias"
            server: "letsencrypt_test"
            force: true
            debug: true
            dnssleep: 15
            pre_hook: "true pre_alias"
            post_hook: "true post_alias"
            renew_hook: "true renew_alias"
            extra_flags: "--preferred-chain 'ISRG Root X1' --keylength ec-256"
            environment:
              INWX_User: "alias-user"
              INWX_Password: "alias-password"
              CUSTOM_FLAG: "alias"
          - domains:
              - name: "canonical-fullchain.test"
                challenge:
                  type: "standalone"
                  httpport: 8081
            install:
              ca_file: "/tmp/canonical-fullchain.test/ca.cer"
              cert_file: "/tmp/canonical-fullchain.test/cert.cer"
              fullchain_file: "/tmp/canonical-fullchain.test/fullchain.cer"
              key_file: "/tmp/canonical-fullchain.test/cert.key"
              reloadcmd: ""
            server: "https://acme-staging-v02.api.letsencrypt.org/directory"
            force: false
            debug: false
            dnssleep: 0
            pre_hook: ""
            post_hook: ""
            renew_hook: ""
            extra_flags: ""
            environment: {}


## Regression tests: certificate identity validation (init-only)
#
# The first domain is a certificate's identity (acme.sh storage directory,
# acmesh-reload-* unit names), so init must reject entries without usable
# domain names and colliding identities with an actionable message instead of
# failing midway with a templating error or silently skipping cleanups.

- name: "Molecule | Verify | Validate rejection of certificates without usable domain names (init-only)"
  block:

    - name: "Molecule | Verify | Cert identity: include the role's init with unnamed certificates (must fail)"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "init"
      vars:
        run_acmesh_certs:
          # entry without any "domains" key
          - server: "letsencrypt_test"
          # entry with an empty domain name
          - domains:
              - name: ""
                challenge:
                  type: "standalone"

    - name: "Molecule | Verify | Cert identity: force a failure because init accepted unnamed certificates"
      ansible.builtin.fail:
        msg: "The role's init accepted run_acmesh_certs entries without usable domain names."

  rescue:

    - name: "Molecule | Verify | Cert identity: assert the run failed in the domain name check"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('non-empty domain names')
        fail_msg: >-
          The run failed, but not in the domain name check as expected
          (failed task: '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "Certificates without usable domain names are rejected by the role's init."


- name: "Molecule | Verify | Validate rejection of colliding certificate identities (init-only)"
  block:

    - name: "Molecule | Verify | Cert identity: include the role's init with colliding identities (must fail)"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "init"
      vars:
        run_acmesh_certs:
          # duplicated primary domain (shared storage and reload units)
          - domains:
              - name: "duplicate.test"
                challenge:
                  type: "standalone"
          - domains:
              - name: "duplicate.test"
                challenge:
                  type: "webroot"
                  webroot: "/var/www/duplicate.test"
          # distinct primary domains collapsing to the same normalized
          # acmesh-reload-* unit name
          - domains:
              - name: "Case.test"
                challenge:
                  type: "standalone"
          - domains:
              - name: "case.test"
                challenge:
                  type: "standalone"

    - name: "Molecule | Verify | Cert identity: force a failure because init accepted colliding identities"
      ansible.builtin.fail:
        msg: "The role's init accepted run_acmesh_certs entries with colliding certificate identities."

  rescue:

    - name: "Molecule | Verify | Cert identity: assert the run failed in the uniqueness check"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('unique')
        fail_msg: >-
          The run failed, but not in the identity uniqueness check as expected
          (failed task: '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "Colliding certificate identities are rejected by the role's init."


## Regression tests: install strategy and permission normalization (init-only)
#
# __run_acmesh_install_normalized (vars/main.yml) is the single source for
# installation, manifests, directory management, reconciliation and cleanup;
# these tests pin its merge semantics: staged as default when strategy is
# omitted, internal defaults, partial directory/default/per-artifact
# overrides and their precedence.

- name: "Molecule | Verify | Normalization: set a crafted certificate configuration as fact"
  # A fact (not include vars) on purpose: the lazily evaluated normalization
  # is dereferenced after the init include below and must see this input.
  ansible.builtin.set_fact:
    run_acmesh_certs:
      - domains:
          - name: "Normalize.Example.test"
            challenge:
              type: "dns"
              dns_provider: "dns_inwx"
        install:
          key_file: "/tmp/norm/key.pem"
          fullchain_file: "/tmp/norm/fullchain.pem"
          permissions:
            directory:
              group: "root"
            default:
              owner: "root"
            key_file:
              mode: "0600"
      - domains:
          - name: "direct.example.test"
            challenge:
              type: "dns"
              dns_provider: "dns_inwx"
        install:
          strategy: "direct"
          cert_file: "/tmp/direct/cert.pem"


- name: "Molecule | Verify | Normalization: initialize the role with the crafted configuration"
  ansible.builtin.include_role:
    name: "foundata.acmesh.run"
    tasks_from: "init"
    public: true


- name: "Molecule | Verify | Normalization: assert defaults, partial overrides and precedence"
  ansible.builtin.assert:
    that:
      - __run_acmesh_install_normalized == __testing_normalized_expected
    fail_msg: >-
      The normalized install data does not match the expected merge result.
      Got: {{ __run_acmesh_install_normalized }}
    success_msg: >-
      Omitted strategy defaults to staged, internal permission defaults apply
      and partial directory/default/per-artifact overrides merge with the
      documented precedence.
  vars:
    __testing_normalized_expected:
      - domain: "Normalize.Example.test"
        cert_id: "normalize.example.test"
        strategy: "staged"
        staging_dir: "{{ run_acmesh_cfg_cert_deploy_base_dir }}/normalize.example.test"
        completion_key: "fullchain_file"
        directory:
          owner: "{{ run_acmesh_user }}"
          group: "root"
          mode: "2750"
        directories:
          - "/tmp/norm"
        artifacts:
          fullchain_file:
            dest: "/tmp/norm/fullchain.pem"
            staging: "{{ run_acmesh_cfg_cert_deploy_base_dir }}/normalize.example.test/fullchain.cer"
            owner: "root"
            group: "{{ run_acmesh_group }}"
            mode: "0640"
          key_file:
            dest: "/tmp/norm/key.pem"
            staging: "{{ run_acmesh_cfg_cert_deploy_base_dir }}/normalize.example.test/cert.key"
            owner: "root"
            group: "{{ run_acmesh_group }}"
            mode: "0600"
        domains:
          - "Normalize.Example.test"
      - domain: "direct.example.test"
        cert_id: "direct.example.test"
        strategy: "direct"
        staging_dir: "{{ run_acmesh_cfg_cert_deploy_base_dir }}/direct.example.test"
        completion_key: "cert_file"
        directory:
          owner: "{{ run_acmesh_user }}"
          group: "{{ run_acmesh_group }}"
          mode: "2750"
        directories:
          - "/tmp/direct"
        artifacts:
          cert_file:
            dest: "/tmp/direct/cert.pem"
            staging: "{{ run_acmesh_cfg_cert_deploy_base_dir }}/direct.example.test/cert.cer"
            owner: "{{ run_acmesh_user }}"
            group: "{{ run_acmesh_group }}"
            mode: "0640"
        domains:
          - "direct.example.test"


- name: "Molecule | Verify | Normalization: restore the converged certificate configuration"
  ansible.builtin.set_fact:
    run_acmesh_certs: "{{ __testing_state['run_acmesh_certs'] | ansible.builtin.default([]) }}"


- name: "Molecule | Verify | Validate rejection of unknown permission keys (init-only)"
  block:

    - name: "Molecule | Verify | Permissions: include the role's init with an unknown permissions key (must fail)"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "init"
      vars:
        run_acmesh_certs:
          - domains:
              - name: "reject.example.test"
                challenge:
                  type: "dns"
                  dns_provider: "dns_inwx"
            install:
              key_file: "/tmp/reject/key.pem"
              permissions:
                bogus:
                  mode: "0640"

    - name: "Molecule | Verify | Permissions: force a failure because an unknown permissions key was accepted"
      ansible.builtin.fail:
        msg: "The role's init accepted an unknown install.permissions key."

  rescue:

    - name: "Molecule | Verify | Permissions: assert the run failed in the structure check"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('strategies and permission keys')
        fail_msg: >-
          The run failed, but not in the install structure check as expected
          (failed task:
          '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "Unknown install.permissions keys are rejected by the role's init."


- name: "Molecule | Verify | Validate rejection of unsafe private key modes (init-only)"
  block:

    - name: "Molecule | Verify | Permissions: include the role's init with a world-readable key mode (must fail)"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "init"
      vars:
        run_acmesh_certs:
          - domains:
              - name: "reject.example.test"
                challenge:
                  type: "dns"
                  dns_provider: "dns_inwx"
            install:
              key_file: "/tmp/reject/key.pem"
              permissions:
                key_file:
                  mode: "0644"

    - name: "Molecule | Verify | Permissions: force a failure because a world-readable key mode was accepted"
      ansible.builtin.fail:
        msg: "The role's init accepted a world-readable private key mode."

  rescue:

    - name: "Molecule | Verify | Permissions: assert the run failed in the permission value check"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('effective certificate install permissions')
        fail_msg: >-
          The run failed, but not in the permission value check as expected
          (failed task:
          '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "World-readable private key modes are rejected by the role's init."


- name: "Molecule | Verify | Validate rejection of ownership overrides with the direct strategy (init-only)"
  block:

    - name: "Molecule | Verify | Permissions: include the role's init with a direct-strategy ownership override (must fail)"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "init"
      vars:
        run_acmesh_certs:
          - domains:
              - name: "reject.example.test"
                challenge:
                  type: "dns"
                  dns_provider: "dns_inwx"
            install:
              strategy: "direct"
              key_file: "/tmp/reject/key.pem"
              permissions:
                default:
                  owner: "root"

    - name: "Molecule | Verify | Permissions: force a failure because a direct-strategy ownership override was accepted"
      ansible.builtin.fail:
        msg: "The role's init accepted an ownership override with strategy 'direct'."

  rescue:

    - name: "Molecule | Verify | Permissions: assert the run failed in the permission value check (direct strategy)"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('effective certificate install permissions')
        fail_msg: >-
          The run failed, but not in the permission value check as expected
          (failed task:
          '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "Ownership overrides with the direct strategy are rejected by the role's init."


- name: "Molecule | Verify | Validate rejection of a nested deploy base directory (init-only)"
  block:

    - name: "Molecule | Verify | Deploy base: include the role's init with a nested staging base (must fail)"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "init"
      vars:
        run_acmesh_cfg_cert_deploy_base_dir: "{{ run_acmesh_cfg_cert_home }}/deploy"

    - name: "Molecule | Verify | Deploy base: force a failure because a nested staging base was accepted"
      ansible.builtin.fail:
        msg: "The role's init accepted a staging base below run_acmesh_cfg_cert_home."

  rescue:

    - name: "Molecule | Verify | Deploy base: assert the run failed in the deploy base directory check"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('deploy base directory')
        fail_msg: >-
          The run failed, but not in the deploy base directory check as
          expected (failed task:
          '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "A staging base below the acme.sh directories is rejected by the role's init."


## No-secret-leak check (manual)
#
# The per-certificate "environment" mapping holds DNS API credentials. Task
# callbacks print on the controller, so no assertion inside the scenario can
# observe what the output contains. The converge fixtures plant a canary
# credential that rides along the real ones through every code path handling
# that mapping; checking the captured output for it stays a manual step.

- name: "Molecule | Verify | No-secret-leak check: show the manual verification steps"
  ansible.builtin.debug:
    # split() to improve readability for humans
    msg: "{{ __testing_canary_msg.split('\n') }}"
  vars:
    __testing_canary_msg: |-
      Manual check for leaked DNS API credentials:

        ANSIBLE_VERBOSITY=3 ANSIBLE_DIFF_ALWAYS=true molecule test > /tmp/molecule-acmesh.log 2>&1
        grep -n 'molecule-canary-cred-do-not-print-1f9e' /tmp/molecule-acmesh.log

      Any hit is a leak: the canary is a fake credential from the converge
      fixtures and must not appear in the output, not even at -vvv with diff.
      The check is only meaningful for credential-bearing runs, so with the
      TEST_ACMESH_* environment variables set.
  run_once: true # noqa: run-once[task]


- name: "Molecule | Verify | No-secret-leak check: pause so the hint is not scrolled away"
  ansible.builtin.pause:
    seconds: 10
  when:
    - (lookup('ansible.builtin.env', 'TEST_ACMESH_TESTDOMAIN1') | ansible.builtin.trim | ansible.builtin.length) > 0
  run_once: true # noqa: run-once[task]
