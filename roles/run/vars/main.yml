# Internal role variables and values that must NOT be overridden by the user.
#
# Variables defined here usually override earlier definitions due to the high
# precedence of this file. Each variable should have a concise comment above
# it, describing its purpose and how it fits into the role's functionality.

---

# Facts used by the role (gathered on a best-effort basis if needed), as a
# mapping of "gather_subset" name to the ansible_facts keys it provides.
#
# To identify which subset a fact belongs to during development, you can use
# the following snippet:
#
# - ansible.builtin.setup:
#     gather_subset:
#       - '!min'
#       - '<subset_name, see parameter doc for details>'
__run_acmesh_used_facts:
  distribution:
    - "distribution"
    - "distribution_major_version"
    - "distribution_version"
    - "os_family"


# Certificates of run_acmesh_certs the role manages (per-certificate "state"
# is unset or "present"). Every task that registers, issues, installs or
# otherwise maintains certificates operates on this view; entries with
# state: "absent" are handled exclusively by the removal tasks (see
# __run_acmesh_certs_absent_cleanup).
__run_acmesh_certs_managed: >-
  {%- set certs = [] -%}
  {%- for _cert in (run_acmesh_certs | ansible.builtin.default([])) -%}
  {%-   if (_cert['state'] | ansible.builtin.default('present')) != 'absent' -%}
  {%-     set _ = certs.append(_cert) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ certs }}


# __run_acmesh_certs_managed with every per-certificate "environment" mapping
# removed.
#
# A certificate's "environment" holds DNS API credentials. Tasks that iterate
# over the certificates but do not need those credentials loop over this view
# instead, so the credentials never appear in task output (item labels,
# --diff, failure dumps). The credential-consuming tasks (issue, install)
# still use the certificate data directly and are marked no_log.
__run_acmesh_certs_no_secrets: >-
  {{
    __run_acmesh_certs_managed
    | ansible.builtin.map('ansible.builtin.dict2items')
    | ansible.builtin.map('ansible.builtin.rejectattr', 'key', 'ansible.builtin.eq', 'environment')
    | ansible.builtin.map('ansible.builtin.items2dict')
    | ansible.builtin.list
  }}


# Removal data for every certificate with state: "absent", credential-free
# (safe for loop labels). Per entry:
#
# - domain: the certificate's primary domain.
# - unit_name: sanitized domain as used in the acmesh-reload-* and
#   acmesh-deploy-* unit names.
# - cert_dirs: possible acme.sh data directories of the certificate below
#   run_acmesh_cfg_cert_home (plain, _ecc and _rsa variants). Removing them
#   also stops the automated renewal for this certificate.
# - installed_files: the configured install file paths. Only the files are
#   removed, not their directories (those may be shared with other software).
# - staging_dir: the staging directory of the "staged" installation strategy.
# - manifest_path: the root-owned deployment manifest of the "staged"
#   installation strategy.
#
# staging_dir and manifest_path are removed regardless of the configured
# strategy: the certificate may have used "staged" before its removal.
__run_acmesh_certs_absent_cleanup: >-
  {%- set entries = [] -%}
  {%- for _cert in (run_acmesh_certs | ansible.builtin.default([])) -%}
  {%-   if (_cert['state'] | ansible.builtin.default('present')) == 'absent' -%}
  {%-     set _domain = (_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('') -%}
  {%-     set _unit_name = _domain | ansible.builtin.lower | ansible.builtin.regex_replace('[^a-z0-9.-]', '-') -%}
  {%-     set _install = _cert['install'] | ansible.builtin.default({}) -%}
  {%-     set _files = [] -%}
  {%-     for _key in ['ca_file', 'cert_file', 'fullchain_file', 'key_file'] -%}
  {%-       if (((_install[_key] | ansible.builtin.default('')) | ansible.builtin.length) > 0) -%}
  {%-         set _ = _files.append(_install[_key]) -%}
  {%-       endif -%}
  {%-     endfor -%}
  {%-     if ((_domain | ansible.builtin.length) > 0) -%}
  {%-       set _ = entries.append({
              'domain': _domain,
              'unit_name': _unit_name,
              'cert_dirs': [
                (run_acmesh_cfg_cert_home ~ '/' ~ _domain),
                (run_acmesh_cfg_cert_home ~ '/' ~ _domain ~ '_ecc'),
                (run_acmesh_cfg_cert_home ~ '/' ~ _domain ~ '_rsa'),
              ],
              'installed_files': _files,
              'staging_dir': (run_acmesh_cfg_cert_deploy_base_dir ~ '/' ~ _unit_name),
              'manifest_path': (__run_acmesh_deploy_manifest_dir_path ~ '/' ~ _unit_name ~ '.json'),
            }) -%}
  {%-     endif -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ entries }}


# Primary domains of every listed certificate (any state). Used by the
# delete-unmanaged sweep to decide which acme.sh data directories below
# run_acmesh_cfg_cert_home belong to a known certificate.
__run_acmesh_certs_known_domains: >-
  {%- set domains = [] -%}
  {%- for _cert in (run_acmesh_certs | ansible.builtin.default([])) -%}
  {%-   set _domain = (_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('') -%}
  {%-   if ((_domain | ansible.builtin.length) > 0) -%}
  {%-     set _ = domains.append(_domain) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ domains }}


# Groups from run_acmesh_user_supplementary_groups which do not exist on the
# target, derived from the getent lookups registered in tasks/init.yml (only
# meaningful after these ran).
__run_acmesh_supplementary_groups_missing: >-
  {%- set missing = [] -%}
  {%- for _res in ((__run_acmesh_supplementary_groups_getent | ansible.builtin.default({}))['results'] | ansible.builtin.default([])) -%}
  {%-   if (_res['ansible_facts'] is ansible.builtin.defined) and
           (_res['ansible_facts']['getent_group'][_res['item']] is ansible.builtin.none) -%}
  {%-     set _ = missing.append(_res['item']) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ missing }}


# Whether the unprivileged renewal service (acmesh-renewal.service, runs as
# run_acmesh_user) needs CAP_NET_BIND_SERVICE. acme.sh binds a listening port
# itself only for the "standalone" (HTTP-01, default port 80, overridable with
# httpport) and "alpn" (TLS-ALPN-01, default port 443, overridable with tlsport)
# challenge types; "dns" and "webroot" need no listening port. The capability is
# only required when that port is privileged (< 1024), so a standalone/alpn
# challenge pinned to a high port needs nothing. Evaluated over every domain of
# every configured certificate because a single renewal run (acme.sh --cron)
# renews them all.
__run_acmesh_renewal_needs_net_bind: >-
  {%- set ns = namespace(need=false) -%}
  {%- for _cert in __run_acmesh_certs_managed -%}
  {%-   for _domain in (_cert['domains'] | ansible.builtin.default([])) -%}
  {%-     set _challenge = _domain['challenge'] | ansible.builtin.default({}) -%}
  {%-     set _type = _challenge['type'] | ansible.builtin.default('') -%}
  {%-     if _type == 'standalone' and ((_challenge['httpport'] | ansible.builtin.default(80) | ansible.builtin.int) < 1024) -%}
  {%-       set ns.need = true -%}
  {%-     elif _type == 'alpn' and ((_challenge['tlsport'] | ansible.builtin.default(443) | ansible.builtin.int) < 1024) -%}
  {%-       set ns.need = true -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ ns.need }}


# Reload handling: acme.sh does not get a --reloadcmd anymore. Instead, a
# root-side systemd path unit per certificate watches the installed certificate
# files and starts a service unit of the same name which runs the configured
# "reloadcmd" as root. This works identically for initial issuance, automated
# renewal (which runs unprivileged) and manual acme.sh runs, without granting
# the service user any privileges.
#
# Naming and locations shared by the tasks managing these resources. The unit
# names are derived from the certificate's primary domain (see
# __run_acmesh_reload_units below).
__run_acmesh_reload_unit_prefix: "acmesh-reload-"
__run_acmesh_reload_unitfile_dir: "/etc/systemd/system"
__run_acmesh_reload_unitfile_owner: "root"
__run_acmesh_reload_unitfile_group: "root"
__run_acmesh_reload_unitfile_mode: "u=rw,g=r,o=r" # 0644


# List of reload units to manage, one entry per certificate with a non-empty
# "reloadcmd". Each entry provides:
#
# - name: unit/script name part, the certificate's primary domain with every
#   character that is not allowed in systemd unit names replaced by "-".
# - domain: the certificate's primary domain (for descriptions/messages).
# - watch_path: the installed certificate file the path unit watches. acme.sh
#   installs the files in the fixed order cert_file, ca_file, key_file,
#   fullchain_file (see _installcert()), so the last one of the configured
#   files is watched: when it is written, the whole set is consistent and the
#   services can be reloaded safely.
# - reloadcmd: the configured reload command, inlined into the service unit's
#   ExecStart= (systemd-escaped there, see tasks/config/default.yml).
#
# Certificates whose "reloadcmd" is set but which do not define any of the
# install file paths cannot be watched; they are collected in
# __run_acmesh_reload_units_missing_watch and rejected in tasks/init.yml.
__run_acmesh_reload_units: >-
  {%- set units = [] -%}
  {%- for _cert in __run_acmesh_certs_managed -%}
  {%-   set _install = _cert['install'] | ansible.builtin.default({}) -%}
  {%-   set _reloadcmd = _install['reloadcmd'] | ansible.builtin.default('') -%}
  {%-   set _ns = namespace(watch='') -%}
  {%-   for _key in ['fullchain_file', 'key_file', 'ca_file', 'cert_file'] -%}
  {%-     if ((_ns.watch | ansible.builtin.length) == 0) and
             (((_install[_key] | ansible.builtin.default('')) | ansible.builtin.length) > 0) -%}
  {%-       set _ns.watch = _install[_key] -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%-   if ((_reloadcmd | ansible.builtin.length) > 0) and ((_ns.watch | ansible.builtin.length) > 0) -%}
  {%-     set _domain = (_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('') -%}
  {%-     set _ = units.append({
            'name': (_domain | ansible.builtin.lower | ansible.builtin.regex_replace('[^a-z0-9.-]', '-')),
            'domain': _domain,
            'watch_path': _ns.watch,
            'reloadcmd': _reloadcmd,
          }) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ units }}


# Primary domains of certificates with a non-empty "reloadcmd" but without any
# install file path to watch. Used by tasks/init.yml to fail early with a
# helpful message (the reload command of such a certificate would never run).
__run_acmesh_reload_units_missing_watch: >-
  {%- set domains = [] -%}
  {%- for _cert in __run_acmesh_certs_managed -%}
  {%-   set _install = _cert['install'] | ansible.builtin.default({}) -%}
  {%-   set _ns = namespace(watch='') -%}
  {%-   for _key in ['fullchain_file', 'key_file', 'ca_file', 'cert_file'] -%}
  {%-     if ((_ns.watch | ansible.builtin.length) == 0) and
             (((_install[_key] | ansible.builtin.default('')) | ansible.builtin.length) > 0) -%}
  {%-       set _ns.watch = _install[_key] -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%-   if (((_install['reloadcmd'] | ansible.builtin.default('')) | ansible.builtin.length) > 0) and
           ((_ns.watch | ansible.builtin.length) == 0) -%}
  {%-     set _ = domains.append((_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('unknown')) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ domains }}


# Staged installation strategy: acme.sh installs into a root-protected staging
# area (one subdirectory per certificate below the root-owned
# run_acmesh_cfg_cert_deploy_base_dir) and a root-owned systemd path/service
# pair per certificate (acmesh-deploy-*) validates and publishes the files to
# their final destinations via a fixed helper program. Naming, locations and
# modes shared by the tasks managing these resources. The unit names reuse the
# certificate identity normalization of the acmesh-reload-* units.
__run_acmesh_deploy_staging_base_dir_owner: "root"
__run_acmesh_deploy_staging_base_dir_group: "root"
__run_acmesh_deploy_staging_base_dir_mode: "u=rwx,g=rx,o=rx" # 0755
# Per-certificate staging directory, owned run_acmesh_user:run_acmesh_group
# (acme.sh writes the staged files there during installation and renewal).
__run_acmesh_deploy_staging_dir_mode: "u=rwx,g=rx,o=" # 0750

# Root-owned deployment manifests (one per staged certificate). They contain
# no credentials, hooks or commands: only staging/destination paths, numeric
# UID/GID values, modes and the certificate's domains. The deploy helper only
# accepts manifests below this directory; keep the path in sync with the
# MANIFEST_DIR constant in files/acmesh-deploy.py.
__run_acmesh_deploy_manifest_dir_path: "/etc/acmesh-deploy.d"
__run_acmesh_deploy_manifest_dir_owner: "root"
__run_acmesh_deploy_manifest_dir_group: "root"
__run_acmesh_deploy_manifest_dir_mode: "u=rwx,g=rx,o=rx" # 0755
__run_acmesh_deploy_manifest_file_owner: "root"
__run_acmesh_deploy_manifest_file_group: "root"
__run_acmesh_deploy_manifest_file_mode: "u=rw,g=,o=" # 0600

# The root-owned deploy helper program (Python, standard library only; see
# files/acmesh-deploy.py).
__run_acmesh_deploy_helper_path: "/usr/libexec/acmesh-deploy"
__run_acmesh_deploy_helper_owner: "root"
__run_acmesh_deploy_helper_group: "root"
__run_acmesh_deploy_helper_mode: "u=rwx,g=rx,o=rx" # 0755

# systemd path/service unit pairs watching the staged files and running the
# deploy helper as root (acmesh-deploy-<unit name>.{path,service}).
__run_acmesh_deploy_unit_prefix: "acmesh-deploy-"
__run_acmesh_deploy_unitfile_dir: "/etc/systemd/system"
__run_acmesh_deploy_unitfile_owner: "root"
__run_acmesh_deploy_unitfile_group: "root"
__run_acmesh_deploy_unitfile_mode: "u=rw,g=r,o=r" # 0644

# The interpreter for the deploy helper: the Python which executes Ansible's
# modules on this host. An Ansible-managed host always has one and reusing it
# avoids an explicit python3 package dependency. The path is baked into the
# ExecStart= of the acmesh-deploy-* service units; if it ever changes, the
# next role run rewrites the units.
__run_acmesh_deploy_python_exec_path: >-
  {{ ansible_facts['python']['executable'] | ansible.builtin.default('/usr/bin/python3', true) }}

# Fixed internal staging file names per install artifact (never the arbitrary
# destination basenames).
__run_acmesh_deploy_staging_filenames:
  ca_file: "ca.cer"
  cert_file: "cert.cer"
  fullchain_file: "fullchain.cer"
  key_file: "cert.key"


# Internal defaults for the ownership and permissions of installed certificate
# files and their destination directories. They preserve the pre-4.0.0
# behavior and are the base layer of the per-certificate permission merge:
# every run_acmesh_certs[]['install']['permissions'] mapping is a partial
# override (see __run_acmesh_install_normalized below). Modes are quoted
# octal strings because they end up in manifests and comparisons, not only in
# module arguments.
__run_acmesh_install_permissions_directory_defaults:
  owner: "{{ run_acmesh_user }}"
  group: "{{ run_acmesh_group }}"
  mode: "2750" # u=rwx,g=rx,o=,g+s (new files inherit the directory group)
__run_acmesh_install_permissions_file_defaults:
  owner: "{{ run_acmesh_user }}"
  group: "{{ run_acmesh_group }}"
  mode: "0640" # u=rw,g=r,o=


# Normalized installation data, one entry per managed certificate with at
# least one configured install file path. This is the single source for
# installation, manifest generation, directory management, reconciliation,
# validation and cleanup; no task repeats the permission merge logic. Built
# from the credential-free certificate view (safe for loop labels). Per entry:
#
# - domain: the certificate's primary domain.
# - cert_id: sanitized domain, same normalization as the acmesh-reload-* unit
#   names (uniqueness after normalization is asserted in tasks/init.yml).
# - strategy: "staged" (default) or "direct".
# - staging_dir: the certificate's staging directory ("staged" only).
# - completion_key: the artifact acme.sh writes last (first configured one of
#   fullchain_file, key_file, ca_file, cert_file; mirrors the watch file
#   selection of __run_acmesh_reload_units). The deploy helper publishes this
#   artifact last so the acmesh-reload-* path unit fires only after a
#   complete deployment.
# - directory: effective destination directory permissions
#   (internal defaults combined with install.permissions.directory).
# - directories: unique destination directories (dirname of every artifact).
# - artifacts: mapping of configured artifact keys to their destination
#   ("dest"), staging path ("staging") and effective owner/group/mode
#   (internal defaults combined with install.permissions.default combined
#   with install.permissions.<artifact>; later mappings override earlier
#   ones per key).
# - domains: all domain names of the certificate (for the deploy helper's
#   certificate identity validation).
#
# Derived from __run_acmesh_install_loop below, which pairs every certificate
# with its installation data in a single pass. Tasks must never re-associate
# the two by looking a certificate up in this list at runtime: acme.sh
# persists the paths handed to "--install-cert" as its Le_Real*Path values, so
# a lookup that silently resolves to nothing would clear a certificate's
# installation configuration instead of merely skipping it.
__run_acmesh_install_normalized: >-
  {{
    __run_acmesh_install_loop
    | ansible.builtin.map(attribute='install_data')
    | ansible.builtin.list
  }}


# Loop data for the installation task: one entry per managed certificate that
# configures at least one install file path. Each entry carries everything
# that task needs, so it never has to correlate two data structures at
# runtime:
#
# - domain: the certificate's primary domain (for "--domain").
# - environment: the certificate's own environment mapping (DNS API
#   credentials). This is the only credential-bearing part; the installation
#   task is no_log and labels its loop with the domain only. Everything else
#   consumes the credential-free __run_acmesh_install_normalized above.
# - install_data: the normalized installation data of this certificate.
#
# Certificates without any install file path are intentionally absent:
# invoking "acme.sh --install-cert" for them would have nothing to install
# and would clear their stored installation configuration.
__run_acmesh_install_loop: >-
  {%- set entries = [] -%}
  {%- for _cert in __run_acmesh_certs_managed -%}
  {%-   set _install = _cert['install'] | ansible.builtin.default({}) -%}
  {%-   set _artifact_keys = [] -%}
  {%-   for _key in ['ca_file', 'cert_file', 'fullchain_file', 'key_file'] -%}
  {%-     if (((_install[_key] | ansible.builtin.default('')) | ansible.builtin.length) > 0) -%}
  {%-       set _ = _artifact_keys.append(_key) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%-   if (_artifact_keys | ansible.builtin.length) > 0 -%}
  {%-     set _domain = (_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('') -%}
  {%-     set _cert_id = _domain | ansible.builtin.lower | ansible.builtin.regex_replace('[^a-z0-9.-]', '-') -%}
  {%-     set _strategy = _install['strategy'] | ansible.builtin.default('staged') -%}
  {%-     set _perms = _install['permissions'] | ansible.builtin.default({}, true) -%}
  {%-     set _directory = __run_acmesh_install_permissions_directory_defaults
            | ansible.builtin.combine(_perms['directory'] | ansible.builtin.default({}, true)) -%}
  {%-     set _staging_dir = run_acmesh_cfg_cert_deploy_base_dir ~ '/' ~ _cert_id -%}
  {%-     set _artifacts = {} -%}
  {%-     set _dirs = [] -%}
  {%-     set _ns = namespace(completion='') -%}
  {%-     for _key in ['fullchain_file', 'key_file', 'ca_file', 'cert_file'] -%}
  {%-       if ((_ns.completion | ansible.builtin.length) == 0) and (_key in _artifact_keys) -%}
  {%-         set _ns.completion = _key -%}
  {%-       endif -%}
  {%-     endfor -%}
  {%-     for _key in _artifact_keys -%}
  {%-       set _effective = __run_acmesh_install_permissions_file_defaults
              | ansible.builtin.combine(_perms['default'] | ansible.builtin.default({}, true))
              | ansible.builtin.combine(_perms[_key] | ansible.builtin.default({}, true)) -%}
  {%-       set _ = _artifacts.update({_key: {
              'dest': _install[_key],
              'staging': (_staging_dir ~ '/' ~ __run_acmesh_deploy_staging_filenames[_key]),
              'owner': _effective['owner'] | ansible.builtin.string,
              'group': _effective['group'] | ansible.builtin.string,
              'mode': _effective['mode'] | ansible.builtin.string,
            }}) -%}
  {%-       if (_install[_key] | ansible.builtin.dirname) not in _dirs -%}
  {%-         set _ = _dirs.append(_install[_key] | ansible.builtin.dirname) -%}
  {%-       endif -%}
  {%-     endfor -%}
  {%-     set _ = entries.append({
            'domain': _domain,
            'environment': _cert['environment'] | ansible.builtin.default({}, true),
            'install_data': {
              'domain': _domain,
              'cert_id': _cert_id,
              'strategy': _strategy,
              'staging_dir': _staging_dir,
              'completion_key': _ns.completion,
              'directory': {
                'owner': _directory['owner'] | ansible.builtin.string,
                'group': _directory['group'] | ansible.builtin.string,
                'mode': _directory['mode'] | ansible.builtin.string,
              },
              'directories': _dirs,
              'artifacts': _artifacts,
              'domains': (_cert['domains'] | ansible.builtin.default([])
                          | ansible.builtin.map(attribute='name') | ansible.builtin.list),
            },
          }) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ entries }}


# Strategy-filtered views of __run_acmesh_install_normalized: deploy units,
# manifests and staging directories exist exactly for the staged entries;
# deploy resources of managed direct entries are actively removed (strategy
# transition, see tasks/config/default.yml).
__run_acmesh_install_normalized_staged: >-
  {{
    __run_acmesh_install_normalized
    | ansible.builtin.selectattr('strategy', 'ansible.builtin.equalto', 'staged')
    | ansible.builtin.list
  }}
__run_acmesh_install_normalized_direct: >-
  {{
    __run_acmesh_install_normalized
    | ansible.builtin.selectattr('strategy', 'ansible.builtin.equalto', 'direct')
    | ansible.builtin.list
  }}


# Flattened per-artifact and per-directory views for loops (destination
# directory creation and final file reconciliation).
__run_acmesh_install_directories_flat: >-
  {%- set pairs = [] -%}
  {%- for _entry in __run_acmesh_install_normalized -%}
  {%-   for _dir in _entry['directories'] -%}
  {%-     set _ = pairs.append({
            'domain': _entry['domain'],
            'path': _dir,
            'owner': _entry['directory']['owner'],
            'group': _entry['directory']['group'],
            'mode': _entry['directory']['mode'],
          }) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ pairs }}
__run_acmesh_install_artifacts_flat: >-
  {%- set items = [] -%}
  {%- for _entry in __run_acmesh_install_normalized -%}
  {%-   for _key, _artifact in _entry['artifacts'].items() -%}
  {%-     set _ = items.append({
            'domain': _entry['domain'],
            'artifact': _key,
            'dest': _artifact['dest'],
            'owner': _artifact['owner'],
            'group': _artifact['group'],
            'mode': _artifact['mode'],
          }) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ items }}


# Staging files acme.sh has to write for the staged installation strategy,
# flattened for a per-file existence check before the deploy helper runs. A
# missing file here means acme.sh did not populate the staging area (the
# certificate could not be issued or renewed, or --install-cert did not run),
# which the deploy helper would only report as a low-level open() error.
__run_acmesh_install_staging_files_flat: >-
  {%- set items = [] -%}
  {%- for _entry in __run_acmesh_install_normalized_staged -%}
  {%-   for _key, _artifact in _entry['artifacts'].items() -%}
  {%-     set _ = items.append({
            'domain': _entry['domain'],
            'artifact': _key,
            'staging': _artifact['staging'],
          }) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ items }}


# Unique owner and group names referenced by the effective install
# permissions of staged certificates. tasks/config/default.yml resolves them
# to numeric UID/GID values (getent, after the setup phase created the
# service account) so the root-owned deployment manifests only contain
# trusted numeric values. The "direct" strategy needs no resolution: its
# ownership is fixed to the service account and applied by name.
__run_acmesh_install_staged_owner_names: >-
  {%- set names = [] -%}
  {%- for _entry in __run_acmesh_install_normalized_staged -%}
  {%-   if _entry['directory']['owner'] not in names -%}
  {%-     set _ = names.append(_entry['directory']['owner']) -%}
  {%-   endif -%}
  {%-   for _key, _artifact in _entry['artifacts'].items() -%}
  {%-     if _artifact['owner'] not in names -%}
  {%-       set _ = names.append(_artifact['owner']) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ names }}
__run_acmesh_install_staged_group_names: >-
  {%- set names = [] -%}
  {%- for _entry in __run_acmesh_install_normalized_staged -%}
  {%-   if _entry['directory']['group'] not in names -%}
  {%-     set _ = names.append(_entry['directory']['group']) -%}
  {%-   endif -%}
  {%-   for _key, _artifact in _entry['artifacts'].items() -%}
  {%-     if _artifact['group'] not in names -%}
  {%-       set _ = names.append(_artifact['group']) -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ names }}


