---

security_fixes:
  - >
    ``run`` role - The certificate settings shown at ``-vvv`` verbosity no longer
    include each certificate's ``environment`` mapping, which holds DNS provider
    API credentials. The debug output now uses the credential-free views of the
    certificate list.
  - >
    ``run`` role - ``run_acmesh_cfg_account_keys[].account_key`` is now marked
    ``no_log`` in the argument specification, so a failing argument validation
    can no longer expose the PEM-encoded account private key.
