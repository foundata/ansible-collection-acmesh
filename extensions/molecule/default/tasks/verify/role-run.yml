## Upstream acme.sh CA_NAMES drift detection
#
# The "Cert | Default | Pre-seed ACME account.key files, re-register ACME
# account" task in roles/run/tasks/cert/default.yml resolves server aliases
# (zerossl, letsencrypt, google, ...) to ACME directory URLs via an inline
# `case "${SERVER}" in` block. That block must stay in sync with the upstream
# CA_NAMES variable defined inside acme.sh. The check below extracts CA_NAMES
# from the installed acme.sh script and asserts it matches a known-good
# baseline so any upstream addition/rename/removal is caught immediately.

- name: "Molecule | Verify | Read acme.sh to extract upstream CA_NAMES alias list"
  ansible.builtin.slurp:
    src: "{{ run_acmesh_cfg_home }}/acme.sh"
  register: __testing_acmesh_script_slurp


- name: "Molecule | Verify | Capture CA_NAMES block from acme.sh"
  ansible.builtin.set_fact:
    __testing_acmesh_ca_names: >-
      {{
        (__testing_acmesh_script_slurp['content'] | ansible.builtin.b64decode)
        | ansible.builtin.regex_search('CA_NAMES="([^"]*)"', '\1', multiline=True)
        | ansible.builtin.default([''], true)
        | ansible.builtin.first
        | ansible.builtin.trim
      }}


- name: "Molecule | Verify | Assert acme.sh CA_NAMES matches the pre-seed task case statement"
  ansible.builtin.assert:
    that:
      - (__testing_acmesh_ca_names | ansible.builtin.trim) == (__testing_acmesh_ca_names_expected | ansible.builtin.trim)
    fail_msg: >-
      The CA_NAMES alias list in {{ run_acmesh_cfg_home }}/acme.sh has changed
      compared to the baseline used when the pre-seed task was last reviewed.
      Update BOTH of the following to match upstream acme.sh:
      (1) the `case "${SERVER}" in` block inside the task
      "Cert | Default | Pre-seed ACME account.key files, re-register ACME account"
      at roles/run/tasks/cert/default.yml, and
      (2) the `__testing_acmesh_ca_names_expected` baseline in this verify task.
      Found in acme.sh:
      ---
      {{ __testing_acmesh_ca_names }}
      ---
      Expected baseline:
      ---
      {{ __testing_acmesh_ca_names_expected }}
      ---
    success_msg: "acme.sh CA_NAMES alias list matches the pre-seed task case statement."
  vars:
    __testing_acmesh_ca_names_expected: |-
      ZeroSSL.com,zerossl
      LetsEncrypt.org,letsencrypt
      LetsEncrypt.org_test,letsencrypt_test,letsencrypttest
      SSL.com,sslcom
      Google.com,google
      Google.com_test,googletest,google_test
      Actalis.com,actalis.com,actalis


## systemd service / timer

- name: "Molecule | Verify | Gather service facts"
  ansible.builtin.service_facts:


- name: "Molecule | Verify | Check acmesh-renewal.service is existing, static status"
  ansible.builtin.assert:
    that:
      - "'acmesh-renewal.service' in ansible_facts['services']"
      - ansible_facts['services']['acmesh-renewal.service']['status'] in ['static']
    fail_msg: "acmesh-renewal.service is not existing as expected or wrong status"


- name: "Molecule | Verify | Get acmesh-renewal.timer properties"
  ansible.builtin.systemd:
    name: "acmesh-renewal.timer"
  failed_when:
    - false
  register: __testing_acmesh_timer_result


- name: "Molecule | Verify | Assert acmesh-renewal.timer configuration looks correct"
  ansible.builtin.assert:
    that:
      - __testing_acmesh_timer_result['status']['LoadState'] == 'loaded'
      - __testing_acmesh_timer_result['status']['UnitFileState'] == 'enabled'
      - __testing_acmesh_timer_result['status']['ActiveState'] == 'active'
      - __testing_acmesh_timer_result['status']['Triggers'] == 'acmesh-renewal.service'
      - __testing_acmesh_timer_result['status']['Unit'] == 'acmesh-renewal.service'
      - "'timers.target' in __testing_acmesh_timer_result['status']['WantedBy']"
    fail_msg: "acmesh-renewal.timer does not have the expected configuration"


- name: "Molecule | Verify | Get acmesh-renewal.service properties"
  ansible.builtin.systemd:
    name: "acmesh-renewal.service"
  failed_when:
    - false
  register: __testing_acmesh_service_result


- name: "Molecule | Verify | Assert acmesh-renewal.service configuration looks correct"
  ansible.builtin.assert:
    that:
      - __testing_acmesh_service_result['status']['Type'] == 'oneshot'
      - __testing_acmesh_service_result['status']['User'] == run_acmesh_user
      - __testing_acmesh_service_result['status']['Group'] == run_acmesh_group
      - __testing_acmesh_service_result['status']['WorkingDirectory'] == run_acmesh_cfg_home
      - (run_acmesh_cfg_home ~ '/acme.sh') in __testing_acmesh_service_result['status']['ExecStart']
    fail_msg: "acmesh-renewal.service does not have the expected configuration"


## Renewal service capability handling for standalone/alpn challenges (issue #19)
#
# acme.sh binds a privileged port itself only for the "standalone" (HTTP-01) and
# "alpn" (TLS-ALPN-01) challenges, and the renewal service runs unprivileged, so
# the role grants CAP_NET_BIND_SERVICE to that service only when a configured
# certificate needs it. This is asserted structurally (unit content + detection
# logic) rather than by issuing a standalone certificate, because the webroot
# Pebble test already occupies port 80 (HTTP-01), so standalone issuance cannot
# run alongside it.

- name: "Molecule | Verify | Read the acmesh-renewal.service unit file"
  ansible.builtin.slurp:
    src: "{{ __run_acmesh_systemd_renewal_servicefile_path }}"
  register: __testing_renewal_unit


- name: "Molecule | Verify | Assert the renewal service got no capability for the configured (dns/webroot) certificates"
  ansible.builtin.assert:
    that:
      # The converge configures only dns and/or webroot certificates, none of
      # which makes acme.sh bind a privileged port during renewal.
      - "'AmbientCapabilities' not in __testing_renewal_unit_content"
      - "'CapabilityBoundingSet' not in __testing_renewal_unit_content"
    fail_msg: "acmesh-renewal.service was granted CAP_NET_BIND_SERVICE although no configured certificate needs it"
    success_msg: "acmesh-renewal.service has no extra capability, as expected for dns/webroot certificates"
    quiet: true
  vars:
    __testing_renewal_unit_content: "{{ __testing_renewal_unit['content'] | ansible.builtin.b64decode }}"


- name: "Molecule | Verify | Save the converged run_acmesh_certs before the capability detection cases"
  ansible.builtin.set_fact:
    __testing_saved_run_acmesh_certs: "{{ run_acmesh_certs | ansible.builtin.default([]) }}"


- name: "Molecule | Verify | Assert the renewal capability is required exactly for privileged-port standalone/alpn"
  ansible.builtin.include_tasks:
    file: "{{ (lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') | ansible.builtin.default('../../default')) }}/tasks/verify/checks/renewal-capability-detection.yml"
  loop:
    - {label: "standalone (port 80)", expect: true, certs: [{domains: [{name: x, challenge: {type: standalone}}]}]}
    - {label: "standalone (httpport 8080)", expect: false, certs: [{domains: [{name: x, challenge: {type: standalone, httpport: 8080}}]}]}
    - {label: "alpn (port 443)", expect: true, certs: [{domains: [{name: x, challenge: {type: alpn}}]}]}
    - {label: "alpn (tlsport 8443)", expect: false, certs: [{domains: [{name: x, challenge: {type: alpn, tlsport: 8443}}]}]}
    - {label: "webroot", expect: false, certs: [{domains: [{name: x, challenge: {type: webroot, webroot: /w}}]}]}
    - {label: "dns", expect: false, certs: [{domains: [{name: x, challenge: {type: dns}}]}]}
  loop_control:
    loop_var: "__testing_capcase"
    label: "{{ __testing_capcase['label'] }}"


- name: "Molecule | Verify | Restore the converged run_acmesh_certs after the capability detection cases"
  ansible.builtin.set_fact:
    run_acmesh_certs: "{{ __testing_saved_run_acmesh_certs }}"


