# Internal role variables and values that must NOT be overridden by the user.
#
# Variables defined here usually override earlier definitions due to the high
# precedence of this file. Each variable should have a concise comment above
# it, describing its purpose and how it fits into the role's functionality.

---

# Facts used by the role (gathered on a best-effort basis if needed), as a
# mapping of "gather_subset" name to the ansible_facts keys it provides.
#
# To identify which subset a fact belongs to during development, you can use
# the following snippet:
#
# - ansible.builtin.setup:
#     gather_subset:
#       - '!min'
#       - '<subset_name, see parameter doc for details>'
__run_acmesh_used_facts:
  distribution:
    - "distribution"
    - "distribution_major_version"
    - "distribution_version"
    - "os_family"


# run_acmesh_certs with every per-certificate "environment" mapping removed.
#
# A certificate's "environment" holds DNS API credentials. Tasks that iterate
# over the certificates but do not need those credentials loop over this view
# instead of run_acmesh_certs, so the credentials never appear in task output
# (item labels, --diff, failure dumps). The credential-consuming tasks (issue,
# install) still use run_acmesh_certs and are marked no_log.
__run_acmesh_certs_no_secrets: >-
  {{
    run_acmesh_certs | ansible.builtin.default([])
    | map('ansible.builtin.dict2items')
    | map('ansible.builtin.rejectattr', 'key', 'eq', 'environment')
    | map('ansible.builtin.items2dict')
    | ansible.builtin.list
  }}


# Whether the unprivileged renewal service (acmesh-renewal.service, runs as
# run_acmesh_user) needs CAP_NET_BIND_SERVICE. acme.sh binds a listening port
# itself only for the "standalone" (HTTP-01, default port 80, overridable with
# httpport) and "alpn" (TLS-ALPN-01, default port 443, overridable with tlsport)
# challenge types; "dns" and "webroot" need no listening port. The capability is
# only required when that port is privileged (< 1024), so a standalone/alpn
# challenge pinned to a high port needs nothing. Evaluated over every domain of
# every configured certificate because a single renewal run (acme.sh --cron)
# renews them all.
__run_acmesh_renewal_needs_net_bind: >-
  {%- set ns = namespace(need=false) -%}
  {%- for _cert in (run_acmesh_certs | ansible.builtin.default([])) -%}
  {%-   for _domain in (_cert['domains'] | ansible.builtin.default([])) -%}
  {%-     set _challenge = _domain['challenge'] | ansible.builtin.default({}) -%}
  {%-     set _type = _challenge['type'] | ansible.builtin.default('') -%}
  {%-     if _type == 'standalone' and ((_challenge['httpport'] | ansible.builtin.default(80) | int) < 1024) -%}
  {%-       set ns.need = true -%}
  {%-     elif _type == 'alpn' and ((_challenge['tlsport'] | ansible.builtin.default(443) | int) < 1024) -%}
  {%-       set ns.need = true -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ ns.need }}


# Reload handling: acme.sh does not get a --reloadcmd anymore. Instead, a
# root-side systemd path unit per certificate watches the installed certificate
# files and starts a service unit of the same name which runs the configured
# "reloadcmd" as root. This works identically for initial issuance, automated
# renewal (which runs unprivileged) and manual acme.sh runs, without granting
# the service user any privileges.
#
# Naming and locations shared by the tasks managing these resources. The unit
# names are derived from the certificate's primary domain (see
# __run_acmesh_reload_units below).
__run_acmesh_reload_unit_prefix: "acmesh-reload-"
__run_acmesh_reload_unitfile_dir: "/etc/systemd/system"
__run_acmesh_reload_unitfile_owner: "root"
__run_acmesh_reload_unitfile_group: "root"
__run_acmesh_reload_unitfile_mode: "u=rw,g=r,o=r" # 0644


# List of reload units to manage, one entry per certificate with a non-empty
# "reloadcmd". Each entry provides:
#
# - name: unit/script name part, the certificate's primary domain with every
#   character that is not allowed in systemd unit names replaced by "-".
# - domain: the certificate's primary domain (for descriptions/messages).
# - watch_path: the installed certificate file the path unit watches. acme.sh
#   installs the files in the fixed order cert_file, ca_file, key_file,
#   fullchain_file (see _installcert()), so the last one of the configured
#   files is watched: when it is written, the whole set is consistent and the
#   services can be reloaded safely.
# - reloadcmd: the configured reload command, inlined into the service unit's
#   ExecStart= (systemd-escaped there, see tasks/config/default.yml).
#
# Certificates whose "reloadcmd" is set but which do not define any of the
# install file paths cannot be watched; they are collected in
# __run_acmesh_reload_units_missing_watch and rejected in tasks/init.yml.
__run_acmesh_reload_units: >-
  {%- set units = [] -%}
  {%- for _cert in (run_acmesh_certs | ansible.builtin.default([])) -%}
  {%-   set _install = _cert['install'] | ansible.builtin.default({}) -%}
  {%-   set _reloadcmd = _install['reloadcmd'] | ansible.builtin.default('') -%}
  {%-   set _ns = namespace(watch='') -%}
  {%-   for _key in ['fullchain_file', 'key_file', 'ca_file', 'cert_file'] -%}
  {%-     if ((_ns.watch | ansible.builtin.length) == 0) and
             (((_install[_key] | ansible.builtin.default('')) | ansible.builtin.length) > 0) -%}
  {%-       set _ns.watch = _install[_key] -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%-   if ((_reloadcmd | ansible.builtin.length) > 0) and ((_ns.watch | ansible.builtin.length) > 0) -%}
  {%-     set _domain = (_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('') -%}
  {%-     set _ = units.append({
            'name': (_domain | lower | ansible.builtin.regex_replace('[^a-z0-9.-]', '-')),
            'domain': _domain,
            'watch_path': _ns.watch,
            'reloadcmd': _reloadcmd,
          }) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ units }}


# Primary domains of certificates with a non-empty "reloadcmd" but without any
# install file path to watch. Used by tasks/init.yml to fail early with a
# helpful message (the reload command of such a certificate would never run).
__run_acmesh_reload_units_missing_watch: >-
  {%- set domains = [] -%}
  {%- for _cert in (run_acmesh_certs | ansible.builtin.default([])) -%}
  {%-   set _install = _cert['install'] | ansible.builtin.default({}) -%}
  {%-   set _ns = namespace(watch='') -%}
  {%-   for _key in ['fullchain_file', 'key_file', 'ca_file', 'cert_file'] -%}
  {%-     if ((_ns.watch | ansible.builtin.length) == 0) and
             (((_install[_key] | ansible.builtin.default('')) | ansible.builtin.length) > 0) -%}
  {%-       set _ns.watch = _install[_key] -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%-   if (((_install['reloadcmd'] | ansible.builtin.default('')) | ansible.builtin.length) > 0) and
           ((_ns.watch | ansible.builtin.length) == 0) -%}
  {%-     set _ = domains.append((_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('unknown')) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ domains }}


# List of platforms this role supports and was designed for.
#
# A warning will be issued if the list contains values and the role is executed
# on an unknown (not listed) platform, but execution will continue. Example:
#
# - name: "Fedora" # A ansible_facts value ('distribution' or 'os_family')
#   versions: # A ansible_facts value ('distribution_major_version' or
#     - "all" # 'distribution_version') or "all"
# - name: "Ubuntu"
#   versions:
#     - "22.04"
#     - "24.04"
# - name: "RedHat"
#   versions:
#     - "all"
# - name: "Debian"
#   versions:
#     - "all"
__run_acmesh_supported_platforms:
  - name: "Debian"
    versions:
      - "12"
      - "13"
  - name: "Fedora"
    versions:
      - "43"
      - "44"
  - name: "openSUSE Leap"
    versions:
      - "16.0"
  - name: "RedHat" # includes AlmaLinux, Rocky and CentOS Stream
    versions:
      - "9"
      - "10"
  - name: "Ubuntu"
    versions:
      - "22.04"
      - "24.04"
      - "26.04"


# List of package names to be installed when run_acmesh_state is
# set to "present".
__run_acmesh_packages_install:
  # We maintain this package list separately from the platform-specific
  # variables in this directory because these packages likely have the same
  # names across both supported platforms and unsupported, best-effort
  # platforms.
  #
  # For executing this role and/or Ansible itself
  - "git" # Download release form upstream
  # For acme.sh
  - "curl" # Communicate with the CA
  - "openssl"


# List of package names to be uninstalled when run_acmesh_state is
# set to "absent". This variable is useful when __run_acmesh_packages_install
# contains packages that are required for the managed software to function but
# should not be removed during uninstallation, as doing so could break other
# software. This is usually the case if there are common dependencies like
# "curl" or "openssl" which typically should remain installed even after
# uninstalling the software managed by this role.
__run_acmesh_packages_uninstall: []


# List of package names to be removed unconditionally before installation
# (e.g., to prevent conflicts or resolve incompatibilities).
__run_acmesh_packages_removal: []


# List of paths of files and directories to be removed unconditionally after
# installation. This is useful for removing default configuration resources
# that would otherwise create confusion or conflict with custom configurations
# managed by this role.
__run_acmesh_paths_removal: []


# Dictionary of files to be overwritten with a managed comment instead of being
# deleted. Keys are file paths; values are the single-line comment characters to
# use. This is needed on platforms where the package manager reinstalls deleted
# files on package update. Restored files would conflict with the managed
# configuration, while modified files are preserved. For example, RPM with
# %config(noreplace) restores missing files but preserves modified ones.
__run_acmesh_paths_neutralize: {}


# Path to the environment file sourced in /etc/profile.d/. This file ensures
# that acme.sh environment variables are set for all users.
__run_acmesh_profiled_envfile_path: "/etc/profile.d/acme.sh.env.sh"


# Path to the systemd service unit file for acme.sh certificate renewal. This
# defines the command and execution environment for automated certificate renewal.
__run_acmesh_systemd_renewal_servicefile_path: "/etc/systemd/system/acmesh-renewal.service"
__run_acmesh_systemd_renewal_servicefile_owner: "root"
__run_acmesh_systemd_renewal_servicefile_group: "root"
__run_acmesh_systemd_renewal_servicefile_mode: "u=rw,g=r,o=r" # 0644


# Path to the systemd timer unit file for acme.sh certificate renewal. This
# timer schedules the execution of the renewal service at regular intervals.
__run_acmesh_systemd_renewal_timerfile_path: "/etc/systemd/system/acmesh-renewal.timer"
__run_acmesh_systemd_renewal_timerfile_owner: "root"
__run_acmesh_systemd_renewal_timerfile_group: "root"
__run_acmesh_systemd_renewal_timerfile_mode: "u=rw,g=r,o=r" # 0644


# modes for differt acme.sh directories and files
__run_acmesh_cfg_home_dir_mode: "u=rwx,g=rx,o=" # 0750; used for run_acmesh_cfg_home
__run_acmesh_cfg_config_home_dir_mode: "u=rwx,g=rx,o=" # 0750; used for run_acmesh_cfg_config_home

__run_acmesh_cfg_account_key_file_mode: "u=rw,g=,o=" # 0600; especially sensitiv when dns-persist-01 is used

__run_acmesh_cfg_cert_home_dir_mode: "u=rwx,g=rx,o=,g+s" # 2750 (new files inherit directory group); used for run_acmesh_cfg_cert_home
__run_acmesh_cfg_cert_home_file_mode: "u=rw,g=r,o=" # 0640; used for files in run_acmesh_cfg_cert_home

__run_acmesh_cfg_cert_install_dir_mode: "{{ __run_acmesh_cfg_cert_home_dir_mode }}"
__run_acmesh_cfg_cert_install_file_mode: "{{ __run_acmesh_cfg_cert_home_file_mode }}"

__run_acmesh_cfg_logfile_file_mode: "u=rw,g=,o=" # 0600; used for run_acmesh_cfg_logfile


# Paths of misc executables and resources.
__run_acmesh_sha1sum_exec_path: "/usr/bin/sha1sum"
__run_acmesh_base64_exec_path: "/usr/bin/base64"
__run_acmesh_sed_exec_path: "/usr/bin/sed"
__run_acmesh_grep_exec_path: "/usr/bin/grep"
__run_acmesh_setpriv_exec_path: "/usr/bin/setpriv"


# Command prefix that switches to the unprivileged service user before running
# acme.sh, so that issuance and installation run in the same context as the
# automated renewal (acmesh-renewal.service, User=) and permission problems
# surface immediately instead of weeks later at the first renewal.
#
# setpriv (util-linux) is used instead of Ansible's become/become_user because
# it does not depend on a become plugin or on sudo being installed, keeps the
# task environment (DNS API credentials, HOME), and can grant ambient
# capabilities where a certificate needs a privileged port (see the issue
# task). The role runs as root, so no PAM or password handling is involved.
# Tasks append "--" and the actual command; the issue task inserts
# "--inh-caps +net_bind_service --ambient-caps +net_bind_service" first when a
# privileged-port standalone/alpn challenge is configured.
__run_acmesh_setpriv_run_as_user: >-
  {{ __run_acmesh_setpriv_exec_path }}
  --reuid {{ run_acmesh_user | ansible.builtin.quote }}
  --regid {{ run_acmesh_group | ansible.builtin.quote }}
  --init-groups


### Override defaults of dependencies used by this role (if any).

# nothing right now
