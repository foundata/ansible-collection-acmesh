        fail_msg: "{{ item['item'] }} still exists although the certificate was removed with state 'absent'"
      loop: "{{ __testing_acmesh_certabsent_stat['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"


    - name: "Molecule | Verify | Gather stats for the installation directory of the removed certificate"
      ansible.builtin.stat:
        path: "/etc/pki/tls/certs/acmesh-webroot.test"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_certabsent_installdir_stat


    - name: "Molecule | Verify | Assert the installation directory of the removed certificate is kept"
      # Only the installed files get removed; the directory may be shared
      # with other software.
      ansible.builtin.assert:
        that:
          - __testing_acmesh_certabsent_installdir_stat['stat']['exists']
          - __testing_acmesh_certabsent_installdir_stat['stat']['isdir']
        fail_msg: >-
          The installation directory was removed although only the installed
          certificate files of a state=absent certificate may be deleted.


