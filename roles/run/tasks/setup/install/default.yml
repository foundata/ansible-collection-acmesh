# Install: Manage basic resource setup, such as packages or service users.

---

- name: "Setup | Install | Default | Remove unwanted packages (e.g., to prevent conflicts or resolve incompatibilities)"
  ansible.builtin.package:
    name: "{{ __run_acmesh_packages_removal }}"
    state: "absent"
  when:
    - __run_acmesh_packages_removal is ansible.builtin.defined
    - (__run_acmesh_packages_removal | ansible.builtin.length) > 0


- name: "Setup | Install | Default | Install or upgrade packages"
  ansible.builtin.package:
    name: "{{ __run_acmesh_packages_install }}"
    state: "{{ 'latest' if (run_acmesh_autoupgrade | ansible.builtin.bool) else 'present' }}"
    # work-around for conflicts with curl-minimal on Red Hat platforms
    allowerasing: "{{ true if (((ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat') and ('curl' in __run_acmesh_packages_install)) else omit }}"
  when:
    - __run_acmesh_packages_install is ansible.builtin.defined
    - (__run_acmesh_packages_install | ansible.builtin.length) > 0


- name: "Setup | Install | Default | Remove unwanted files and directories (e.g., to prevent conflicts or resolve incompatibilities)"
  ansible.builtin.file:
    path: "{{ __run_acmesh_removal_path_item }}"
    state: "absent"
  when:
    - __run_acmesh_paths_removal is ansible.builtin.defined
    - (__run_acmesh_paths_removal | ansible.builtin.length) > 0
  loop: "{{ __run_acmesh_paths_removal }}"
  loop_control:
    loop_var: "__run_acmesh_removal_path_item"


- name: "Setup | Install | Default | Neutralize distribution config files (overwrite to survive package updates)"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_neutralize_item['key'] }}"
    content: |
      {{ __run_acmesh_neutralize_item['value'] }} Managed by Ansible (foundata.acmesh.run)
      {{ __run_acmesh_neutralize_item['value'] }}
      {{ __run_acmesh_neutralize_item['value'] }} Content intentionally cleared. The original distribution file conflicted
      {{ __run_acmesh_neutralize_item['value'] }} with configuration managed by the foundata.acmesh.run role.
      {{ __run_acmesh_neutralize_item['value'] }}
      {{ __run_acmesh_neutralize_item['value'] }} To restore the original file content, reinstall the owning package:
      {% if (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian' %}
      {{ __run_acmesh_neutralize_item['value'] }}   dpkg -S '{{ __run_acmesh_neutralize_item['key'] }}'  # find the package that owns this file
      {{ __run_acmesh_neutralize_item['value'] }}   apt-get install --reinstall <package>  # reinstall it to restore the original
      {% elif (ansible_facts['os_family'] | ansible.builtin.lower) == 'suse' %}
      {{ __run_acmesh_neutralize_item['value'] }}   rpm -qf '{{ __run_acmesh_neutralize_item['key'] }}'  # find the package that owns this file
      {{ __run_acmesh_neutralize_item['value'] }}   zypper install --force <package>  # reinstall it to restore the original
      {% elif (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat' %}
      {{ __run_acmesh_neutralize_item['value'] }}   rpm -qf '{{ __run_acmesh_neutralize_item['key'] }}'  # find the package that owns this file
      {{ __run_acmesh_neutralize_item['value'] }}   dnf reinstall <package>  # reinstall it to restore the original
      {% else %}
      {{ __run_acmesh_neutralize_item['value'] }}   Use your package manager to find the owning package and reinstall it.
      {% endif %}
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644
  when:
    - __run_acmesh_paths_neutralize is ansible.builtin.defined
    - (__run_acmesh_paths_neutralize | ansible.builtin.length) > 0
  loop: "{{ __run_acmesh_paths_neutralize | ansible.builtin.dict2items }}"
  loop_control:
    loop_var: "__run_acmesh_neutralize_item"
    label: "{{ __run_acmesh_neutralize_item['key'] }}"


- name: "Setup | Install | Default | Get upstream version tags from git repository"
  # The command module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a way to list remote git tags.
  # - Using git ls-remote to query tags without cloning is lightweight
  #   and works with any git remote (GitHub, GitLab, local mirrors),
  #   making it suitable for air-gapped environments with internal
  #   mirrors.
  ansible.builtin.command:
    argv:
      - "git"
      - "ls-remote"
      - "--tags"
      - "--refs"
      - "{{ run_acmesh_git_url }}"
  when:
    - (run_acmesh_git_version | ansible.builtin.default('', true) | ansible.builtin.trim | ansible.builtin.length) == 0
  changed_when:
    - false
  ignore_errors: true
  register: __run_acmesh_git_tags_result


- name: "Setup | Install | Default | Set latest upstream version as fact"
  ansible.builtin.set_fact:
    __run_acmesh_version_upstream: >-
      {%- set versions = [] -%}
      {%- if __run_acmesh_git_tags_result is ansible.builtin.success -%}
        {%- for line in (__run_acmesh_git_tags_result['stdout_lines']
                         | ansible.builtin.default([])) -%}
          {%- set tag = line.split('/')[-1]
                        | ansible.builtin.regex_replace('^v', '') -%}
          {%- if tag is ansible.builtin.match('^[0-9\.]*$') and
                 (tag | ansible.builtin.length) > 0 -%}
            {%- set _ = versions.append(tag) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {%- set ns = namespace(latest='') -%}
      {%- for v in versions -%}
        {%- if (ns.latest | ansible.builtin.length) == 0 or
               v is ansible.builtin.version(ns.latest, '>',
                 version_type='semver') -%}
          {%- set ns.latest = v -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if (ns.latest | ansible.builtin.length) > 0 -%}
        {{- ns.latest -}}
      {%- endif -%}
  when:
    - (run_acmesh_git_version | ansible.builtin.default('', true) | ansible.builtin.trim | ansible.builtin.length) == 0


- name: "Setup | Install | Default | Use user-specified version override as upstream version"
  ansible.builtin.set_fact:
    __run_acmesh_version_upstream: "{{ run_acmesh_git_version | ansible.builtin.trim }}"
  when:
    - (run_acmesh_git_version | ansible.builtin.default('', true) | ansible.builtin.trim | ansible.builtin.length) > 0


- name: "Setup | Install | Default | Display latest upstream version (if any, empty string means \"nothing detected\")"
  ansible.builtin.debug:
    var: __run_acmesh_version_upstream
    verbosity: 1


- name: "Setup | Install | Default | Create the service user"
  ansible.builtin.user:
    comment: "ACME client for issuing X.509 certs"
    create_home: true
    force: true
    home: "{{ run_acmesh_cfg_home }}"
    # We first used "acme.sh" as username. However, a dot is not allowed in the
    # "User=" directive of systemd versions shipped with RHEL8 in October 2019, cf:
    # - https://github.com/systemd/systemd/issues/12754
    # - https://bugzilla.redhat.com/show_bug.cgi?id=1717603
    # To be on the safe side, we switched from "acme.sh" to "acmesh" as username.
    name: "{{ run_acmesh_user }}"
    password: "!" # locked / disabled password
    remove: true
    shell: "/sbin/nologin"
    state: "present"
    system: false
    update_password: "always"
    umask: "0027"


  # Most systems automatically create the (primary) group for a new user when
  # the "group" parameter of ansible.builtin.user is omitted, usually with a GID
  # matching the UID. openSUSE is an exception to this rule and requires
  # explicit group creation.
- name: "Setup | Install | Default | Create the group for the service user"
  ansible.builtin.group:
    name: "{{ run_acmesh_group }}"
    state: "present"
    system: false
    force: false


- name: "Setup | Install | Default | Add service user to the group(s)"
  ansible.builtin.user:
    name: "{{ run_acmesh_user }}"
    # Exact membership: the account is fully owned by this role, so the
    # supplementary groups are reconciled to the unique union of
    # run_acmesh_group and run_acmesh_user_supplementary_groups; memberships
    # added outside of the role are removed again. Group existence was
    # validated in tasks/init.yml.
    groups: >-
      {{
        ([run_acmesh_group] + (run_acmesh_user_supplementary_groups | ansible.builtin.default([])))
        | ansible.builtin.unique
      }}
    append: false # remove from all groups (except the primary one)


- name: "Setup | Install | Default | Create a temporary working directory"
  ansible.builtin.tempfile:
    state: "directory"
    suffix: "-acmesh"
  changed_when:
    - false
  when:
    - not __run_acmesh_is_installed
    - not ansible_check_mode # the module does not support check mode
  register: __run_acmesh_tempdir


# Check mode cannot predict the installation: ansible.builtin.tempfile does
# not support check mode, so no temporary directory (and no clone) exists and
# the whole fresh-install sequence below is skipped coherently. This covers a
# global --check run as well as task-scoped check_mode (where the
# ansible_check_mode variable stays false but the module still skips itself).
- name: "Setup | Install | Default | Notify about the skipped installation (check mode)"
  ansible.builtin.debug:
    msg: >-
      acme.sh is not installed yet. A real run would clone
      {{ run_acmesh_git_url }} into a temporary directory and install it;
      check mode skips this installation sequence entirely.
  when:
    - not __run_acmesh_is_installed
    - __run_acmesh_tempdir['path'] is not ansible.builtin.defined


- name: "Setup | Install | Default | Display the temporary working directory's path"
  ansible.builtin.debug:
    var: __run_acmesh_tempdir
    verbosity: 2
  when:
    - not __run_acmesh_is_installed
    # the temporary directory exists only outside check mode (tempfile does
    # not support it); guards --check as well as task-scoped check_mode
    - __run_acmesh_tempdir['path'] is ansible.builtin.defined


- name: "Setup | Install | Default | git clone {{ run_acmesh_git_url }}"
  ansible.builtin.git:
    repo: "{{ run_acmesh_git_url }}"
    # on "master" branch as latest: https://github.com/acmesh-official/acme.sh/issues/1162
    version: "{{ (__run_acmesh_version_upstream) | ansible.builtin.ternary(__run_acmesh_version_upstream, run_acmesh_git_fallback_version_branch) }}"
    dest: "{{ __run_acmesh_tempdir['path'] }}"
    update: true
  when:
    - not __run_acmesh_is_installed
    # the temporary directory exists only outside check mode (tempfile does
    # not support it); guards --check as well as task-scoped check_mode
    - __run_acmesh_tempdir['path'] is ansible.builtin.defined


- name: "Setup | Install | Default | Hand the temporary working directory over to the service user"
  # The installation below runs acme.sh as the service user (like every other
  # acme.sh invocation of this role), so it has to be able to read the clone.
  ansible.builtin.file:
    path: "{{ __run_acmesh_tempdir['path'] }}"
    state: "directory"
    owner: "{{ run_acmesh_user }}"
    group: "{{ run_acmesh_group }}"
    recurse: true
  when:
    - not __run_acmesh_is_installed
    # the temporary directory exists only outside check mode (tempfile does
    # not support it); guards --check as well as task-scoped check_mode
    - __run_acmesh_tempdir['path'] is ansible.builtin.defined


- name: "Setup | Install | Default | Ensure existence and permissions of main directories"
  ansible.builtin.file:
    path: "{{ __run_acmesh_main_directory_item['path'] }}"
    state: "directory"
    owner: "{{ run_acmesh_user }}"
    group: "{{ run_acmesh_group }}"
    mode: "{{ __run_acmesh_main_directory_item['mode'] }}"
  loop:
    - path: "{{ run_acmesh_cfg_home }}"
      mode: "{{ __run_acmesh_cfg_home_dir_mode }}"
    - path: "{{ run_acmesh_cfg_config_home }}"
      mode: "{{ __run_acmesh_cfg_config_home_dir_mode }}"
    - path: "{{ run_acmesh_cfg_cert_home }}"
      mode: "{{ __run_acmesh_cfg_cert_home_dir_mode }}"
  loop_control:
    loop_var: "__run_acmesh_main_directory_item"
  notify:
    - "run_acmesh: set ownership and permissions"


- name: "Setup | Install | Default | Ensure log file existence"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_logfile_item['path'] }}"
    content: ""
    force: false # create file only if it is not already existing
    owner: "{{ run_acmesh_user }}"
    group: "{{ run_acmesh_group }}"
    mode: "{{ __run_acmesh_logfile_item['mode'] }}"
  loop:
    - path: "{{ run_acmesh_cfg_logfile }}"
      mode: "{{ __run_acmesh_cfg_logfile_file_mode }}"
  loop_control:
    loop_var: "__run_acmesh_logfile_item"


- name: "Setup | Install | Default | Install acme.sh"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to interact with acme.sh.
  # - Inline templating allows for safe and efficient parameter handling,
  #   avoiding the need for multiple additional tasks with little to no benefit.
  #
  # Notes on the command or script itself:
  #
  # See the official documentation for a explanation of the parameters:
  # https://github.com/acmesh-official/acme.sh/wiki/Options-and-Params
  ansible.builtin.command:
    # The setpriv prefix runs acme.sh as the service user, see vars/main.yml.
    # This way account.conf and every other file acme.sh creates belong to the
    # service user from the start (the config tasks run acme.sh unprivileged
    # before any ownership-normalizing handler had a chance to run).
    cmd: >
      {{ __run_acmesh_setpriv_run_as_user }} -- ./acme.sh
        --install
        --home {{ run_acmesh_cfg_home | ansible.builtin.quote }}
        --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }}
        --certhome {{ run_acmesh_cfg_cert_home | ansible.builtin.quote }}
        --log {{ run_acmesh_cfg_logfile | ansible.builtin.quote }}
        --log-level {{ run_acmesh_cfg_log_level | ansible.builtin.quote }}
        --syslog {{ run_acmesh_cfg_syslog | ansible.builtin.quote }}
        --nocron
        {{ '--auto-upgrade 1'
          if ((run_acmesh_autoupgrade is ansible.builtin.defined) and
              (run_acmesh_autoupgrade))
          else
          '--auto-upgrade 0' }}
        {{ '--accountemail ' ~ (run_acmesh_cfg_accountemail | ansible.builtin.quote)
          if ((run_acmesh_cfg_accountemail is ansible.builtin.defined) and
              (run_acmesh_cfg_accountemail))
          else
          '' }}
  args:
    chdir: "{{ __run_acmesh_tempdir['path'] }}"
    creates: "{{ run_acmesh_cfg_home }}/acme.sh"
  # HOME mirrors the environment of the renewal service unit. acme.sh's
  # installer also writes its profile source-line there (into
  # "<run_acmesh_cfg_home>/.bashrc"), which a later task removes in favor of
  # the system-wide profile.d entry.
  environment:
    HOME: "{{ run_acmesh_cfg_home }}"
  when:
    - not __run_acmesh_is_installed
    # the temporary directory exists only outside check mode (tempfile does
    # not support it); guards --check as well as task-scoped check_mode
    - __run_acmesh_tempdir['path'] is ansible.builtin.defined
  notify:
    - "run_acmesh: set ownership and permissions"


- name: "Setup | Install | Default | Upgrade acme.sh"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to interact with acme.sh.
  # - Inline templating allows for safe and efficient parameter handling,
  #   avoiding the need for multiple additional tasks with little to no benefit.
  #
  # Notes on the command or script itself:
  #
  # The --upgrade parameter alone would generally be sufficient. However, acme.sh
  # can update, modify, or correct configuration values during execution of most
  # subcommands. Setting the configuration parameters again ensures consistency and
  # does no harm. See the official documentation for a explanation of the parameters:
  # https://github.com/acmesh-official/acme.sh/wiki/Options-and-Params
  ansible.builtin.command:
    # The setpriv prefix runs acme.sh as the service user, see vars/main.yml.
    cmd: >
      {{ __run_acmesh_setpriv_run_as_user }} -- ./acme.sh
        --upgrade
        --home {{ run_acmesh_cfg_home | ansible.builtin.quote }}
        --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }}
        --certhome {{ run_acmesh_cfg_cert_home | ansible.builtin.quote }}
        --log {{ run_acmesh_cfg_logfile | ansible.builtin.quote }}
        --log-level {{ run_acmesh_cfg_log_level | ansible.builtin.quote }}
        --syslog {{ run_acmesh_cfg_syslog | ansible.builtin.quote }}
        {{ '--auto-upgrade 1'
          if ((run_acmesh_autoupgrade is ansible.builtin.defined) and
              (run_acmesh_autoupgrade))
          else
          '--auto-upgrade 0' }}
        {{ '--accountemail ' ~ (run_acmesh_cfg_accountemail | ansible.builtin.quote)
          if ((run_acmesh_cfg_accountemail is ansible.builtin.defined) and
              (run_acmesh_cfg_accountemail))
          else
          '' }}
  args:
    chdir: "{{ run_acmesh_cfg_home }}"
  when:
    - __run_acmesh_is_installed
    - __run_acmesh_version_installed is ansible.builtin.defined
    - __run_acmesh_version_upstream is ansible.builtin.defined
    - run_acmesh_autoupgrade is ansible.builtin.defined
    - run_acmesh_autoupgrade | ansible.builtin.bool
    # The upstream version stays empty when the remote could not be queried
    # (git ls-remote is best-effort and skipped in check mode). Comparing
    # against it would abort the whole run with an unrelated error message.
    - (run_acmesh_git_version | ansible.builtin.default('', true) | ansible.builtin.trim | ansible.builtin.length) > 0 or
      (((__run_acmesh_version_upstream | ansible.builtin.default('', true) | ansible.builtin.trim) | ansible.builtin.length) > 0 and
       __run_acmesh_version_installed is ansible.builtin.version(__run_acmesh_version_upstream, 'lt', version_type='semver'))
  changed_when:
    - __run_acmesh_upgrade_result is ansible.builtin.success
    - ('Upgrade success') in __run_acmesh_upgrade_result['stdout']
  register: __run_acmesh_upgrade_result
  notify:
    - "run_acmesh: set ownership and permissions"


# update facts related to state of the local installation
- name: "Setup | Install | Default | Determine installed version again"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to retrieve the version.
  # - The script includes inline logic to handle potential edge cases (e.g.,
  #   non-numeric output) while only using standard tooling. A replacement
  #   would require many additional tasks with little to no benefit.
  # - Using ansible.builtin.stat and/or ansible.builtin.command for a safer exec
  #   environment would require additional tasks with little to no benefit.
  # - Security concerns are mitigated by strict path usage and input validation.
  ansible.builtin.shell:
    cmd: |
      set -u # Fail on unset vars
      set -o pipefail # Fail if any pipe cmd fails

      __run_acmesh_version_installed=""
      if command -v {{ (run_acmesh_cfg_home ~ '/acme.sh') | ansible.builtin.quote }} > /dev/null 2>&1
      then
        __run_acmesh_version_installed=$({{ (run_acmesh_cfg_home ~ '/acme.sh' ) | ansible.builtin.quote }} --version | tail -1 | sed -e 's/^v//g')
        if ! printf '%s' "${__run_acmesh_version_installed}" | grep -E -q -e '^[[:digit:]\.]*$'
        then
          __run_acmesh_version_installed=''
        fi
      fi

      printf '%s' "${__run_acmesh_version_installed}"
      exit 0
    executable: "/bin/bash" # Support for other shells untested (so far)
  changed_when:
    - false
  ignore_errors: true
  register: __run_acmesh_version_installed_result
  # read-only probe; run it under "--check" too (see the init counterpart)
  check_mode: false


- name: "Setup | Install | Default | Update / overwrite installed version facts"
  ansible.builtin.set_fact:
    __run_acmesh_is_installed: >-
      {{
        (__run_acmesh_version_installed_result is ansible.builtin.success)
        | ansible.builtin.ternary(
          (__run_acmesh_version_installed_result['stdout'] | ansible.builtin.default('') | ansible.builtin.length > 0),
          false
        )
      }}
    __run_acmesh_version_installed: >-
      {{
        (__run_acmesh_version_installed_result is ansible.builtin.success)
        | ansible.builtin.ternary(
          (__run_acmesh_version_installed_result['stdout'] | ansible.builtin.default('')),
          ''
        )
      }}


- name: "Setup | Install | Default | Display installed version (if any, empty string means \"not installed\")"
  ansible.builtin.debug:
    var: __run_acmesh_version_installed
    verbosity: 1


- name: "Setup | Install | Default | Check if acme.sh.env file exists"
  ansible.builtin.stat:
    path: "{{ run_acmesh_cfg_home }}/acme.sh.env" # Might be missing if acme.sh was installed with --no-profile
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __run_acmesh_envfile_stat_result


# Modifying the calling user's .bashrc is the default installer behavior.
# Let's remove the source-calls in individual user .bashrc file and create a
# system-wide alias for acme.sh with all required options instead.
- name: "Setup | Install | Default | Symlink env file for profile.d"
  ansible.builtin.file:
    src: "{{ run_acmesh_cfg_home }}/acme.sh.env"
    dest: "{{ __run_acmesh_profiled_envfile_path }}"
    state: "link"
  when:
    - __run_acmesh_envfile_stat_result is ansible.builtin.defined
    - __run_acmesh_envfile_stat_result['stat']['exists']


- name: "Setup | Install | Default | Remove redundant env file sourcing from the user's .bashrc"
  ansible.builtin.lineinfile:
    path: "{{ run_acmesh_cfg_home }}/.bashrc"
    state: "absent"
    regexp: "^\\. \"{{ run_acmesh_cfg_home }}/acme.sh.env\"$"
  when:
    - __run_acmesh_envfile_stat_result is ansible.builtin.defined
    - __run_acmesh_envfile_stat_result['stat']['exists']


- name: "Setup | Install | Default | Clean-up temporary working directory"
  ansible.builtin.file:
    path: "{{ __run_acmesh_tempdir['path'] }}"
    state: "absent"
  when:
    - __run_acmesh_tempdir is ansible.builtin.defined
    - __run_acmesh_tempdir['path'] is ansible.builtin.defined


# Whether acme.sh is usable for the configuration and certificate phases:
# either it was installed before this run or the fresh installation above
# could actually happen (in check mode it cannot, see the notice task; the
# later phases would fail on the missing installation, e.g. the chdir of
# "Config | Default | Configure acme.sh" happens even in check mode).
- name: "Setup | Install | Default | Determine whether acme.sh is available for the later phases"
  ansible.builtin.set_fact:
    __run_acmesh_install_available: >-
      {{
        (__run_acmesh_is_installed | ansible.builtin.bool)
        or (__run_acmesh_tempdir['path'] is ansible.builtin.defined)
      }}
