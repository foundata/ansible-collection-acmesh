# Run only on disposable SSH targets with acme.sh, Pebble and pebble-challtestsrv.
# tests/credential_transport.py supplies private, randomly generated input values.
#
# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later

---
- name: "Credentials | Verify SSH transport"
  hosts: "molecule"
  gather_facts: true
  become: true
  vars:
    run_acmesh_cfg_accountemail: "transport@example.test"
    run_acmesh_environment:
      TRANSPORT_TOKEN: "{{ transport_secrets['overridden'] }}"
      TRANSPORT_GLOBAL: "{{ transport_secrets['global'] }}"
      TRANSPORT_GLOBAL_HASH: "{{ transport_secrets['global'] | ansible.builtin.hash('sha256') }}"
      TRANSPORT_NUMBER: 17
    run_acmesh_certs:
      - domains:
          - name: "{{ transport_domain }}"
            challenge:
              type: "dns"
              dns_provider: "dns_transport"
        server: "https://localhost:14000/dir"
        dnssleep: 1
        environment:
          TRANSPORT_TOKEN: "{{ transport_secrets['token'] }}"
          TRANSPORT_HASH: "{{ transport_secrets['token'] | ansible.builtin.hash('sha256') }}"
          NO_ARI: "1"
        install:
          fullchain_file: "/etc/pki/tls/certs/{{ transport_domain }}/fullchain.cer"
          key_file: "/etc/pki/tls/certs/{{ transport_domain }}/cert.key"
  tasks:
    - name: "Credentials | Initialize role variables"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "init"
        public: true

    - name: "Credentials | Install the synthetic DNS provider"
      ansible.builtin.copy:
        src: "files/dns_transport.sh"
        dest: "{{ run_acmesh_cfg_home }}/dnsapi/dns_transport.sh"
        owner: "{{ run_acmesh_user }}"
        group: "{{ run_acmesh_group }}"
        mode: "u=rwx,g=rx,o=" # 0750

    - name: "Credentials | Issue and install through the role"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"

    - name: "Credentials | Assert a real certificate was issued"
      ansible.builtin.assert:
        that:
          - __run_acmesh_issue_result is ansible.builtin.changed
        quiet: true

    - name: "Credentials | Repeat with the still-valid certificate"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "cert/default"

    - name: "Credentials | Assert issuance and publication were skipped"
      ansible.builtin.assert:
        that:
          - __run_acmesh_issue_result is not ansible.builtin.changed
          - (__run_acmesh_deploy_pending | ansible.builtin.length) == 0
        quiet: true

    - name: "Credentials | Check provider failure without exposing its output"
      block:
        - name: "Credentials | Request a failing challenge"
          ansible.builtin.include_role:
            name: "foundata.acmesh.run"
            tasks_from: "cert/default"
          vars:
            run_acmesh_certs:
              - domains:
                  - name: "{{ transport_domain }}"
                    challenge:
                      type: "dns"
                      dns_provider: "dns_transport"
                server: "https://localhost:14000/dir"
              - domains:
                  - name: "fail-{{ transport_domain }}"
                    challenge:
                      type: "dns"
                      dns_provider: "dns_transport"
                server: "https://localhost:14000/dir"
                dnssleep: 1
                environment:
                  TRANSPORT_TOKEN: "{{ transport_secrets['token'] }}"
                  TRANSPORT_HASH: "{{ transport_secrets['token'] | ansible.builtin.hash('sha256') }}"
                  TRANSPORT_FAIL: "1"
                  NO_ARI: "1"
        - name: "Credentials | Reject an unexpected success"
          ansible.builtin.fail:
            msg: "The failing provider was accepted."
      rescue:
        - name: "Credentials | Assert the failure came from issuance"
          ansible.builtin.assert:
            that:
              - ansible_failed_task['name'] is ansible.builtin.search('Stop after failed issuance')
              - transport_secrets['token'] in __run_acmesh_issue_result['results'][1]['stdout']
              - transport_secrets['global'] in __run_acmesh_issue_result['results'][1]['stderr']
              - __run_acmesh_failure_details | ansible.builtin.length == 1
              - __run_acmesh_failure_details[0]['domain'] == 'fail-' ~ transport_domain
              - __run_acmesh_failure_details[0]['operation'] == 'issuance'
              - __run_acmesh_failure_details[0]['challenge'] == 'dns'
              - __run_acmesh_failure_details[0]['dns_provider'] == 'dns_transport'
              - __run_acmesh_issue_result['results'][0]['rc'] == 2
            quiet: true
          no_log: true

    - name: "Credentials | Remove the deliberately failed certificate"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "cert/default"
      vars:
        run_acmesh_certs:
          - domains:
              - name: "fail-{{ transport_domain }}"
            state: "absent"

    - name: "Credentials | Reject malformed handoff input even for a valid certificate"
      block:
        - name: "Credentials | Supply an invalid environment name"
          ansible.builtin.include_role:
            name: "foundata.acmesh.run"
            tasks_from: "cert/default"
          vars:
            run_acmesh_certs:
              - domains:
                  - name: "{{ transport_domain }}"
                    challenge:
                      type: "dns"
                      dns_provider: "dns_transport"
                server: "https://localhost:14000/dir"
                environment:
                  "INVALID=NAME": "{{ transport_secrets['token'] }}"

        - name: "Credentials | Reject an input error treated as skipped issuance"
          ansible.builtin.fail:
            msg: "The role accepted invalid handoff input."
      rescue:
        - name: "Credentials | Assert handoff validation failed without echoing input"
          ansible.builtin.assert:
            that:
              - ansible_failed_task['name'] is ansible.builtin.search('Stop after failed issuance')
              - __run_acmesh_issue_result['results'][0]['rc'] == 64
              - __run_acmesh_issue_result['results'][0]['stdout'] == ''
              - >-
                __run_acmesh_issue_result['results'][0]['stderr'] == 'acmesh-run: invalid environment input'
            quiet: true
          no_log: true

    - name: "Credentials | Check child environment and ancestor command lines"
      ansible.builtin.command:
        argv:
          - "{{ __run_acmesh_setpriv_exec_path }}"
          - "--reuid"
          - "{{ run_acmesh_user }}"
          - "--regid"
          - "{{ run_acmesh_group }}"
          - "--init-groups"
          - "--"
          - "{{ __run_acmesh_runner_python }}"
          - "{{ __run_acmesh_runner_path }}"
          - "{{ __run_acmesh_runner_python }}"
          - "-c"
          - |
            import os, pathlib, sys
            token = os.environ['TOKEN'].encode()
            assert token and sys.stdin.read() == ''
            pid = os.getpid()
            while pid > 1:
                proc = pathlib.Path('/proc') / str(pid)
                assert token not in (proc / 'cmdline').read_bytes()
                pid = int((proc / 'stat').read_text().rsplit(')', 1)[1].split()[1])
        stdin: "{{ {'TOKEN': transport_secrets['token']} | ansible.builtin.to_json }}"
        stdin_add_newline: false
      changed_when:
        - false
      no_log: true

    - name: "Credentials | Exercise interrupted child execution"
      ansible.builtin.command:
        argv:
          - "{{ __run_acmesh_setpriv_exec_path }}"
          - "--reuid"
          - "{{ run_acmesh_user }}"
          - "--regid"
          - "{{ run_acmesh_group }}"
          - "--init-groups"
          - "--"
          - "{{ __run_acmesh_runner_python }}"
          - "{{ __run_acmesh_runner_path }}"
          - "{{ __run_acmesh_runner_python }}"
          - "-c"
          - "import os,signal; os.kill(os.getpid(),signal.SIGTERM)"
        stdin: "{{ {'TOKEN': transport_secrets['token']} | ansible.builtin.to_json }}"
        stdin_add_newline: false
      changed_when:
        - false
      failed_when:
        - __testing_interrupted['rc'] != -15
      register: __testing_interrupted
      no_log: true

    - name: "Credentials | Check persisted credentials remain private after failure"
      ansible.builtin.stat:
        path: "{{ run_acmesh_cfg_config_home }}/account.conf"
      register: __testing_credential_stat

    - name: "Credentials | Assert credential file ownership and permissions"
      ansible.builtin.assert:
        that:
          - __testing_credential_stat['stat']['pw_name'] == run_acmesh_user
          - __testing_credential_stat['stat']['mode'] == '0600'
        quiet: true

    - name: "Credentials | Check the launcher remains root-owned"
      ansible.builtin.stat:
        path: "{{ __run_acmesh_runner_path }}"
      register: __testing_runner_stat

    - name: "Credentials | Assert the service user cannot replace the launcher"
      ansible.builtin.assert:
        that:
          - __testing_runner_stat['stat']['uid'] == 0
          - __testing_runner_stat['stat']['gid'] == 0
          - __testing_runner_stat['stat']['mode'] == '0644'
        quiet: true

- name: "Credentials | Check cleanup after success and failures"
  ansible.builtin.import_playbook: "cleanup.yml"
