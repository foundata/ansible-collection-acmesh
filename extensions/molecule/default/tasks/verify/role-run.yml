        - path: "{{ run_acmesh_cfg_cert_deploy_base_dir }}/acmesh-webroot.test"
          expect: true
      loop_control:
        label: "{{ item['path'] }}"
      register: __testing_acmesh_sweep_stat


    - name: "Molecule | Verify | Assert the sweep removed stray resources and kept managed ones"
      ansible.builtin.assert:
