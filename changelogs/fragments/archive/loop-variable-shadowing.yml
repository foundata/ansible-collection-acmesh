---

minor_changes:
  - >
    ``run`` - Improve Ansible compatibility for roles and collections used in
    the wild by giving every loop in the role a private, purpose-specific loop
    variable derived from the role's public variable prefix
    (``__run_acmesh_*_item``) instead of ``item``. This avoids rebinding a
    caller's ``item`` when role parameters reference it, such as when the role
    itself is included from a loop, and makes the role behave more robustly
    across common Ansible usage patterns.
