## Reload decoupling: root-side acmesh-reload-* path/service units

- name: "Molecule | Verify | Reload units (webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Gather stats for the reload unit files (webroot challenge)"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.path"
        - "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.service"
      register: __testing_acmesh_reload_files_stat


    - name: "Molecule | Verify | Assert reload unit files exist with root ownership (webroot challenge)"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isreg']
          - item['stat']['pw_name'] == 'root'
          - item['stat']['gr_name'] == 'root'
        fail_msg: "{{ item['item'] }} does not exist or is not owned by root:root"
      loop: "{{ __testing_acmesh_reload_files_stat['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"


    - name: "Molecule | Verify | Read the reload service unit file (webroot challenge)"
      ansible.builtin.slurp:
        src: "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.service"
      register: __testing_acmesh_reload_serviceunit_content


    - name: "Molecule | Verify | Assert the reload command is inlined into ExecStart (webroot challenge)"
      # Fidelity of the (systemd-escaped) inlined command is proven end-to-end
      # by the marker content assertions below, which compare the output of
      # the escaping-torture reloadcmd byte-identically.
      ansible.builtin.assert:
        that:
          - >-
            'ExecStart=/bin/sh -c "' in
            (__testing_acmesh_reload_serviceunit_content['content'] | ansible.builtin.b64decode)
        fail_msg: "The reload service unit does not inline the reload command into ExecStart."


    - name: "Molecule | Verify | Get acmesh-reload path unit state (webroot challenge)"
      ansible.builtin.command:
        argv:
          - "systemctl"
          - "show"
          - "acmesh-reload-acmesh-webroot.test.path"
          - "--property=ActiveState,UnitFileState"
      changed_when:
        - false
      register: __testing_acmesh_reload_path_state


    - name: "Molecule | Verify | Assert acmesh-reload path unit is active and enabled (webroot challenge)"
      ansible.builtin.assert:
        that:
          - "'ActiveState=active' in __testing_acmesh_reload_path_state['stdout']"
          - "'UnitFileState=enabled' in __testing_acmesh_reload_path_state['stdout']"
        fail_msg: >-
          The acmesh-reload path unit is not active/enabled:
          {{ __testing_acmesh_reload_path_state['stdout'] }}


    # The converge run installed the certificate files, which must have
    # triggered the path unit; the reloadcmd writes the executing username
    # into the marker file, proving the reload ran as root.
    - name: "Molecule | Verify | Gather stats for the reload marker file written during converge (webroot challenge)"
      ansible.builtin.stat:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_reload_marker_stat


    - name: "Molecule | Verify | Assert the reload marker file was written during converge (webroot challenge)"
      ansible.builtin.assert:
        that:
          - __testing_acmesh_reload_marker_stat['stat']['exists']
        fail_msg: >-
          /var/tmp/acmesh-reload-webroot-marker does not exist: installing the
          certificate files did not trigger the acmesh-reload path unit.


    # Functional round-trip, negative direction: an unprivileged write to the
    # STAGED completion file with unchanged content (as done by acme.sh on
    # every --install-cert run) must trigger the deploy service via the
    # acmesh-deploy-*.path unit, but the helper must not replace the final
    # files (content is identical) and therefore no reload may fire. "dd" with
    # "conv=notrunc" and zero blocks opens the file for writing and closes it
    # again without altering its content, firing the close-after-write event.
    - name: "Molecule | Verify | Remove the reload marker file (webroot challenge)"
      ansible.builtin.file:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        state: "absent"


    - name: "Molecule | Verify | Record the final fullchain file state before the staging touch (webroot challenge)"
      ansible.builtin.stat:
        path: "/etc/pki/tls/certs/acmesh-webroot.test/fullchain.cer"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_fullchain_before


    - name: "Molecule | Verify | Count previous in-sync deploy runs in the journal (webroot challenge)"
      # The command or shell module is used intentionally:
      # Ansible provides no dedicated module to perform this operation.
      ansible.builtin.shell:
        cmd: |
          set -u # no uninitialized vars
          set -o pipefail
          journalctl -t acmesh-deploy --no-pager 2>/dev/null | grep -c 'already in sync' || true
        executable: "/bin/bash"
      changed_when:
        - false
      register: __testing_acmesh_insync_count_before


    - name: "Molecule | Verify | Touch the staged completion file as the service user (webroot challenge)"
      ansible.builtin.command:
        argv:
          - "runuser"
          - "-u"
          - "{{ run_acmesh_user }}"
          - "--"
          - "dd"
          - "if=/dev/null"
          - "of={{ run_acmesh_cfg_cert_deploy_base_dir }}/acmesh-webroot.test/fullchain.cer"
          - "conv=notrunc"
      changed_when:
        - true


    - name: "Molecule | Verify | Wait for the path-triggered deploy service run (webroot challenge)"
      # The command or shell module is used intentionally:
      # Ansible provides no dedicated module to perform this operation.
      ansible.builtin.shell:
        cmd: |
          set -u # no uninitialized vars
          set -o pipefail
          journalctl -t acmesh-deploy --no-pager 2>/dev/null | grep -c 'already in sync' || true
        executable: "/bin/bash"
      changed_when:
        - false
      register: __testing_acmesh_insync_count_after
      until:
        - (__testing_acmesh_insync_count_after['stdout'] | ansible.builtin.trim | ansible.builtin.int)
          > (__testing_acmesh_insync_count_before['stdout'] | ansible.builtin.trim | ansible.builtin.int)
      retries: 15
      delay: 2


    - name: "Molecule | Verify | Record the final fullchain file state after the staging touch (webroot challenge)"
      ansible.builtin.stat:
        path: "/etc/pki/tls/certs/acmesh-webroot.test/fullchain.cer"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_fullchain_after


    - name: "Molecule | Verify | Gather stats for the reload marker after the unchanged-content deployment (webroot challenge)"
      ansible.builtin.stat:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_reload_marker_stat_unchanged


    - name: "Molecule | Verify | Assert unchanged content neither replaced the final files nor triggered a reload"
      ansible.builtin.assert:
        that:
          - __testing_acmesh_fullchain_after['stat']['inode'] == __testing_acmesh_fullchain_before['stat']['inode']
          - __testing_acmesh_fullchain_after['stat']['mtime'] == __testing_acmesh_fullchain_before['stat']['mtime']
          - not __testing_acmesh_reload_marker_stat_unchanged['stat']['exists']
        fail_msg: >-
          A staged deployment with unchanged content replaced the final files
          or triggered the reload command (inode before/after:
          {{ __testing_acmesh_fullchain_before['stat']['inode'] }}/{{ __testing_acmesh_fullchain_after['stat']['inode'] }};
          marker exists:
          {{ __testing_acmesh_reload_marker_stat_unchanged['stat']['exists'] }}).
        success_msg: >-
          The path-triggered deploy service ran on the staging touch but left
          the identical final files untouched and did not trigger a reload.


## Renewal parity
#
# A forced renewal as the unprivileged service user must work end-to-end (issue
# #20). This emulates what acmesh-renewal.service does, including the webroot
# challenge against pebble, the reinstallation of the certificate files and the
# root-side reload trigger.

- name: "Molecule | Verify | Renewal as the service user (webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Remove the reload marker file again (webroot challenge)"
      ansible.builtin.file:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        state: "absent"


    - name: "Molecule | Verify | Force a renewal as the service user (webroot challenge)"
      ansible.builtin.command:
        cmd: >
          runuser -u {{ run_acmesh_user | ansible.builtin.quote }} --
          ./acme.sh
            --renew
            --force
            --ecc
            --domain acmesh-webroot.test
            --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }}
            --certhome {{ run_acmesh_cfg_cert_home | ansible.builtin.quote }}
      args:
        chdir: "{{ run_acmesh_cfg_home }}"
      environment:
        # Mirror the Environment= of acmesh-renewal.service
        HOME: "{{ run_acmesh_cfg_home }}"
      changed_when:
        - true
      register: __testing_acmesh_forced_renewal


    - name: "Molecule | Verify | Assert the forced renewal succeeded (webroot challenge)"
      ansible.builtin.assert:
        that:
          - __testing_acmesh_forced_renewal['rc'] == 0
          - "'Cert success' in __testing_acmesh_forced_renewal['stdout']"
        fail_msg: >-
          Renewing the certificate as the unprivileged service user failed:
          {{ __testing_acmesh_forced_renewal['stdout'] | ansible.builtin.default('') }}
          {{ __testing_acmesh_forced_renewal['stderr'] | ansible.builtin.default('') }}


    - name: "Molecule | Verify | Wait for the reload marker file after the renewal (webroot challenge)"
      ansible.builtin.stat:
        path: "/var/tmp/acmesh-reload-webroot-marker"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_reload_marker_stat_renewal
      until:
        - __testing_acmesh_reload_marker_stat_renewal['stat']['exists']
      retries: 15
      delay: 2


    - name: "Molecule | Verify | Read the reload marker file after the renewal (webroot challenge)"
      ansible.builtin.slurp:
        src: "/var/tmp/acmesh-reload-webroot-marker"
      register: __testing_acmesh_reload_marker_content_renewal


    - name: "Molecule | Verify | Assert the renewal reinstalled the certificate and triggered the root-side reload"
      ansible.builtin.assert:
        that:
          - >-
            (__testing_acmesh_reload_marker_content_renewal['content'] | ansible.builtin.b64decode | ansible.builtin.trim)
            == __testing_reload_marker_expected
        fail_msg: >-
          The unprivileged renewal did not trigger the root-side reload
          (marker content:
          {{ __testing_acmesh_reload_marker_content_renewal['content'] | ansible.builtin.b64decode | ansible.builtin.trim }};
          expected: {{ __testing_reload_marker_expected }}).
        success_msg: >-
          The unprivileged renewal reinstalled the certificate files and the
          reload command ran as root.


    # The renewal ran without any Ansible ownership fixups afterwards, so this
    # is a meaningful check that the whole acme.sh runtime operates as the
    # service user (a root-owned file here would mean some step still runs
    # with too many privileges). The staging directory is included: acme.sh
    # writes it during renewal. The final destinations are NOT included, they
    # are legitimately root-owned per the install.permissions fixture.
    - name: "Molecule | Verify | Find files not owned by the service user after the unprivileged renewal"
      ansible.builtin.command:
        argv:
          - "find"
          - "{{ run_acmesh_cfg_home }}"
          - "{{ run_acmesh_cfg_config_home }}"
          - "{{ run_acmesh_cfg_cert_home }}"
          - "{{ run_acmesh_cfg_cert_deploy_base_dir }}/acmesh-webroot.test"
          - "!"
          - "-user"
          - "{{ run_acmesh_user }}"
      changed_when:
        - false
      register: __testing_acmesh_foreign_owned_files


    - name: "Molecule | Verify | Assert no foreign-owned files exist after the unprivileged renewal"
      ansible.builtin.assert:
        that:
          - (__testing_acmesh_foreign_owned_files['stdout'] | ansible.builtin.trim | ansible.builtin.length) == 0
        fail_msg: >-
          Files not owned by {{ run_acmesh_user }} found after the unprivileged
          renewal: {{ __testing_acmesh_foreign_owned_files['stdout_lines'] | ansible.builtin.default([]) }}


## Strict installation failure handling (issue #22)
#
# acme.sh prints "Installing ..." for every file before writing it, so a
# partial installation (here: a private key below a parent directory the
# service user cannot traverse) exits nonzero while still producing that
# output. The role must fail on the nonzero exit status instead of treating
# the partial installation as success, which would leave already deployed
# files stale on every renewal.

- name: "Molecule | Verify | Strict install failure handling (webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Install failure: create a protected parent directory"
      ansible.builtin.file:
        path: "/etc/molecule-acmesh-protected-fail"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "u=rwx,g=,o=" # 0700


    - name: "Molecule | Verify | Install failure: reinstall with an inaccessible key destination (must fail)"
      # Uses the "direct" strategy on purpose: only there does the
      # unprivileged acme.sh write the final paths itself and hit the
      # inaccessible destination (the staged strategy exists precisely to
      # avoid this failure mode).
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_certs:
          - domains:
              - name: "acmesh-webroot.test"
                challenge:
                  type: "webroot"
                  webroot: "/var/www/acmesh-test"
            install:
              strategy: "direct"
              ca_file: "/etc/pki/tls/certs/acmesh-webroot.test/ca.cer"
              cert_file: "/etc/pki/tls/certs/acmesh-webroot.test/cert.cer"
              fullchain_file: "/etc/pki/tls/certs/acmesh-webroot.test/fullchain.cer"
              key_file: "/etc/molecule-acmesh-protected-fail/acmesh-webroot.test/cert.key"
              reloadcmd: ""
            server: "https://localhost:14000/dir"


    - name: "Molecule | Verify | Install failure: force a failure because the partial installation was accepted"
      ansible.builtin.fail:
        msg: "The role accepted a nonzero acme.sh --install-cert exit status (partial installation)."

  rescue:

    - name: "Molecule | Verify | Install failure: assert the run failed in the install task"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('Install certificate')
        fail_msg: >-
          The run failed, but not in the certificate installation task as
          expected (failed task:
          '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "A partially failing acme.sh --install-cert fails the role."


- name: "Molecule | Verify | Install failure: restore the original installation settings"
  ansible.builtin.include_role:
    name: "foundata.acmesh.run"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)


- name: "Molecule | Verify | Install failure: remove the protected parent directory"
  ansible.builtin.file:
    path: "/etc/molecule-acmesh-protected-fail"
    state: "absent"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)


## Strict issuance failure handling
#
# acme.sh prints "Domains not changed" before it decides whether a renewal is
# due, so matching that text swallowed genuine issuance and renewal failures.
# Failure detection is based on the exit status instead, with status 2
# (RENEW_SKIP, "not due yet") remaining a success. An unreachable ACME server
# makes acme.sh exit non-zero, which must fail the role.

- name: "Molecule | Verify | Issuance failure: define the throwaway certificate"
  # A dedicated, never-issued domain: the failing run must not disturb the
  # certificates the other checks rely on. Port 1 on the loopback interface
  # refuses connections, so acme.sh fails fast without any network wait.
  ansible.builtin.set_fact:
    __testing_issuefail_certs:
      - domains:
          - name: "acmesh-issuefail.test"
            challenge:
              type: "webroot"
              webroot: "/var/www/acmesh-test"
        install:
          fullchain_file: "/etc/pki/tls/certs/acmesh-issuefail.test/fullchain.cer"
          key_file: "/etc/pki/tls/certs/acmesh-issuefail.test/cert.key"
          reloadcmd: ""
        server: "https://127.0.0.1:1/dir"


- name: "Molecule | Verify | Strict issuance failure handling"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Issuance failure: issue against an unreachable ACME server (must fail)"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_certs: "{{ __testing_issuefail_certs }}"

    - name: "Molecule | Verify | Issuance failure: force a failure because the failed issuance was accepted"
      ansible.builtin.fail:
        msg: "The role accepted a nonzero acme.sh --issue exit status."

  rescue:

    - name: "Molecule | Verify | Issuance failure: assert the run failed in the issuance task"
      ansible.builtin.assert:
        that:
          - (ansible_failed_task['name'] | ansible.builtin.default('')) is ansible.builtin.search('Issue certificate')
        fail_msg: >-
          The run failed, but not in the certificate issuance task as expected
          (failed task:
          '{{ ansible_failed_task['name'] | ansible.builtin.default('unknown') }}').
        success_msg: "A failing acme.sh --issue fails the role."


- name: "Molecule | Verify | Issuance failure: remove the throwaway certificate resources"
  ansible.builtin.include_role:
    name: "foundata.acmesh.run"
  vars:
    run_acmesh_certs: >-
      {{
        __testing_issuefail_certs
        | ansible.builtin.map('ansible.builtin.combine', {'state': 'absent'})
        | ansible.builtin.list
      }}
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)


## Strategy transitions (direct -> staged -> direct)

- name: "Molecule | Verify | Installation strategy transitions (webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Transitions: switch the direct certificate to the staged strategy"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_certs:
          - domains:
              - name: "acmesh-direct.test"
                challenge:
                  type: "webroot"
                  webroot: "/var/www/acmesh-test"
            install:
              strategy: "staged"
              ca_file: "/etc/pki/tls/certs/acmesh-direct.test/ca.cer"
              cert_file: "/etc/pki/tls/certs/acmesh-direct.test/cert.cer"
              fullchain_file: "/etc/pki/tls/certs/acmesh-direct.test/fullchain.cer"
              key_file: "/etc/pki/tls/certs/acmesh-direct.test/cert.key"
              reloadcmd: ""
            server: "https://localhost:14000/dir"


    - name: "Molecule | Verify | Transitions: gather stats for the staged deployment resources"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "{{ run_acmesh_cfg_cert_deploy_base_dir }}/acmesh-direct.test"
        - "{{ run_acmesh_cfg_cert_deploy_base_dir }}/acmesh-direct.test/fullchain.cer"
        - "/etc/acmesh-deploy.d/acmesh-direct.test.json"
        - "/etc/systemd/system/acmesh-deploy-acmesh-direct.test.path"
        - "/etc/systemd/system/acmesh-deploy-acmesh-direct.test.service"
      register: __testing_acmesh_transition_staged_stat


    - name: "Molecule | Verify | Transitions: assert the staged deployment resources were created"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
        fail_msg: "{{ item['item'] }} does not exist after the direct -> staged transition"
      loop: "{{ __testing_acmesh_transition_staged_stat['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"


    - name: "Molecule | Verify | Transitions: switch the certificate back to the direct strategy"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_certs:
          - domains:
              - name: "acmesh-direct.test"
                challenge:
                  type: "webroot"
                  webroot: "/var/www/acmesh-test"
            install:
              strategy: "direct"
              ca_file: "/etc/pki/tls/certs/acmesh-direct.test/ca.cer"
              cert_file: "/etc/pki/tls/certs/acmesh-direct.test/cert.cer"
              fullchain_file: "/etc/pki/tls/certs/acmesh-direct.test/fullchain.cer"
              key_file: "/etc/pki/tls/certs/acmesh-direct.test/cert.key"
              reloadcmd: ""
            server: "https://localhost:14000/dir"


    - name: "Molecule | Verify | Transitions: gather stats for the staged deployment resources again"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "{{ run_acmesh_cfg_cert_deploy_base_dir }}/acmesh-direct.test"
        - "/etc/acmesh-deploy.d/acmesh-direct.test.json"
        - "/etc/systemd/system/acmesh-deploy-acmesh-direct.test.path"
        - "/etc/systemd/system/acmesh-deploy-acmesh-direct.test.service"
      register: __testing_acmesh_transition_direct_stat


    - name: "Molecule | Verify | Transitions: assert the staged deployment resources were removed again"
      ansible.builtin.assert:
        that:
          - not item['stat']['exists']
        fail_msg: "{{ item['item'] }} still exists after the staged -> direct transition"
      loop: "{{ __testing_acmesh_transition_direct_stat['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"


    - name: "Molecule | Verify | Transitions: gather stats for the final certificate files"
      ansible.builtin.stat:
        path: "/etc/pki/tls/certs/acmesh-direct.test/{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "fullchain.cer"
        - "cert.key"
      register: __testing_acmesh_transition_files_stat


    - name: "Molecule | Verify | Transitions: assert the final certificate files survived both transitions"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isreg']
        fail_msg: "{{ item['item'] }} vanished during the strategy transitions"
      loop: "{{ __testing_acmesh_transition_files_stat['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"


## Regression: role included in a loop with item-templated configuration
#
# Role-internal loops must not shadow "item".

- name: "Molecule | Verify | Loop-included role invocation with item-templated configuration"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Loop include: include the role once per outer loop item"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_environment: "{{ item['environment'] }}"
        run_acmesh_certs:
          - domains:
              - name: "{{ item['domain'] }}"
                challenge:
                  type: "webroot"
                  webroot: "{{ item['webroot'] }}"
            install:
              strategy: "direct"
              ca_file: "/etc/pki/tls/certs/{{ item['cert_dir_name'] }}/ca.cer"
              cert_file: "/etc/pki/tls/certs/{{ item['cert_dir_name'] }}/cert.cer"
              fullchain_file: "/etc/pki/tls/certs/{{ item['cert_dir_name'] }}/fullchain.cer"
              key_file: "/etc/pki/tls/certs/{{ item['cert_dir_name'] }}/cert.key"
              reloadcmd: ""
            server: "https://localhost:14000/dir"
            # acme.sh returns RENEW_SKIP before it persists account settings,
            # so the issuance has to actually run for this check.
            force: true
      loop:
        - cert_dir_name: "acmesh-direct.test"
          domain: "acmesh-direct.test"
          webroot: "/var/www/acmesh-test"
          # acme.sh persists this into account.conf, which makes it observable.
          environment:
            HTTPS_INSECURE: 1
      loop_control:
        label: "{{ item['cert_dir_name'] }}"


    - name: "Molecule | Verify | Loop include: read account.conf to check the environment passthrough"
      ansible.builtin.slurp:
        src: "{{ run_acmesh_cfg_config_home }}/account.conf"
      register: __testing_acmesh_loopinclude_accountconf


    - name: "Molecule | Verify | Loop include: assert the environment reached acme.sh"
      ansible.builtin.assert:
        that:
          - "'HTTPS_INSECURE' in (__testing_acmesh_loopinclude_accountconf['content'] | ansible.builtin.b64decode)"
        fail_msg: >-
          run_acmesh_environment did not reach acme.sh when the role was
          included in a loop: the value is templated from the outer loop
          item and a role task shadowed "item" while dereferencing it.
        success_msg: >-
          The environment templated from the outer loop item reached acme.sh.


    - name: "Molecule | Verify | Loop include: read the certificate's acme.sh configuration"
      ansible.builtin.slurp:
        src: "{{ run_acmesh_cfg_cert_home }}/acmesh-direct.test_ecc/acmesh-direct.test.conf"
      register: __testing_acmesh_loopinclude_conf


    - name: "Molecule | Verify | Loop include: assert the installation configuration was stored, not cleared"
      ansible.builtin.assert:
        that:
          - >-
            "Le_RealKeyPath='/etc/pki/tls/certs/acmesh-direct.test/cert.key'"
            in (__testing_acmesh_loopinclude_conf['content'] | ansible.builtin.b64decode)
          - >-
            "Le_RealFullChainPath='/etc/pki/tls/certs/acmesh-direct.test/fullchain.cer'"
            in (__testing_acmesh_loopinclude_conf['content'] | ansible.builtin.b64decode)
        fail_msg: >-
          The loop-included role invocation did not store the expected
          Le_Real*Path values; the item-templated install paths were not
          resolved correctly:
          {{ __testing_acmesh_loopinclude_conf['content'] | ansible.builtin.b64decode
             | ansible.builtin.regex_findall('Le_Real[A-Za-z]*Path=[^\n]*') }}
        success_msg: >-
          Item-templated installation paths resolve correctly when the role is
          included in a loop.


## Deploy helper hardening (validation, attacks, concurrency, rollback)
#
# Focused tests of /usr/libexec/acmesh-deploy with crafted fixtures, run as
# root with an own manifest so they cannot interfere with the certificates
# managed by the role.

- name: "Molecule | Verify | Deploy helper hardening"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Helper: fixtures, initial deployment, idempotence and metadata reconciliation"
      # The command or shell module is used intentionally: this exercises the
      # helper binary end-to-end with openssl-crafted fixtures; dedicated
      # modules cannot cover these interactions.
      ansible.builtin.shell:
        cmd: |
          set -u              # no uninitialized vars
          set -e -o pipefail  # exit on (pipeline) errors
          FIX='/root/acmesh-helper-fixtures'
          STAGE={{ (run_acmesh_cfg_cert_deploy_base_dir ~ '/helper-fixture') | ansible.builtin.quote }}
          DESTDIR='/var/tmp/acmesh-helper-dest'
          MANIFEST='/etc/acmesh-deploy.d/helper-fixture.json'
          PY={{ __run_acmesh_deploy_python_exec_path | ansible.builtin.quote }}
          HELPER={{ __run_acmesh_deploy_helper_path | ansible.builtin.quote }}

          rm -rf "${FIX}" "${STAGE}" "${DESTDIR}"
          mkdir -p "${FIX}" "${STAGE}" "${DESTDIR}"
          chmod 0750 "${STAGE}"

          # matching key/cert pair A, foreign key B, matching-key cert with wrong domain
          openssl ecparam -name prime256v1 -genkey -noout -out "${FIX}/keyA.pem"
          openssl req -x509 -new -key "${FIX}/keyA.pem" -days 2 -subj '/CN=helper-fixture.test' \
            -addext 'subjectAltName=DNS:helper-fixture.test' -out "${FIX}/certA.pem"
          openssl ecparam -name prime256v1 -genkey -noout -out "${FIX}/keyB.pem"
          openssl req -x509 -new -key "${FIX}/keyA.pem" -days 2 -subj '/CN=other.test' \
            -addext 'subjectAltName=DNS:other.test' -out "${FIX}/cert_wrongdomain.pem"
          cp "${FIX}/keyA.pem" "${STAGE}/cert.key"
          cp "${FIX}/certA.pem" "${STAGE}/fullchain.cer"

          cat > "${MANIFEST}" <<EOF
          {
            "version": 1,
            "certificate_id": "helper-fixture",
            "domains": ["helper-fixture.test"],
            "staging_dir": "${STAGE}",
            "completion_artifact": "fullchain_file",
            "artifacts": {
              "fullchain_file": {"staging": "${STAGE}/fullchain.cer", "destination": "${DESTDIR}/fullchain.cer", "uid": 0, "gid": 0, "mode": "0644"},
              "key_file": {"staging": "${STAGE}/cert.key", "destination": "${DESTDIR}/cert.key", "uid": 0, "gid": 0, "mode": "0600"}
            }
          }
          EOF
          chmod 0600 "${MANIFEST}"

          # initial deployment publishes with the configured metadata
          "${PY}" "${HELPER}" "${MANIFEST}"
          test "$(stat -c '%a %U %G' "${DESTDIR}/fullchain.cer")" = '644 root root'
          test "$(stat -c '%a %U %G' "${DESTDIR}/cert.key")" = '600 root root'
          cmp -s "${FIX}/certA.pem" "${DESTDIR}/fullchain.cer"
          cmp -s "${FIX}/keyA.pem" "${DESTDIR}/cert.key"

          # in sync now
          "${PY}" "${HELPER}" --check "${MANIFEST}"

          # metadata-only drift: reported (rc 3), then fixed without replacing the inode
          __inode_before="$(stat -c '%i' "${DESTDIR}/fullchain.cer")"
          chmod 0600 "${DESTDIR}/fullchain.cer"
          "${PY}" "${HELPER}" --check "${MANIFEST}" && exit 1 || test "$?" = '3'
          "${PY}" "${HELPER}" "${MANIFEST}"
          test "$(stat -c '%a' "${DESTDIR}/fullchain.cer")" = '644'
          test "$(stat -c '%i' "${DESTDIR}/fullchain.cer")" = "${__inode_before}"
          printf 'helper-basic: PASS\n'
        executable: "/bin/bash"
      changed_when:
        - false


    - name: "Molecule | Verify | Helper: staged content attacks are rejected and preserve the previous deployment"
      # The command or shell module is used intentionally: this exercises the
      # helper binary end-to-end with crafted attack inputs.
      ansible.builtin.shell:
        cmd: |
          set -u # no uninitialized vars
          FIX='/root/acmesh-helper-fixtures'
          STAGE={{ (run_acmesh_cfg_cert_deploy_base_dir ~ '/helper-fixture') | ansible.builtin.quote }}
          DESTDIR='/var/tmp/acmesh-helper-dest'
          MANIFEST='/etc/acmesh-deploy.d/helper-fixture.json'
          PY={{ __run_acmesh_deploy_python_exec_path | ansible.builtin.quote }}
          HELPER={{ __run_acmesh_deploy_helper_path | ansible.builtin.quote }}

          run_expect_fail() {
            "${PY}" "${HELPER}" "${MANIFEST}" >/dev/null 2>&1
            __rc=$?
            if [ "${__rc}" -eq 0 ]; then
              printf 'FAIL: %s was accepted\n' "${1}" 1>&2
              exit 1
            fi
            if ! cmp -s "${FIX}/certA.pem" "${DESTDIR}/fullchain.cer" \
              || ! cmp -s "${FIX}/keyA.pem" "${DESTDIR}/cert.key"; then
              printf 'FAIL: %s modified the previous deployment\n' "${1}" 1>&2
              exit 1
            fi
            printf 'ok: %s rejected (rc=%s)\n' "${1}" "${__rc}"
          }

          cp "${FIX}/keyB.pem" "${STAGE}/cert.key"
          run_expect_fail 'key/certificate mismatch'
          cp "${FIX}/keyA.pem" "${STAGE}/cert.key"

          printf 'garbage' > "${STAGE}/fullchain.cer"
          run_expect_fail 'malformed certificate'
          cp "${FIX}/certA.pem" "${STAGE}/fullchain.cer"

          cp "${FIX}/cert_wrongdomain.pem" "${STAGE}/fullchain.cer"
          run_expect_fail 'unexpected certificate domains'
          cp "${FIX}/certA.pem" "${STAGE}/fullchain.cer"

          dd if=/dev/zero of="${STAGE}/fullchain.cer" bs=1024 count=2048 2>/dev/null
          run_expect_fail 'oversized source file'
          cp "${FIX}/certA.pem" "${STAGE}/fullchain.cer"

          rm -f "${STAGE}/cert.key" && ln -s /etc/hostname "${STAGE}/cert.key"
          run_expect_fail 'staging symlink'
          rm -f "${STAGE}/cert.key" && cp "${FIX}/keyA.pem" "${STAGE}/cert.key"

          rm -f "${STAGE}/cert.key" && mkfifo "${STAGE}/cert.key"
          run_expect_fail 'non-regular staging file'
          rm -f "${STAGE}/cert.key" && cp "${FIX}/keyA.pem" "${STAGE}/cert.key"

          "${PY}" "${HELPER}" --check "${MANIFEST}" || exit 1
          printf 'helper-content-attacks: PASS\n'
        executable: "/bin/bash"
      changed_when:
        - false


    - name: "Molecule | Verify | Helper: malformed and untrusted manifests are rejected"
      # The command or shell module is used intentionally: this exercises the
      # helper binary end-to-end with crafted attack inputs.
      ansible.builtin.shell:
        cmd: |
          set -u # no uninitialized vars
          STAGE={{ (run_acmesh_cfg_cert_deploy_base_dir ~ '/helper-fixture') | ansible.builtin.quote }}
          DESTDIR='/var/tmp/acmesh-helper-dest'
          MANIFEST='/etc/acmesh-deploy.d/helper-fixture.json'
          BADMANIFEST='/etc/acmesh-deploy.d/helper-bad.json'
          PY={{ __run_acmesh_deploy_python_exec_path | ansible.builtin.quote }}
          HELPER={{ __run_acmesh_deploy_helper_path | ansible.builtin.quote }}

          expect_reject() {
            "${PY}" "${HELPER}" --check "${2}" >/dev/null 2>&1
            __rc=$?
            if [ "${__rc}" -eq 0 ] || [ "${__rc}" -eq 3 ]; then
              printf 'FAIL: %s was accepted\n' "${1}" 1>&2
              exit 1
            fi
            printf 'ok: %s rejected (rc=%s)\n' "${1}" "${__rc}"
          }

          write_bad() {
            # ${1}: artifacts JSON fragment; ${2}: optional extra top-level JSON
            cat > "${BADMANIFEST}" <<EOF
          {
            "version": 1,${2:-}
            "certificate_id": "helper-fixture",
            "domains": ["helper-fixture.test"],
            "staging_dir": "${STAGE}",
            "completion_artifact": "fullchain_file",
            "artifacts": {${1}}
          }
          EOF
            chmod 0600 "${BADMANIFEST}"
            chown root:root "${BADMANIFEST}"
          }

          __fullchain_ok="\"fullchain_file\": {\"staging\": \"${STAGE}/fullchain.cer\",
            \"destination\": \"${DESTDIR}/fullchain.cer\", \"uid\": 0, \"gid\": 0, \"mode\": \"0644\"}"

          write_bad "\"fullchain_file\": {\"staging\": \"${STAGE}/fullchain.cer\",
            \"destination\": \"${DESTDIR}/same.cer\", \"uid\": 0, \"gid\": 0, \"mode\": \"0644\"},
            \"key_file\": {\"staging\": \"${STAGE}/cert.key\",
            \"destination\": \"${DESTDIR}/same.cer\", \"uid\": 0, \"gid\": 0, \"mode\": \"0600\"}"
          expect_reject 'duplicate destinations' "${BADMANIFEST}"

          write_bad "${__fullchain_ok}" ' "unexpected": true,'
          expect_reject 'unknown manifest key' "${BADMANIFEST}"

          write_bad "\"fullchain_file\": {\"staging\": \"${STAGE}/fullchain.cer\",
            \"destination\": \"relative/fullchain.cer\", \"uid\": 0, \"gid\": 0, \"mode\": \"0644\"}"
          expect_reject 'relative destination path' "${BADMANIFEST}"

          write_bad "\"fullchain_file\": {\"staging\": \"${STAGE}/../traversal/fullchain.cer\",
            \"destination\": \"${DESTDIR}/fullchain.cer\", \"uid\": 0, \"gid\": 0, \"mode\": \"0644\"}"
          expect_reject 'staging path traversal' "${BADMANIFEST}"

          cp "${MANIFEST}" '/var/tmp/acmesh-helper-outside.json'
          expect_reject 'manifest outside the manifest directory' '/var/tmp/acmesh-helper-outside.json'
          rm -f '/var/tmp/acmesh-helper-outside.json'

          cp "${MANIFEST}" "${BADMANIFEST}"
          chmod 0600 "${BADMANIFEST}"
          chown {{ run_acmesh_user | ansible.builtin.quote }} "${BADMANIFEST}"
          expect_reject 'non-root-owned manifest' "${BADMANIFEST}"
          rm -f "${BADMANIFEST}"
          printf 'helper-manifest-attacks: PASS\n'
        executable: "/bin/bash"
      changed_when:
        - false


    - name: "Molecule | Verify | Helper: concurrent invocations serialize on the lock, publish failures roll back"
      # The command or shell module is used intentionally: this exercises the
      # helper binary end-to-end, including an injected rename failure via a
      # Python import (no production code paths are patched on disk).
      ansible.builtin.shell:
        cmd: |
          set -u              # no uninitialized vars
          set -e -o pipefail  # exit on (pipeline) errors
          FIX='/root/acmesh-helper-fixtures'
          STAGE={{ (run_acmesh_cfg_cert_deploy_base_dir ~ '/helper-fixture') | ansible.builtin.quote }}
          DESTDIR='/var/tmp/acmesh-helper-dest'
          MANIFEST='/etc/acmesh-deploy.d/helper-fixture.json'
          PY={{ __run_acmesh_deploy_python_exec_path | ansible.builtin.quote }}
          HELPER={{ __run_acmesh_deploy_helper_path | ansible.builtin.quote }}

          # concurrency: a held manifest lock delays the helper instead of
          # letting two deployments race
          flock "${MANIFEST}" -c 'sleep 3' &
          __lock_pid=$!
          sleep 0.5
          "${PY}" "${HELPER}" --check "${MANIFEST}"
          wait "${__lock_pid}"

          # rollback: both artifacts get new content, the completion
          # artifact's final rename is made to fail; the already published
          # key must be restored to the previous deployment
          openssl ecparam -name prime256v1 -genkey -noout -out "${FIX}/keyC.pem"
          openssl req -x509 -new -key "${FIX}/keyC.pem" -days 2 -subj '/CN=helper-fixture.test' \
            -addext 'subjectAltName=DNS:helper-fixture.test' -out "${FIX}/certC.pem"
          cp "${FIX}/keyC.pem" "${STAGE}/cert.key"
          cp "${FIX}/certC.pem" "${STAGE}/fullchain.cer"

          "${PY}" - "${MANIFEST}" "${HELPER}" <<'PYEOF'
          import importlib.util
          import os
          import sys
          from importlib.machinery import SourceFileLoader

          # SourceFileLoader: the installed helper has no .py suffix, so
          # spec_from_file_location cannot infer a loader on its own.
          manifest, helper = sys.argv[1], sys.argv[2]
          loader = SourceFileLoader("acmesh_deploy", helper)
          spec = importlib.util.spec_from_loader("acmesh_deploy", loader)
          module = importlib.util.module_from_spec(spec)
          loader.exec_module(module)
          real_rename = os.rename

          def failing_rename(src, dst, **kwargs):
              if dst == "fullchain.cer":
                  raise OSError(5, "injected publish failure")
              return real_rename(src, dst, **kwargs)

          os.rename = failing_rename
          return_code = module.main([manifest])
          os.rename = real_rename
          sys.exit(0 if return_code != 0 else 1)
          PYEOF

          cmp -s "${FIX}/keyA.pem" "${DESTDIR}/cert.key"
          cmp -s "${FIX}/certA.pem" "${DESTDIR}/fullchain.cer"

          # without the injected failure the same deployment succeeds
          "${PY}" "${HELPER}" "${MANIFEST}"
          cmp -s "${FIX}/keyC.pem" "${DESTDIR}/cert.key"
          cmp -s "${FIX}/certC.pem" "${DESTDIR}/fullchain.cer"
          printf 'helper-rollback: PASS\n'
        executable: "/bin/bash"
      changed_when:
        - false


    - name: "Molecule | Verify | Helper: remove the fixtures"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "absent"
      loop:
        - "/root/acmesh-helper-fixtures"
        - "{{ run_acmesh_cfg_cert_deploy_base_dir }}/helper-fixture"
        - "/var/tmp/acmesh-helper-dest"
        - "/etc/acmesh-deploy.d/helper-fixture.json"


## Declarative certificate removal
#
# The run_acmesh_certs_delete_unmanaged sweep reaps certificate data and reload
# units of unlisted certificates, and a per-certificate state "absent" removes
# everything belonging to that certificate (including the installed files).

- name: "Molecule | Verify | Unmanaged certificate data removal (delete_unmanaged sweep)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Plant stray certificate data directory"
      ansible.builtin.file:
        path: "{{ run_acmesh_cfg_cert_home }}/stray-reap.test_ecc"
        state: "directory"
        owner: "{{ run_acmesh_user }}"
        group: "{{ run_acmesh_group }}"
        mode: "u=rwx,g=rx,o="


    - name: "Molecule | Verify | Plant stray certificate config file"
      ansible.builtin.copy:
        dest: "{{ run_acmesh_cfg_cert_home }}/stray-reap.test_ecc/stray-reap.test.conf"
        content: |
          Le_Domain='stray-reap.test'
        owner: "{{ run_acmesh_user }}"
        group: "{{ run_acmesh_group }}"
        mode: "u=rw,g=r,o="


    - name: "Molecule | Verify | Plant stray reload path unit file"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/acmesh-reload-stray-reap.test.path"
        content: |
          [Unit]
          Description=stray reload unit for reap testing

          [Path]
          PathChanged=/var/tmp/nonexistent-stray-reap-watch

          [Install]
          WantedBy=multi-user.target
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r" # 0644


    - name: "Molecule | Verify | Plant stray reload service unit file"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/acmesh-reload-stray-reap.test.service"
        content: |
          [Unit]
          Description=stray reload unit for reap testing

          [Service]
          Type=oneshot
          ExecStart=/bin/true
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r" # 0644


    - name: "Molecule | Verify | Plant stray deploy path unit file"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/acmesh-deploy-stray-reap.test.path"
        content: |
          [Unit]
          Description=stray deploy unit for reap testing

          [Path]
          PathChanged=/var/tmp/nonexistent-stray-deploy-watch

          [Install]
          WantedBy=multi-user.target
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r" # 0644


    - name: "Molecule | Verify | Plant stray deploy service unit file"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/acmesh-deploy-stray-reap.test.service"
        content: |
          [Unit]
          Description=stray deploy unit for reap testing

          [Service]
          Type=oneshot
          ExecStart=/bin/true
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r" # 0644


    - name: "Molecule | Verify | Plant stray deployment manifest and staging directory"
      ansible.builtin.file:
        path: "{{ run_acmesh_cfg_cert_deploy_base_dir }}/stray-reap.test"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "u=rwx,g=rx,o=" # 0750


    - name: "Molecule | Verify | Plant stray deployment manifest"
      ansible.builtin.copy:
        dest: "/etc/acmesh-deploy.d/stray-reap.test.json"
        content: "{}\n"
        owner: "root"
        group: "root"
        mode: "u=rw,g=,o=" # 0600


    - name: "Molecule | Verify | Include the foundata.acmesh.run role (with run_acmesh_certs_delete_unmanaged)"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_certs_delete_unmanaged: true


    - name: "Molecule | Verify | Gather stats for stray and managed resources after the sweep"
      ansible.builtin.stat:
        path: "{{ item['path'] }}"
        get_checksum: false
        get_mime: false
      loop:
        - path: "{{ run_acmesh_cfg_cert_home }}/stray-reap.test_ecc"
          expect: false
        - path: "/etc/systemd/system/acmesh-reload-stray-reap.test.path"
          expect: false
        - path: "/etc/systemd/system/acmesh-reload-stray-reap.test.service"
          expect: false
        - path: "/etc/systemd/system/acmesh-deploy-stray-reap.test.path"
          expect: false
        - path: "/etc/systemd/system/acmesh-deploy-stray-reap.test.service"
          expect: false
        - path: "/etc/acmesh-deploy.d/stray-reap.test.json"
          expect: false
        - path: "{{ run_acmesh_cfg_cert_deploy_base_dir }}/stray-reap.test"
          expect: false
        - path: "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test_ecc"
          expect: true
        - path: "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.path"
          expect: true
        - path: "/etc/systemd/system/acmesh-deploy-acmesh-webroot.test.path"
          expect: true
        - path: "/etc/acmesh-deploy.d/acmesh-webroot.test.json"
