# Raw execution creates no module payload of its own while inspecting cleanup.
#
# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later

---
- name: "Credentials | Verify module payload cleanup"
  hosts: "molecule"
  gather_facts: false
  become: true
  tasks:
    - name: "Credentials | Assert the private module directory is empty and remove it"
      ansible.builtin.raw: |
        set -eu
        target={{ transport_remote_tmp | ansible.builtin.quote }}
        if test -d "$target"; then
          test "$(stat -c %a "$target")" = 700
          test -z "$(find "$target" -mindepth 1 -maxdepth 1 -print)"
          rmdir "$target"
        fi
      changed_when:
        - false
