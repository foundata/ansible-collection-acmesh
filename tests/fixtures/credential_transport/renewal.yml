---
- name: "Credentials | Verify unattended renewal"
  hosts: "molecule"
  gather_facts: true
  become: true
  tasks:
    - name: "Credentials | Initialize role variables"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "init"
        public: true

    - name: "Credentials | Read certificate serial before renewal"
      ansible.builtin.command:
        argv:
          - "openssl"
          - "x509"
          - "-in"
          - "{{ run_acmesh_cfg_cert_home }}/{{ transport_domain }}_ecc/{{ transport_domain }}.cer"
          - "-noout"
          - "-serial"
      changed_when:
        - false
      register: __testing_serial_before

    - name: "Credentials | Make the synthetic certificate due for renewal"
      ansible.builtin.lineinfile:
        path: "{{ run_acmesh_cfg_cert_home }}/{{ transport_domain }}_ecc/{{ transport_domain }}.conf"
        regexp: "^Le_NextRenewTime="
        line: "Le_NextRenewTime='1'"
        mode: "u=rw,g=,o=" # 0600

    - name: "Credentials | Disable Pebble's incompatible replacement tracking"
      ansible.builtin.lineinfile:
        path: "{{ run_acmesh_cfg_config_home }}/account.conf"
        regexp: "^NO_ARI="
        line: "NO_ARI='1'"
        mode: "u=rw,g=,o=" # 0600
      no_log: true

    - name: "Credentials | Run the installed renewal service"
      ansible.builtin.systemd_service:
        name: "acmesh-renewal.service"
        state: "started"

    - name: "Credentials | Read certificate serial after renewal"
      ansible.builtin.command:
        argv:
          - "openssl"
          - "x509"
          - "-in"
          - "{{ run_acmesh_cfg_cert_home }}/{{ transport_domain }}_ecc/{{ transport_domain }}.cer"
          - "-noout"
          - "-serial"
      changed_when:
        - false
      register: __testing_serial_after

    - name: "Credentials | Assert renewal used saved provider credentials"
      ansible.builtin.assert:
        that:
          - __testing_serial_before['stdout'] != __testing_serial_after['stdout']
        quiet: true

    - name: "Credentials | Check saved credential metadata after renewal"
      ansible.builtin.stat:
        path: "{{ run_acmesh_cfg_config_home }}/account.conf"
      register: __testing_credential_stat

    - name: "Credentials | Assert renewal preserved credential ownership and permissions"
      ansible.builtin.assert:
        that:
          - __testing_credential_stat['stat']['pw_name'] == run_acmesh_user
          - __testing_credential_stat['stat']['mode'] == '0600'
        quiet: true

    - name: "Credentials | Remove this case's certificate"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "cert/default"
      vars:
        run_acmesh_certs:
          - domains:
              - name: "{{ transport_domain }}"
            state: "absent"

- name: "Credentials | Check cleanup after renewal"
  ansible.builtin.import_playbook: "cleanup.yml"
