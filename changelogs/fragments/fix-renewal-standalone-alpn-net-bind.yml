---

bugfixes:
  - >
    ``run`` role - Automatic renewal of certificates issued with the
    ``standalone`` (HTTP-01) or ``alpn`` (TLS-ALPN-01) challenge failed because
    ``acmesh-renewal.service`` runs unprivileged (as ``run_acmesh_user``) and
    acme.sh could not bind the privileged port (80 or 443) it opens for those
    challenges. The renewal service now gets
    ``AmbientCapabilities=CAP_NET_BIND_SERVICE`` when, and only when, a configured
    certificate uses ``standalone`` or ``alpn`` on a privileged port (below 1024).
    Certificates using ``dns``, ``dns_persist`` or ``webroot`` (or ``standalone``
    / ``alpn`` pinned to a high port) get a renewal service without any extra
    capability. Thanks to @Menchen13 for reporting this and presenting a proposed
    solution.
