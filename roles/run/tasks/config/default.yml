# Configuration: Manage settings, like adapting or creating config files.

---

- name: "Config | Default | Configure acme.sh"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to interact with the
  #   used command.
  # - Inline templating allows for safe and efficient parameter handling,
  #   avoiding the need for multiple additional tasks with little to no benefit.
  #
  # Notes on the command or script itself:
  #
  # acme.sh can update, modify, or correct configuration values during
  # execution of most subcommands. Therefore, we simply call the --info command,
  # which itself does not perform any certificate-related actions but allows
  # us to update the configuration. See the official documentation for a
  # explanation of the parameters:
  # https://github.com/acmesh-official/acme.sh/wiki/Options-and-Params
  ansible.builtin.shell:
    cmd: |
      set -u # Fail on unset vars
      set -o pipefail # Fail if any pipe cmd fails

      __run_acmesh_checksum_before=$({{ __run_acmesh_sha1sum_exec_path }} {{ (run_acmesh_cfg_config_home ~ '/account.conf') | ansible.builtin.quote }})

      if ! {{ __run_acmesh_setpriv_run_as_user }} -- ./acme.sh \
            --info \
            --home {{ run_acmesh_cfg_home | ansible.builtin.quote }} \
            --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }} \
            --certhome {{ run_acmesh_cfg_cert_home | ansible.builtin.quote }} \
            --log {{ run_acmesh_cfg_logfile | ansible.builtin.quote }} \
            --log-level {{ run_acmesh_cfg_log_level | ansible.builtin.quote }} \
            --syslog {{ run_acmesh_cfg_syslog | ansible.builtin.quote }} \
            {{ '--auto-upgrade 1'
              if ((run_acmesh_autoupgrade is ansible.builtin.defined) and
                  (run_acmesh_autoupgrade))
              else
              '--auto-upgrade 0' }} \
            {{ '--accountemail ' ~ (run_acmesh_cfg_accountemail | ansible.builtin.quote)
              if ((run_acmesh_cfg_accountemail is ansible.builtin.defined) and
                  (run_acmesh_cfg_accountemail))
              else
              '' }}
      then
        exit 1
      fi

      __run_acmesh_checksum_after=$({{ __run_acmesh_sha1sum_exec_path }} {{ (run_acmesh_cfg_config_home ~ '/account.conf') | ansible.builtin.quote }})
      if [ "${__run_acmesh_checksum_before}" != "${__run_acmesh_checksum_after}" ]
      then
        printf 'Changed config file: %s' {{ (run_acmesh_cfg_config_home ~ '/account.conf') | ansible.builtin.quote }}
      fi

      exit 0
    executable: "/bin/bash" # Support for other shells untested (so far)
  args:
    chdir: "{{ run_acmesh_cfg_home }}"
  # Mirror the environment of the renewal service unit (which sets HOME= the
  # same way); acme.sh runs as the service user, see vars/main.yml on the
  # setpriv prefix.
  environment:
    HOME: "{{ run_acmesh_cfg_home }}"
  changed_when:
    - __run_acmesh_config_result is ansible.builtin.success
    - ('Changed config file') in __run_acmesh_config_result['stdout']
  register: __run_acmesh_config_result


- name: "Config | Default | Create systemd unit file (acmesh-renewal.service)"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_systemd_renewal_servicefile_path }}"
    content: |
      [Unit]
      Description=acme.sh - renew certificates
      After=network-online.target

      [Service]
      Type=oneshot
      User={{ run_acmesh_user }}
      Group={{ run_acmesh_group }}
      {% if __run_acmesh_renewal_needs_net_bind | ansible.builtin.bool %}
      # A configured certificate uses the "standalone" (HTTP-01, privileged port)
      # or "alpn" (TLS-ALPN-01, port 443) challenge. acme.sh binds that port
      # itself during renewal and this service runs unprivileged (User=), so it
      # needs the capability to bind a port below 1024.
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      {% endif %}
      Environment="HOME={{ run_acmesh_cfg_home }}"
      WorkingDirectory={{ run_acmesh_cfg_home }}
      ExecStart="{{ run_acmesh_cfg_home }}"/acme.sh --cron --home "{{ run_acmesh_cfg_home }}" --config-home "{{ run_acmesh_cfg_config_home }}"
      SuccessExitStatus=0 2
      StandardError=journal
      SyslogIdentifier=acme.sh
    force: true
    owner: "{{ __run_acmesh_systemd_renewal_servicefile_owner }}"
    group: "{{ __run_acmesh_systemd_renewal_servicefile_group }}"
    mode: "{{ __run_acmesh_systemd_renewal_servicefile_mode }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Config | Default | Create systemd unit file (acmesh-renewal.timer)"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_systemd_renewal_timerfile_path }}"
    content: |
      [Unit]
      Description=acme.sh - daily certificate renewal

      [Timer]
      OnCalendar=daily
      RandomizedDelaySec=3h
      Persistent=true

      [Install]
      WantedBy=timers.target
    force: true
    owner: "{{ __run_acmesh_systemd_renewal_timerfile_owner }}"
    group: "{{ __run_acmesh_systemd_renewal_timerfile_group }}"
    mode: "{{ __run_acmesh_systemd_renewal_timerfile_mode }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


# debugging: systemctl list-timers --all; systemd-analyze verify acmesh-renewal.timer
- name: "Config | Default | Manage (enable or disabled) acmesh-renewal.timer"
  ansible.builtin.systemd_service:
    name: "acmesh-renewal.timer"
    enabled: "{{ run_acmesh_autorenewal }}"
    state: "{{ 'started' if (run_acmesh_autorenewal | ansible.builtin.bool) else 'stopped' }}"
    daemon_reload: true


# Reload handling: the configured "reloadcmd" of each certificate is not passed
# to acme.sh (which would execute it as the unprivileged service user during
# renewal). Instead, a root-side path unit watches the installed certificate
# files and starts a service unit of the same name, which runs the reload
# command as root. This behaves identically for initial issuance, automated
# renewal and manual acme.sh runs. See __run_acmesh_reload_units in
# vars/main.yml for the entry layout and the choice of the watched file.
#
# Units of certificates that are no longer listed in run_acmesh_certs are kept
# on purpose: acme.sh continues to renew and reinstall already issued
# certificates until they are actively removed, so their services still need
# reloading. All acmesh-reload-* resources get removed on
# run_acmesh_state: "absent".
- name: "Config | Default | Create systemd unit file(s) (acmesh-reload-*.service)"
  ansible.builtin.copy:
    # The reload command runs via a shell (it may contain multiple commands)
    # and is inlined into ExecStart=. The replace chain escapes systemd's
    # unit-file syntax so the shell receives the configured command
    # byte-identical: backslashes and double quotes (C-style unquoting of the
    # double-quoted word), "%" (specifier expansion, "%%" yields a literal
    # "%") and "$" (variable expansion, "$$" yields a literal "$").
    dest: "{{ __run_acmesh_reload_unitfile_dir }}/{{ __run_acmesh_reload_unit_prefix }}{{ item['name'] }}.service"
    content: |
      [Unit]
      Description=acme.sh - run reload command after certificate change ({{ item['domain'] }})

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c "{{ item['reloadcmd']
        | ansible.builtin.trim
        | ansible.builtin.replace(__run_acmesh_backslash, __run_acmesh_backslash ~ __run_acmesh_backslash)
        | ansible.builtin.replace('"', __run_acmesh_backslash ~ '"')
        | ansible.builtin.replace('%', '%%')
        | ansible.builtin.replace('$', '$$') }}"
      StandardError=journal
      SyslogIdentifier=acmesh-reload
    force: true
    owner: "{{ __run_acmesh_reload_unitfile_owner }}"
    group: "{{ __run_acmesh_reload_unitfile_group }}"
    mode: "{{ __run_acmesh_reload_unitfile_mode }}"
  vars:
    # A literal backslash cannot be written as a Jinja string literal (the
    # lexer keeps escape pairs raw), so it is provided here via YAML
    # double-quoted escaping instead.
    __run_acmesh_backslash: "\\"
  loop: "{{ __run_acmesh_reload_units }}"
  loop_control:
    label: "{{ item['name'] }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Config | Default | Create systemd unit file(s) (acmesh-reload-*.path)"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_reload_unitfile_dir }}/{{ __run_acmesh_reload_unit_prefix }}{{ item['name'] }}.path"
    content: |
      [Unit]
      Description=acme.sh - watch installed certificate files ({{ item['domain'] }})

      [Path]
      # PathChanged= triggers when the watched file gets closed after writing,
      # not on every write and not on permission or ownership changes.
      PathChanged={{ item['watch_path'] }}
      Unit={{ __run_acmesh_reload_unit_prefix }}{{ item['name'] }}.service

      [Install]
      WantedBy=multi-user.target
    force: true
    owner: "{{ __run_acmesh_reload_unitfile_owner }}"
    group: "{{ __run_acmesh_reload_unitfile_group }}"
    mode: "{{ __run_acmesh_reload_unitfile_mode }}"
  loop: "{{ __run_acmesh_reload_units }}"
  loop_control:
    label: "{{ item['name'] }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Config | Default | Manage (enable and start) acmesh-reload-*.path unit(s)"
  ansible.builtin.systemd_service:
    name: "{{ __run_acmesh_reload_unit_prefix }}{{ item['name'] }}.path"
    enabled: true
    state: "started"
    daemon_reload: true
  loop: "{{ __run_acmesh_reload_units }}"
  loop_control:
    label: "{{ item['name'] }}"
