---
- name: "Credentials | Verify failure guidance"
  hosts: "molecule"
  gather_facts: false
  become: true
  tasks:
    - name: "Credentials | Initialize role variables"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "init"
        public: true

    - name: "Credentials | Fail configuration before starting acme.sh"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "config/default"
      vars:
        run_acmesh_cfg_home: "/var/tmp/nonexistent-{{ transport_domain }}"
        run_acmesh_cfg_logfile: "/var/log/acme diagnostics.log"
      when:
        - transport_failure == 'configuration'

    - name: "Credentials | Fail issuance with invalid credential handoff"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
        tasks_from: "cert/default"
      vars:
        run_acmesh_certs:
          - domains:
              - name: "{{ transport_domain }}"
                challenge:
                  type: "dns"
                  dns_provider: "dns_transport"
            environment:
              "INVALID=NAME": "{{ transport_secrets['token'] }}"
      when:
        - transport_failure == 'issuance'
      no_log: true

    - name: "Credentials | Check installation failure and restore renewal paths"
      when:
        - transport_failure == 'installation'
      block:
        - name: "Credentials | Fail installation below an inaccessible parent"
          ansible.builtin.include_role:
            name: "foundata.acmesh.run"
            tasks_from: "cert/default"
          vars:
            run_acmesh_certs:
              - domains:
                  - name: "{{ transport_domain }}"
                    challenge:
                      type: "dns"
                      dns_provider: "dns_transport"
                server: "https://localhost:14000/dir"
                environment:
                  TRANSPORT_TOKEN: "{{ transport_secrets['token'] }}"
                install:
                  strategy: "direct"
                  key_file: "/root/acmesh-{{ transport_domain }}/cert.key"
          no_log: true
      always:
        - name: "Credentials | Restore the original installation paths"
          ansible.builtin.include_role:
            name: "foundata.acmesh.run"
            tasks_from: "cert/default"
          vars:
            run_acmesh_certs:
              - domains:
                  - name: "{{ transport_domain }}"
                    challenge:
                      type: "dns"
                      dns_provider: "dns_transport"
                server: "https://localhost:14000/dir"
                install:
                  fullchain_file: "/etc/pki/tls/certs/{{ transport_domain }}/fullchain.cer"
                  key_file: "/etc/pki/tls/certs/{{ transport_domain }}/cert.key"

        - name: "Credentials | Remove the installation failure fixture"
          ansible.builtin.file:
            path: "/root/acmesh-{{ transport_domain }}"
            state: "absent"
