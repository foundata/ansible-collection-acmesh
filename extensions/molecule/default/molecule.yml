# Configuration for the Ansible Molecule "default" scenario.
#
# See the official documentation for details on this file and all settings:
# https://docs.ansible.com/projects/molecule/configuration/
#
# Each platform selects its backend via the "type" key: "podman" (container,
# the default when omitted) or "libvirt" (QEMU/KVM virtual machine). Use VM
# platforms for tests containers cannot cover (kernel settings, nested
# virtualization, Podman insid  e the test target, ...). Mixed scenarios are
# possible. See extensions/molecule/README.md for requirements and usage
# details.

---

driver:
  name: "default"
  options:
    managed: true
    # Resolved per instance from the instance config written by the create
    # playbooks, so "molecule login" works for containers and VMs alike.
    login_cmd_template: "{login_cmd}"


# Target platforms for testing
platforms:
  # Platform keys by backend type:
  #
  # type: "podman" (default when omitted)
  #   image (required):          OCI image reference
  #   systemd (optional):        run a systemd entrypoint, usually true
  #
  # type: "libvirt" - QEMU/KVM virtual machines from vendor cloud images via a
  # session libvirt daemon (no root privileges needed):
  #   image (required):          URL of a cloud image (qcow2, cloud-init
  #                              inside) or an absolute local path to one
  #   ssh_port (required):       unique local port for the SSH port forward
  #   image_checksum (optional): e.g. "sha512:...", off by default (trust in
  #                              vendor and TLS, like the ":latest" ITT images)
  #   memory (optional):         RAM in MiB, default 2048
  #   vcpus (optional):          default 2
  #   disk_size (optional):      virtual disk size, default "10G"
  #   extra_disks (optional):    additional blank disks (e.g. for testing
  #                              storage management): list of mappings with
  #                              "serial" (required, becomes
  #                              /dev/disk/by-id/virtio-<serial>) and "size"
  #                              (default "4G")

  # Debian 13 (Trixie)
  - name: "molecule-debian13"
    type: "podman"
    image: "quay.io/foundata/debian13-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # Debian 12 (Bookworm)
  - name: "molecule-debian12"
    type: "podman"
    image: "quay.io/foundata/debian12-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # Ubuntu 26.04 LTS (Resolute Raccoon)
  - name: "molecule-ubuntu2604"
    type: "podman"
    image: "quay.io/foundata/ubuntu2604-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # Ubuntu 24.04 LTS (Noble Numbat)
  - name: "molecule-ubuntu2404"
    type: "podman"
    image: "quay.io/foundata/ubuntu2404-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # Ubuntu 22.04 LTS (Jammy Jellyfish)
  - name: "molecule-ubuntu2204"
    type: "podman"
    image: "quay.io/foundata/ubuntu2204-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # AlmaLinux 10 (best effort RHEL 10 (Red Hat Enterprise Linux))
  - name: "molecule-almalinux10"
    type: "podman"
    image: "quay.io/foundata/almalinux10-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # AlmaLinux 9 (best effort RHEL 9 (Red Hat Enterprise Linux))
  - name: "molecule-almalinux9"
    type: "podman"
    image: "quay.io/foundata/almalinux9-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # CentOS Stream 10
  - name: "molecule-centosstream10"
    type: "podman"
    image: "quay.io/foundata/centosstream10-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # CentOS Stream 9
  - name: "molecule-centosstream9"
    type: "podman"
    image: "quay.io/foundata/centosstream9-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # Fedora 44
  - name: "molecule-fedora44"
    image: "quay.io/foundata/fedora44-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # Fedora 43
  - name: "molecule-fedora43"
    type: "podman"
    image: "quay.io/foundata/fedora43-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # openSUSE Leap 16.0
  - name: "molecule-opensuseleap160"
    type: "podman"
    image: "quay.io/foundata/opensuseleap160-itt:latest" # Integration Test Target (ITT) with systemd
    systemd: true

  # openSUSE Leap 15.6
  # Currently not supported by us and therefore not tested.


# Ansible dependencies (collections, roles) of this Molecule scenario
dependency:
  name: "galaxy"
  enabled: true
  options:
    requirements-file: "${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml"
    ignore-certs: false
    ignore-errors: false


# Configuration parameters for Ansible to provision test infrastructure and
# enable Molecule to execute test scenarios against the provisioned environment.
# See the following for more information:
# https://docs.ansible.com/projects/molecule/configuration/#provisioner
# https://docs.ansible.com/projects/molecule/configuration/#molecule.interpolation.Interpolator.interpolate
provisioner:
  name: "ansible"
  inventory:
    links:
      hosts: "inventory/hosts.yml"
  config_options:
    defaults:
      # If roles are not found by Molecule, try to run molecule with an adjusted
      # MOLECULE_GLOB environment variable instead of setting roles_path and/or
      # collections_path. See molecule/README.md#faq-role-path-detection for details.
      verbosity: ${ANSIBLE_VERBOSITY:-0} # noqa
      display_args_to_stdout: ${ANSIBLE_DISPLAY_ARGS_TO_STDOUT:-false} # noqa
      # set forks >= number of test platforms for better performance
      forks: ${ANSIBLE_FORKS:-12} # noqa
      host_key_checking: false
      retry_files_enabled: false
    connection:
      pipelining: true
  playbooks:
    create: "../shared/playbooks/create-dispatch.yml"
    prepare: "../shared/playbooks/prepare.yml"
    converge: "../shared/playbooks/converge.yml"
    side_effect: "../shared/playbooks/side_effect.yml"
    verify: "../shared/playbooks/verify.yml"
    cleanup: "../shared/playbooks/cleanup.yml"
    destroy: "../shared/playbooks/destroy-dispatch.yml"


verifier:
  name: "ansible"
  enabled: true
