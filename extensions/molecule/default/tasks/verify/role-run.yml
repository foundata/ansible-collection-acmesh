# Check collection role "run" outcomes.

- name: "Molecule | Verify | Initialize the foundata.acmesh.run role (without actually running it; get and expose variables)"
  ansible.builtin.include_role:
    name: "foundata.acmesh.run"
    tasks_from: "init"
    public: true


## Preparation

- name: "Molecule | Verify | Set run_acmesh_* and __testing_* variables as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^(run_acmesh_|__testing_)')
      | ansible.builtin.list
    }}
  loop_control:
    # Label with the variable name only: the values include the DNS API
    # credentials (run_acmesh_environment, per-certificate environment).
    label: "{{ item['key'] }}"


## Check mode on the installed system
#
# A --check run against a host with acme.sh installed must succeed AND still
# walk the configuration and certificate phases (regression: the skipped
# version detection made the role conclude acme.sh was unavailable, so check
# mode silently reconciled nothing and reported no drift).

- name: "Molecule | Verify | Run the role in check mode on the installed system"
  ansible.builtin.include_role:
    name: "foundata.acmesh.run"
    apply:
      check_mode: true


- name: "Molecule | Verify | Check mode: assert the installation was detected and the phases stayed enabled"
  ansible.builtin.assert:
    that:
      - __run_acmesh_is_installed | ansible.builtin.bool
      - __run_acmesh_install_available | ansible.builtin.bool
    fail_msg: >-
      The check-mode run did not detect the installed acme.sh (or skipped the
      configuration and certificate phases): check mode would report no drift
      at all.
    success_msg: >-
      The check-mode run detected the installed acme.sh and walked the
      configuration and certificate phases.


