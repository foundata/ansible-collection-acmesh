          {{ item['item']['expect'] }})
      loop: "{{ __testing_acmesh_sweep_stat['results'] }}"
      loop_control:
        label: "{{ item['item']['path'] }}"


- name: "Molecule | Verify | Per-certificate removal (state 'absent', webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Include the foundata.acmesh.run role (webroot certificate with state 'absent')"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_certs: >-
          {{
            [
              (__testing_state['run_acmesh_certs']
               | ansible.builtin.selectattr('domains.0.name', 'ansible.builtin.equalto', 'acmesh-webroot.test')
               | ansible.builtin.first)
              | ansible.builtin.combine({'state': 'absent'})
            ]
          }}


    - name: "Molecule | Verify | Gather stats for the removed webroot certificate resources"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test"
        - "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test_ecc"
        - "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test_rsa"
        - "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.path"
        - "/etc/systemd/system/acmesh-reload-acmesh-webroot.test.service"
        - "/etc/systemd/system/acmesh-deploy-acmesh-webroot.test.path"
        - "/etc/systemd/system/acmesh-deploy-acmesh-webroot.test.service"
        - "/etc/acmesh-deploy.d/acmesh-webroot.test.json"
        - "{{ run_acmesh_cfg_cert_deploy_base_dir }}/acmesh-webroot.test"
        - "/etc/pki/tls/certs/acmesh-webroot.test/ca.cer"
        - "/etc/pki/tls/certs/acmesh-webroot.test/cert.cer"
        - "/etc/pki/tls/certs/acmesh-webroot.test/fullchain.cer"
        - "/etc/molecule-acmesh-protected/acmesh-webroot.test/cert.key"
      register: __testing_acmesh_certabsent_stat


    - name: "Molecule | Verify | Assert all data of the removed certificate is gone"
      ansible.builtin.assert:
