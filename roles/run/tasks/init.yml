# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __run_acmesh_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__run_acmesh_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__run_acmesh_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __run_acmesh_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is ansible.builtin.version(__run_acmesh_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__run_acmesh_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __run_acmesh_supported_platforms }}
  vars:
    __run_acmesh_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __run_acmesh_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __run_acmesh_matched_versions: >-
      {{
        __run_acmesh_supported_platforms
        | ansible.builtin.selectattr('name', 'ansible.builtin.match', __run_acmesh_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('ansible.builtin.match', __run_acmesh_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__run_acmesh_supported_platforms | ansible.builtin.length) > 0
    - (__run_acmesh_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __run_acmesh_platform_filenames_raw:
      - "{{ __run_acmesh_dist }}_{{ __run_acmesh_dist_ver }}.yml"
      - "{{ __run_acmesh_dist }}_{{ __run_acmesh_dist_major }}.yml"
      - "{{ __run_acmesh_dist }}.yml"
      - "{{ __run_acmesh_os_family }}.yml"
  vars:
    __run_acmesh_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_acmesh_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_acmesh_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_acmesh_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __run_acmesh_platform_filenames_most_specific_first: >-
      {{
        (__run_acmesh_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __run_acmesh_platform_filenames_most_specific_last: >-
      {{
        __run_acmesh_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __run_acmesh_vars_file }}"
  vars:
    __run_acmesh_vars_file: "{{ role_path }}/vars/{{ item }}"
  when:
    - __run_acmesh_vars_file is ansible.builtin.file
  loop: "{{ __run_acmesh_platform_filenames_most_specific_last }}"


### acme.sh specific

# Deliberately shows the credential-free views instead of run_acmesh_certs:
# each certificate's "environment" mapping holds DNS API credentials which
# must not end up in verbose (-vvv) output.
- name: "Init | Show certificate settings (without credentials)"
  ansible.builtin.debug:
    var: __run_acmesh_certs_no_secrets
    verbosity: 3


- name: "Init | Show certificate removal settings"
  ansible.builtin.debug:
    var: __run_acmesh_certs_absent_cleanup
    verbosity: 3


- name: "Init | Determine installed version (if any)"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to retrieve the version.
  # - The script includes inline logic to handle potential edge cases (e.g.,
  #   non-numeric output) while only using standard tooling. A replacement
  #   would require many additional tasks with little to no benefit.
  # - Using ansible.builtin.stat and/or ansible.builtin.command for a safer exec
  #   environment would require additional tasks with little to no benefit.
  # - Security concerns are mitigated by strict path usage and input validation.
  ansible.builtin.shell:
    cmd: |
      set -u # Fail on unset vars
      set -o pipefail # Fail if any pipe cmd fails

      __run_acmesh_version_installed=""
      if command -v {{ (run_acmesh_cfg_home ~ '/acme.sh') | ansible.builtin.quote }} > /dev/null 2>&1
      then
        __run_acmesh_version_installed=$({{ (run_acmesh_cfg_home ~ '/acme.sh' ) | ansible.builtin.quote }} --version | tail -1 | sed -e 's/^v//g')
        if ! printf '%s' "${__run_acmesh_version_installed}" | grep -E -q -e '^[[:digit:]\.]*$'
        then
          __run_acmesh_version_installed=''
        fi
      fi

      printf '%s' "${__run_acmesh_version_installed}"
      exit 0
    executable: "/bin/bash" # Support for other shells untested (so far)
  register: __run_acmesh_version_installed_result
  ignore_errors: true
  changed_when:
    - false


- name: "Init | Set installed version as facts"
  ansible.builtin.set_fact:
    __run_acmesh_is_installed: >-
      {{
        (__run_acmesh_version_installed_result is ansible.builtin.success)
        | ansible.builtin.ternary(
          (__run_acmesh_version_installed_result['stdout'] | ansible.builtin.default('') | ansible.builtin.length > 0),
          false
        )
      }}
    __run_acmesh_version_installed: >-
      {{
        (__run_acmesh_version_installed_result is ansible.builtin.success)
        | ansible.builtin.ternary(
          (__run_acmesh_version_installed_result['stdout'] | ansible.builtin.default('')),
          ''
        )
      }}


- name: "Init | Display installed version (if any, empty string means \"not installed\")"
  ansible.builtin.debug:
    var: __run_acmesh_version_installed
    verbosity: 1

# Protect against managing an unsafe account
#
# The role fully owns the account named by run_acmesh_user: install rewrites its
# password, shell, home and supplementary groups, and uninstall deletes it
# together with its home directory. Pointing that at a shared or privileged
# account (root, a UID 0 account, or the account Ansible connects with) would
# damage or delete it, so refuse to run in that case. This guard lives in the
# always-included init tasks so it protects both the install and uninstall path.
- name: "Init | Determine the Ansible connection user (unprivileged)"
  # "become: false" reports the real connection user even when the role runs with
  # privilege escalation; "check_mode: false" keeps the guard effective during a
  # "--check" run.
  ansible.builtin.command:
    argv:
      - "id"
      - "-un"
  become: false
  changed_when:
    - false
  check_mode: false
  register: __run_acmesh_connection_user_raw


- name: "Init | Look up the configured service account (if it already exists)"
  ansible.builtin.getent:
    database: "passwd"
    key: "{{ run_acmesh_user }}"
    fail_key: false


- name: "Init | Check run_acmesh_user is a dedicated account and fail if unmet"
  ansible.builtin.assert:
    that:
      - run_acmesh_user != 'root'
      - run_acmesh_user != (__run_acmesh_connection_user_raw['stdout'] | ansible.builtin.trim)
      - run_acmesh_user != (ansible_facts['user_id'] | ansible.builtin.default('', true))
      # If the account already exists it must not be UID 0. getent stores the UID
      # at index 1 and yields "none" for an account that does not exist yet.
      - >-
        (ansible_facts['getent_passwd'][run_acmesh_user] is ansible.builtin.none)
        or ((ansible_facts['getent_passwd'][run_acmesh_user][1] | ansible.builtin.int) != 0)
    fail_msg: >-
      run_acmesh_user ('{{ run_acmesh_user }}') must be a dedicated account fully
      owned by this role. It must not be "root", a UID 0 account, or the account
      Ansible connects with, because the role rewrites this account on install and
      deletes it (with its home directory) on uninstall. Set run_acmesh_user to a
      separate, role-owned service account.
    quiet: true


# The first domain is the certificate's identity: it names the acme.sh data
# directory below run_acmesh_cfg_cert_home and the acmesh-reload-* units, and
# the issue/install/removal tasks dereference it directly. Without this check
# an empty entry only fails later with an unhelpful templating error, and a
# state: absent entry without a domain is silently skipped by the cleanup.
- name: "Init | Check every certificate defines non-empty domain names and fail if unmet"
  ansible.builtin.assert:
    that:
      - "(__run_acmesh_certs_unnamed | ansible.builtin.length) == 0"
    fail_msg: >-
      The following run_acmesh_certs entr(y/ies) have an empty "domains" list or
      an entry without a non-empty "name":
      {{ __run_acmesh_certs_unnamed | ansible.builtin.join(', ') }}.
      Every certificate needs at least one domain and every domain a name; the
      first one is the certificate's primary domain and identity.
    quiet: true
  vars:
    __run_acmesh_certs_unnamed: >-
      {%- set offenders = [] -%}
      {%- for _cert in (run_acmesh_certs | ansible.builtin.default([])) -%}
      {%-   set _domains = _cert['domains'] | ansible.builtin.default([]) -%}
      {%-   set _ns = namespace(bad=((_domains | ansible.builtin.length) == 0)) -%}
      {%-   for _domain in _domains -%}
      {%-     if (((_domain['name'] | ansible.builtin.default('')) | ansible.builtin.trim) | ansible.builtin.length) == 0 -%}
      {%-       set _ns.bad = true -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   if _ns.bad -%}
      {%-     set _ = offenders.append('run_acmesh_certs[' ~ loop.index0 ~ ']') -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ offenders }}


# Two entries with the same primary domain would share the acme.sh data
# directory and the reload units (last writer wins); the unit names must also
# stay unique AFTER normalization, since e.g. "Example.com" and "example.com"
# or "wild_card.example.com" and "wild-card.example.com" collapse to the same
# acmesh-reload-* unit while using different storage directories.
- name: "Init | Check certificate primary domains and derived unit names are unique and fail if unmet"
  ansible.builtin.assert:
    that:
      - "(__run_acmesh_primary_domains_duplicated | ansible.builtin.length) == 0"
      - "(__run_acmesh_unit_names_duplicated | ansible.builtin.length) == 0"
    fail_msg: >-
      run_acmesh_certs contains certificates whose identity collides.
      Duplicated primary domains (sharing acme.sh storage and reload units):
      {{ __run_acmesh_primary_domains_duplicated | ansible.builtin.join(', ') | ansible.builtin.default('none', true) }}.
      Primary domains collapsing to the same acmesh-reload-* unit name after
      normalization (lowercase, every character outside 'a-z0-9.-' becomes '-'):
      {{ __run_acmesh_unit_names_duplicated | ansible.builtin.join(', ') | ansible.builtin.default('none', true) }}.
      Use one entry per certificate identity (all additional names of a
      certificate belong into its "domains" list as SANs).
    quiet: true
  vars:
    __run_acmesh_primary_domains_all: >-
      {%- set domains = [] -%}
      {%- for _cert in (run_acmesh_certs | ansible.builtin.default([])) -%}
      {%-   set _ = domains.append((_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('')) -%}
      {%- endfor -%}
      {{ domains }}
    __run_acmesh_primary_domains_duplicated: >-
      {%- set duplicated = [] -%}
      {%- for _domain in (__run_acmesh_primary_domains_all | ansible.builtin.unique) -%}
      {%-   set _hits = __run_acmesh_primary_domains_all
                        | ansible.builtin.select('ansible.builtin.equalto', _domain)
                        | ansible.builtin.list -%}
      {%-   if (_hits | ansible.builtin.length) > 1 -%}
      {%-     set _ = duplicated.append(_domain) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ duplicated }}
    __run_acmesh_unit_names_all: >-
      {{
        __run_acmesh_primary_domains_all
        | ansible.builtin.map('ansible.builtin.lower')
        | ansible.builtin.map('ansible.builtin.regex_replace', '[^a-z0-9.-]', '-')
        | ansible.builtin.list
      }}
    __run_acmesh_unit_names_duplicated: >-
      {%- set duplicated = [] -%}
      {%- for _name in (__run_acmesh_unit_names_all | ansible.builtin.unique) -%}
      {%-   set _hits = __run_acmesh_unit_names_all
                        | ansible.builtin.select('ansible.builtin.equalto', _name)
                        | ansible.builtin.list -%}
      {%-   if (_hits | ansible.builtin.length) > 1 -%}
      {%-     set _ = duplicated.append(_name) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ duplicated }}


- name: "Init | Check every reloadcmd has an installed certificate file to watch and fail if unmet"
  # Reload commands run via root-side systemd path units watching the installed
  # certificate files (see vars/main.yml). A certificate with a "reloadcmd" but
  # without any install file path has nothing to watch, so its reload command
  # would silently never run.
  ansible.builtin.assert:
    that:
      - "(__run_acmesh_reload_units_missing_watch | ansible.builtin.length) == 0"
    fail_msg: >-
      The following certificate(s) define run_acmesh_certs[]['install']['reloadcmd']
      but none of the install file paths (fullchain_file, key_file, ca_file,
      cert_file): {{ __run_acmesh_reload_units_missing_watch | ansible.builtin.join(', ') }}.
      The reload command is executed by a systemd path unit watching the installed
      certificate files, so at least one of these paths is required.
    quiet: true


- name: "Init | Check no reloadcmd contains a line break and fail if unmet"
  # The reload command is inlined into the ExecStart= line of a systemd unit;
  # a line break would corrupt the unit file syntax.
  ansible.builtin.assert:
    that:
      - "(__run_acmesh_reloadcmds_multiline | ansible.builtin.length) == 0"
    fail_msg: >-
      The run_acmesh_certs[]['install']['reloadcmd'] of the following
      certificate(s) contains a line break, which is not supported (the command
      becomes part of a systemd unit's ExecStart= line):
      {{ __run_acmesh_reloadcmds_multiline | ansible.builtin.join(', ') }}.
      Separate multiple commands with ";" on a single line instead.
    quiet: true
  vars:
    __run_acmesh_reloadcmds_multiline: >-
      {%- set domains = [] -%}
      {%- for _cert in __run_acmesh_certs_managed -%}
      {%-   set _reloadcmd = (_cert['install'] | ansible.builtin.default({}))['reloadcmd'] | ansible.builtin.default('') -%}
      {%-   if (_reloadcmd | ansible.builtin.trim) != (_reloadcmd | ansible.builtin.trim | ansible.builtin.regex_replace('[\r\n]', ' ')) -%}
      {%-     set _ = domains.append((_cert['domains'] | ansible.builtin.default([{}]))[0]['name'] | ansible.builtin.default('unknown')) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ domains }}


# This block may be removed in a future version, e.g. around late ~2027 when most users
# are likely to have migrated their settings. Do not forget to also remove
#   1. fullcain_file in meta/argument_specs.yml
#   2. init-only variable normalization regression test in Molecule verify stage
# then. __run_acmesh_deprecated_fullchain_file_pause_seconds is intentionally unset (so
# nothing to remove from vars/main.yml) but not to be exposed as a public parameter.
- name: "Init | Handle deprecated 'fullcain_file' key in run_acmesh_certs"
  when:
    - run_acmesh_certs is ansible.builtin.defined
    - (run_acmesh_certs | ansible.builtin.default([])
       | ansible.builtin.selectattr('install', 'ansible.builtin.defined')
       | ansible.builtin.map(attribute='install')
       | ansible.builtin.selectattr('fullcain_file', 'ansible.builtin.defined')
       | ansible.builtin.list
       | ansible.builtin.length) > 0
  block:

    - name: "Init | Warn if deprecated 'fullcain_file' key is found in run_acmesh_certs"
      ansible.builtin.pause:
        seconds: "{{ __run_acmesh_deprecated_fullcain_file_pause_seconds | ansible.builtin.default(30) }}"
        prompt: |
          foundata.acmesh.run: The run_acmesh_certs[]['install'] sub-key "fullcain_file"
          has been renamed to "fullchain_file" in version 2.0.0 of this role (typo fix,
          "cain" instead of "chain"). Update your playbooks and inventory accordingly
          by replacing all occurrences of "fullcain_file" with "fullchain_file".
          Future versions of this role might fail hard when "fullcain_file" is used:

          run_acmesh_certs:
            - [...]
              install:
              [...]
                fullcain_file: # rename to fullchain_file:


    - name: "Init | Normalize deprecated 'fullcain_file' key to 'fullchain_file'"
      ansible.builtin.set_fact:
        run_acmesh_certs: "{{ __run_acmesh_certs_normalized_json | ansible.builtin.from_json }}"
      vars:
        __run_acmesh_certs_normalized_json: |
          {%- set _certs = [] -%}
          {%- for _cert in run_acmesh_certs -%}
            {%- set _install = _cert['install'] | ansible.builtin.default({}) -%}
            {%- if _install['fullcain_file'] is ansible.builtin.defined -%}
              {%- set _install_normalized = (
                    _install
                    | ansible.builtin.dict2items
                    | ansible.builtin.rejectattr('key', 'ansible.builtin.equalto', 'fullcain_file')
                    | ansible.builtin.list
                    | ansible.builtin.items2dict
                    | ansible.builtin.combine({'fullchain_file': _install['fullcain_file']})
                  )
              -%}
              {%- set _ = _certs.append(_cert | ansible.builtin.combine({'install': _install_normalized})) -%}
            {%- else -%}
              {%- set _ = _certs.append(_cert) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ _certs | ansible.builtin.to_json }}
