---

security_fixes:
  - >
    ``run`` role - DNS API credentials passed through ``run_acmesh_environment``
    and the per-certificate ``environment`` mapping could appear in task output.
    The certificate issue and install tasks set them as the task environment and
    also carried the per-certificate values in their loop items, so a normal run
    (and especially ``--diff`` or a task failure) printed them. Both tasks are now
    ``no_log``, both variables are marked ``no_log`` in the argument
    specification, and the remaining tasks that iterate over the certificates but
    do not need the credentials loop over a credential-free view of the list.
    Note that a ``-vvv`` run still exposes the environment in the connection
    plugin's ``EXEC`` line; this is an Ansible limitation that ``no_log`` does not
    cover.
