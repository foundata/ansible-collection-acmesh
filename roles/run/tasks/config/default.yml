# Configuration: Manage settings, like adapting or creating config files.

---

- name: "Config | Default | Configure acme.sh"
  # The command or shell module is used here. This approach is justified:
  #
  # - No built-in Ansible module provides a direct way to interact with the
  #   used command.
  # - Inline templating allows for safe and efficient parameter handling,
  #   avoiding the need for multiple additional tasks with little to no benefit.
  #
  # Notes on the command or script itself:
  #
  # acme.sh can update, modify, or correct configuration values during
  # execution of most subcommands. Therefore, we simply call the --info command,
  # which itself does not perform any certificate-related actions but allows
  # us to update the configuration. See the official documentation for a
  # explanation of the parameters:
  # https://github.com/acmesh-official/acme.sh/wiki/Options-and-Params
  ansible.builtin.shell:
    cmd: |
      set -u # Fail on unset vars
      set -o pipefail # Fail if any pipe cmd fails

      __run_acmesh_checksum_before=$({{ __run_acmesh_sha1sum_exec_path }} {{ (run_acmesh_cfg_config_home ~ '/account.conf') | ansible.builtin.quote }})

      if ! {{ __run_acmesh_setpriv_run_as_user }} -- ./acme.sh \
            --info \
            --home {{ run_acmesh_cfg_home | ansible.builtin.quote }} \
            --config-home {{ run_acmesh_cfg_config_home | ansible.builtin.quote }} \
            --certhome {{ run_acmesh_cfg_cert_home | ansible.builtin.quote }} \
            --log {{ run_acmesh_cfg_logfile | ansible.builtin.quote }} \
            --log-level {{ run_acmesh_cfg_log_level | ansible.builtin.quote }} \
            --syslog {{ run_acmesh_cfg_syslog | ansible.builtin.quote }} \
            {{ '--auto-upgrade 1'
              if ((run_acmesh_autoupgrade is ansible.builtin.defined) and
                  (run_acmesh_autoupgrade))
              else
              '--auto-upgrade 0' }} \
            {{ '--accountemail ' ~ (run_acmesh_cfg_accountemail | ansible.builtin.quote)
              if ((run_acmesh_cfg_accountemail is ansible.builtin.defined) and
                  (run_acmesh_cfg_accountemail))
              else
              '' }}
      then
        exit 1
      fi

      __run_acmesh_checksum_after=$({{ __run_acmesh_sha1sum_exec_path }} {{ (run_acmesh_cfg_config_home ~ '/account.conf') | ansible.builtin.quote }})
      if [ "${__run_acmesh_checksum_before}" != "${__run_acmesh_checksum_after}" ]
      then
        printf 'Changed config file: %s' {{ (run_acmesh_cfg_config_home ~ '/account.conf') | ansible.builtin.quote }}
      fi

      exit 0
    executable: "/bin/bash" # Support for other shells untested (so far)
  args:
    chdir: "{{ run_acmesh_cfg_home }}"
  # Mirror the environment of the renewal service unit (which sets HOME= the
  # same way); acme.sh runs as the service user, see vars/main.yml on the
  # setpriv prefix.
  environment:
    HOME: "{{ run_acmesh_cfg_home }}"
  changed_when:
    - __run_acmesh_config_result is ansible.builtin.success
    - ('Changed config file') in __run_acmesh_config_result['stdout']
  register: __run_acmesh_config_result


- name: "Config | Default | Create systemd unit file (acmesh-renewal.service)"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_systemd_renewal_servicefile_path }}"
    content: |
      [Unit]
      Description=acme.sh - renew certificates
      After=network-online.target

      [Service]
      Type=oneshot
      User={{ run_acmesh_user }}
      Group={{ run_acmesh_group }}
      {% if __run_acmesh_renewal_needs_net_bind | ansible.builtin.bool %}
      # A configured certificate uses the "standalone" (HTTP-01, privileged port)
      # or "alpn" (TLS-ALPN-01, port 443) challenge. acme.sh binds that port
      # itself during renewal and this service runs unprivileged (User=), so it
      # needs the capability to bind a port below 1024.
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      {% endif %}
      Environment="HOME={{ run_acmesh_cfg_home }}"
      WorkingDirectory={{ run_acmesh_cfg_home }}
      # --certhome is required here: without it, acme.sh does not reliably
      # recover the certificate home used at --issue time and falls back to
      # scanning --config-home for certificate directories instead, silently
      # finding nothing to renew (cf. issue reports about acmesh-renewal.service
      # never renewing anything when run_acmesh_cfg_cert_home differs from
      # run_acmesh_cfg_config_home, which is the default layout).
      ExecStart="{{ run_acmesh_cfg_home }}"/acme.sh --cron \
        --home "{{ run_acmesh_cfg_home }}" \
        --config-home "{{ run_acmesh_cfg_config_home }}" \
        --certhome "{{ run_acmesh_cfg_cert_home }}"
      SuccessExitStatus=0 2
      StandardError=journal
      SyslogIdentifier=acme.sh
    force: true
    owner: "{{ __run_acmesh_systemd_renewal_servicefile_owner }}"
    group: "{{ __run_acmesh_systemd_renewal_servicefile_group }}"
    mode: "{{ __run_acmesh_systemd_renewal_servicefile_mode }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Config | Default | Create systemd unit file (acmesh-renewal.timer)"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_systemd_renewal_timerfile_path }}"
    content: |
      [Unit]
      Description=acme.sh - daily certificate renewal

      [Timer]
      OnCalendar=daily
      RandomizedDelaySec=3h
      Persistent=true

      [Install]
      WantedBy=timers.target
    force: true
    owner: "{{ __run_acmesh_systemd_renewal_timerfile_owner }}"
    group: "{{ __run_acmesh_systemd_renewal_timerfile_group }}"
    mode: "{{ __run_acmesh_systemd_renewal_timerfile_mode }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


# debugging: systemctl list-timers --all; systemd-analyze verify acmesh-renewal.timer
- name: "Config | Default | Manage (enable or disabled) acmesh-renewal.timer"
  ansible.builtin.systemd_service:
    name: "acmesh-renewal.timer"
    enabled: "{{ run_acmesh_autorenewal }}"
    state: "{{ 'started' if (run_acmesh_autorenewal | ansible.builtin.bool) else 'stopped' }}"
    daemon_reload: true


# Reload handling: the configured "reloadcmd" of each certificate is not passed
# to acme.sh (which would execute it as the unprivileged service user during
# renewal). Instead, a root-side path unit watches the installed certificate
# files and starts a service unit of the same name, which runs the reload
# command as root. This behaves identically for initial issuance, automated
# renewal and manual acme.sh runs. See __run_acmesh_reload_units in
# vars/main.yml for the entry layout and the choice of the watched file.
#
# Units of certificates that are no longer listed in run_acmesh_certs are kept
# by default: acme.sh continues to renew and reinstall already issued
# certificates until they are actively removed, so their services still need
# reloading. A certificate listed with state "absent" gets its units removed
# together with its data (see tasks/cert/default.yml), and
# run_acmesh_certs_delete_unmanaged reaps units of unlisted certificates. All
# acmesh-reload-* resources get removed on run_acmesh_state: "absent".
- name: "Config | Default | Create systemd unit file(s) (acmesh-reload-*.service)"
  ansible.builtin.copy:
    # The reload command runs via a shell (it may contain multiple commands)
    # and is inlined into ExecStart=. The replace chain escapes systemd's
    # unit-file syntax so the shell receives the configured command
    # byte-identical: backslashes and double quotes (C-style unquoting of the
    # double-quoted word), "%" (specifier expansion, "%%" yields a literal
    # "%") and "$" (variable expansion, "$$" yields a literal "$").
    dest: "{{ __run_acmesh_reload_unitfile_dir }}/{{ __run_acmesh_reload_unit_prefix }}{{ __run_acmesh_reload_unit_item['name'] }}.service"
    content: |
      [Unit]
      Description=acme.sh - run reload command after certificate change ({{ __run_acmesh_reload_unit_item['domain'] }})

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c "{{ __run_acmesh_reload_unit_item['reloadcmd']
        | ansible.builtin.trim
        | ansible.builtin.replace(__run_acmesh_backslash, __run_acmesh_backslash ~ __run_acmesh_backslash)
        | ansible.builtin.replace('"', __run_acmesh_backslash ~ '"')
        | ansible.builtin.replace('%', '%%')
        | ansible.builtin.replace('$', '$$') }}"
      StandardError=journal
      SyslogIdentifier=acmesh-reload
    force: true
    owner: "{{ __run_acmesh_reload_unitfile_owner }}"
    group: "{{ __run_acmesh_reload_unitfile_group }}"
    mode: "{{ __run_acmesh_reload_unitfile_mode }}"
  vars:
    # A literal backslash cannot be written as a Jinja string literal (the
    # lexer keeps escape pairs raw), so it is provided here via YAML
    # double-quoted escaping instead.
    __run_acmesh_backslash: "\\"
  loop: "{{ __run_acmesh_reload_units }}"
  loop_control:
    loop_var: "__run_acmesh_reload_unit_item"
    label: "{{ __run_acmesh_reload_unit_item['name'] }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Config | Default | Create systemd unit file(s) (acmesh-reload-*.path)"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_reload_unitfile_dir }}/{{ __run_acmesh_reload_unit_prefix }}{{ __run_acmesh_reload_unit_item['name'] }}.path"
    content: |
      [Unit]
      Description=acme.sh - watch installed certificate files ({{ __run_acmesh_reload_unit_item['domain'] }})

      [Path]
      # PathChanged= triggers when the watched file gets closed after writing,
      # not on every write and not on permission or ownership changes.
      PathChanged={{ __run_acmesh_reload_unit_item['watch_path'] }}
      Unit={{ __run_acmesh_reload_unit_prefix }}{{ __run_acmesh_reload_unit_item['name'] }}.service

      [Install]
      WantedBy=multi-user.target
    force: true
    owner: "{{ __run_acmesh_reload_unitfile_owner }}"
    group: "{{ __run_acmesh_reload_unitfile_group }}"
    mode: "{{ __run_acmesh_reload_unitfile_mode }}"
  loop: "{{ __run_acmesh_reload_units }}"
  loop_control:
    loop_var: "__run_acmesh_reload_unit_item"
    label: "{{ __run_acmesh_reload_unit_item['name'] }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Config | Default | Manage (enable and start) acmesh-reload-*.path unit(s)"
  ansible.builtin.systemd_service:
    name: "{{ __run_acmesh_reload_unit_prefix }}{{ __run_acmesh_reload_unit_item['name'] }}.path"
    enabled: true
    state: "started"
    daemon_reload: true
  loop: "{{ __run_acmesh_reload_units }}"
  loop_control:
    loop_var: "__run_acmesh_reload_unit_item"
    label: "{{ __run_acmesh_reload_unit_item['name'] }}"


# Staged certificate deployment (install strategy "staged", the default):
# acme.sh installs into a per-certificate staging directory below the
# root-owned staging base; a root-owned path/service unit pair per certificate
# (acmesh-deploy-*) runs a fixed helper program which validates the staged
# files and publishes them to the final destinations with the configured
# ownership and modes. This keeps acme.sh unprivileged while supporting
# destinations below protected directories such as /etc/ssl/private. The unit
# naming and lifecycle mirror the acmesh-reload-* units above; the initial
# (synchronous) deployment happens in tasks/cert/default.yml.

- name: "Config | Default | Create the staging base directory (staged deployment)"
  ansible.builtin.file:
    path: "{{ run_acmesh_cfg_cert_deploy_base_dir }}"
    state: "directory"
    owner: "{{ __run_acmesh_deploy_staging_base_dir_owner }}"
    group: "{{ __run_acmesh_deploy_staging_base_dir_group }}"
    mode: "{{ __run_acmesh_deploy_staging_base_dir_mode }}"
  when:
    - (__run_acmesh_install_normalized_staged | ansible.builtin.length) > 0


- name: "Config | Default | Create the certificate staging directories (staged deployment)"
  ansible.builtin.file:
    path: "{{ __run_acmesh_staging_dir_item['staging_dir'] }}"
    state: "directory"
    owner: "{{ run_acmesh_user }}"
    group: "{{ run_acmesh_group }}"
    mode: "{{ __run_acmesh_deploy_staging_dir_mode }}"
  loop: "{{ __run_acmesh_install_normalized_staged }}"
  loop_control:
    loop_var: "__run_acmesh_staging_dir_item"
    label: "{{ __run_acmesh_staging_dir_item['domain'] }}"


- name: "Config | Default | Install the deploy helper (staged deployment)"
  ansible.builtin.copy:
    src: "acmesh-deploy.py"
    dest: "{{ __run_acmesh_deploy_helper_path }}"
    owner: "{{ __run_acmesh_deploy_helper_owner }}"
    group: "{{ __run_acmesh_deploy_helper_group }}"
    mode: "{{ __run_acmesh_deploy_helper_mode }}"
  when:
    - (__run_acmesh_install_normalized_staged | ansible.builtin.length) > 0


- name: "Config | Default | Create the deployment manifest directory (staged deployment)"
  ansible.builtin.file:
    path: "{{ __run_acmesh_deploy_manifest_dir_path }}"
    state: "directory"
    owner: "{{ __run_acmesh_deploy_manifest_dir_owner }}"
    group: "{{ __run_acmesh_deploy_manifest_dir_group }}"
    mode: "{{ __run_acmesh_deploy_manifest_dir_mode }}"
  when:
    - (__run_acmesh_install_normalized_staged | ansible.builtin.length) > 0


# The manifests must only contain trusted numeric UID/GID values, so the
# effective owner/group names are resolved here (after the setup phase
# created the service account, which is the default owner).
- name: "Config | Default | Look up the numeric UID of every staged install owner"
  ansible.builtin.getent:
    database: "passwd"
    key: "{{ __run_acmesh_install_owner_item }}"
    fail_key: false
  loop: "{{ __run_acmesh_install_staged_owner_names }}"
  loop_control:
    loop_var: "__run_acmesh_install_owner_item"
  register: __run_acmesh_install_owner_getent


- name: "Config | Default | Look up the numeric GID of every staged install group"
  ansible.builtin.getent:
    database: "group"
    key: "{{ __run_acmesh_install_group_item }}"
    fail_key: false
  loop: "{{ __run_acmesh_install_staged_group_names }}"
  loop_control:
    loop_var: "__run_acmesh_install_group_item"
  register: __run_acmesh_install_group_getent


- name: "Config | Default | Resolve staged install owner and group names to numeric IDs"
  ansible.builtin.set_fact:
    # getent keys its result by the entry name, so a numeric lookup (e.g.
    # owner "0") is keyed "root"; each loop result contains exactly the one
    # queried entry, so the first value belongs to the looped name.
    __run_acmesh_install_uid_map: >-
      {%- set map = {} -%}
      {%- for _res in (__run_acmesh_install_owner_getent['results'] | ansible.builtin.default([])) -%}
      {%-   set _values = ((_res['ansible_facts'] | ansible.builtin.default({}))['getent_passwd']
                          | ansible.builtin.default({})).values() | ansible.builtin.list -%}
      {%-   if ((_values | ansible.builtin.length) > 0) and (_values[0] is not ansible.builtin.none) -%}
      {%-     set _ = map.update({(_res['__run_acmesh_install_owner_item'] | ansible.builtin.string): (_values[0][1] | ansible.builtin.int)}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ map }}
    __run_acmesh_install_gid_map: >-
      {%- set map = {} -%}
      {%- for _res in (__run_acmesh_install_group_getent['results'] | ansible.builtin.default([])) -%}
      {%-   set _values = ((_res['ansible_facts'] | ansible.builtin.default({}))['getent_group']
                          | ansible.builtin.default({})).values() | ansible.builtin.list -%}
      {%-   if ((_values | ansible.builtin.length) > 0) and (_values[0] is not ansible.builtin.none) -%}
      {%-     set _ = map.update({(_res['__run_acmesh_install_group_item'] | ansible.builtin.string): (_values[0][1] | ansible.builtin.int)}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ map }}
  when:
    - (__run_acmesh_install_normalized_staged | ansible.builtin.length) > 0


- name: "Config | Default | Determine unresolved staged install owners and groups"
  ansible.builtin.set_fact:
    __run_acmesh_install_ids_unresolved: >-
      {%- set missing = [] -%}
      {%- for _name in __run_acmesh_install_staged_owner_names -%}
      {%-   if (_name | ansible.builtin.string) not in __run_acmesh_install_uid_map -%}
      {%-     set _ = missing.append('owner ' ~ _name) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- for _name in __run_acmesh_install_staged_group_names -%}
      {%-   if (_name | ansible.builtin.string) not in __run_acmesh_install_gid_map -%}
      {%-     set _ = missing.append('group ' ~ _name) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ missing }}
  when:
    - (__run_acmesh_install_normalized_staged | ansible.builtin.length) > 0


- name: "Config | Default | Check every staged install owner and group exists and fail if unmet"
  # In check mode a missing owner/group is only reported (see the next task):
  # it may be created by an earlier step of the same play which check mode did
  # not really execute.
  ansible.builtin.assert:
    that:
      - "(__run_acmesh_install_ids_unresolved | ansible.builtin.length) == 0"
    fail_msg: >-
      The following install.permissions owner(s)/group(s) do not exist on the
      target: {{ __run_acmesh_install_ids_unresolved | ansible.builtin.join(', ') }}.
      Create them before running this role (or fix the permission settings).
    quiet: true
  when:
    - (__run_acmesh_install_normalized_staged | ansible.builtin.length) > 0
    - not ansible_check_mode


- name: "Config | Default | Notify about unresolved install owners and groups (check mode)"
  ansible.builtin.debug:
    msg: >-
      Check mode: the following install.permissions owner(s)/group(s) do not
      exist (yet): {{ __run_acmesh_install_ids_unresolved | ansible.builtin.join(', ') }}.
      The deployment manifests cannot be rendered without them; a real run
      fails unless they exist by the time this role runs.
  when:
    - (__run_acmesh_install_normalized_staged | ansible.builtin.length) > 0
    - ansible_check_mode
    - (__run_acmesh_install_ids_unresolved | ansible.builtin.default([]) | ansible.builtin.length) > 0


- name: "Config | Default | Create deployment manifest(s) (staged deployment)"
  ansible.builtin.template:
    src: "acmesh-deploy-manifest.json.j2"
    dest: "{{ __run_acmesh_deploy_manifest_dir_path }}/{{ __run_acmesh_manifest_item['cert_id'] }}.json"
    owner: "{{ __run_acmesh_deploy_manifest_file_owner }}"
    group: "{{ __run_acmesh_deploy_manifest_file_group }}"
    mode: "{{ __run_acmesh_deploy_manifest_file_mode }}"
  vars:
    tpl_manifest: >-
      {%- set _artifacts = {} -%}
      {%- for _key, _artifact in __run_acmesh_manifest_item['artifacts'].items() -%}
      {%-   set _ = _artifacts.update({_key: {
              'staging': _artifact['staging'],
              'destination': _artifact['dest'],
              'uid': (__run_acmesh_install_uid_map[_artifact['owner']] | ansible.builtin.int),
              'gid': (__run_acmesh_install_gid_map[_artifact['group']] | ansible.builtin.int),
              'mode': _artifact['mode'],
            }}) -%}
      {%- endfor -%}
      {{ {
        'version': 1,
        'certificate_id': __run_acmesh_manifest_item['cert_id'],
        'domains': __run_acmesh_manifest_item['domains'],
        'staging_dir': __run_acmesh_manifest_item['staging_dir'],
        'completion_artifact': __run_acmesh_manifest_item['completion_key'],
        'artifacts': _artifacts,
      } }}
  when:
    - (__run_acmesh_install_ids_unresolved | ansible.builtin.default([]) | ansible.builtin.length) == 0
  loop: "{{ __run_acmesh_install_normalized_staged }}"
  loop_control:
    loop_var: "__run_acmesh_manifest_item"
    label: "{{ __run_acmesh_manifest_item['domain'] }}"


- name: "Config | Default | Create systemd unit file(s) (acmesh-deploy-*.service)"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_deploy_unitfile_dir }}/{{ __run_acmesh_deploy_unit_prefix }}{{ __run_acmesh_deploy_service_item['cert_id'] }}.service"
    content: |
      [Unit]
      Description=acme.sh - deploy staged certificate files ({{ __run_acmesh_deploy_service_item['domain'] }})

      [Service]
      Type=oneshot
      # No explicit User=/Group=: the system manager runs services as root
      # anyway and an explicit User= makes systemd retain CAP_SYS_ADMIN
      # across the user transition for the sandboxing below, which fails in
      # unprivileged containers.
      UMask=0077
      ExecStart={{ __run_acmesh_deploy_python_exec_path }} {{ __run_acmesh_deploy_helper_path }} {{ __run_acmesh_deploy_manifest_file }}
      NoNewPrivileges=true
      PrivateTmp=true
      PrivateDevices=true
      PrivateNetwork=true
      ProtectSystem=strict
      ProtectHome=read-only
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectKernelLogs=true
      ProtectControlGroups=true
      ProtectClock=true
      ProtectHostname=true
      RestrictSUIDSGID=true
      RestrictRealtime=true
      RestrictNamespaces=true
      LockPersonality=true
      SystemCallArchitectures=native
      {% for _dir in __run_acmesh_deploy_service_item['directories'] %}
      ReadWritePaths={{ _dir }}
      {% endfor %}
      StandardError=journal
      SyslogIdentifier=acmesh-deploy
    force: true
    owner: "{{ __run_acmesh_deploy_unitfile_owner }}"
    group: "{{ __run_acmesh_deploy_unitfile_group }}"
    mode: "{{ __run_acmesh_deploy_unitfile_mode }}"
  vars:
    __run_acmesh_deploy_manifest_file: "{{ __run_acmesh_deploy_manifest_dir_path }}/{{ __run_acmesh_deploy_service_item['cert_id'] }}.json"
  loop: "{{ __run_acmesh_install_normalized_staged }}"
  loop_control:
    loop_var: "__run_acmesh_deploy_service_item"
    label: "{{ __run_acmesh_deploy_service_item['cert_id'] }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Config | Default | Create systemd unit file(s) (acmesh-deploy-*.path)"
  ansible.builtin.copy:
    dest: "{{ __run_acmesh_deploy_unitfile_dir }}/{{ __run_acmesh_deploy_unit_prefix }}{{ __run_acmesh_deploy_path_item['cert_id'] }}.path"
    content: |
      [Unit]
      Description=acme.sh - watch staged certificate files ({{ __run_acmesh_deploy_path_item['domain'] }})

      [Path]
      # PathChanged= triggers when the watched file gets closed after writing
      # or renamed into place, not on every write and not on permission or
      # ownership changes. acme.sh writes this staged artifact last, and the
      # deploy helper publishes its final counterpart last, so both watchers
      # only fire on complete sets.
      PathChanged={{ __run_acmesh_deploy_path_item['artifacts'][__run_acmesh_deploy_path_item['completion_key']]['staging'] }}
      Unit={{ __run_acmesh_deploy_unit_prefix }}{{ __run_acmesh_deploy_path_item['cert_id'] }}.service

      [Install]
      WantedBy=multi-user.target
    force: true
    owner: "{{ __run_acmesh_deploy_unitfile_owner }}"
    group: "{{ __run_acmesh_deploy_unitfile_group }}"
    mode: "{{ __run_acmesh_deploy_unitfile_mode }}"
  loop: "{{ __run_acmesh_install_normalized_staged }}"
  loop_control:
    loop_var: "__run_acmesh_deploy_path_item"
    label: "{{ __run_acmesh_deploy_path_item['cert_id'] }}"
  notify:
    - "run_acmesh: systemd daemon-reload"


# Strategy transition staged -> direct: a managed certificate with strategy
# "direct" must not keep deploy resources. (Deploy resources of certificates
# that are no longer listed at all are kept, exactly like the acmesh-reload-*
# units: acme.sh keeps renewing unlisted certificates into their staging area
# until they are removed via state "absent" or the delete-unmanaged sweep.)
- name: "Config | Default | Disable deploy units of certificates with strategy 'direct' (best-effort)"
  ansible.builtin.systemd_service:
    name: "{{ __run_acmesh_deploy_unit_prefix }}{{ __run_acmesh_deploy_unit_item[0]['cert_id'] }}.{{ __run_acmesh_deploy_unit_item[1] }}"
    enabled: false
    state: "stopped"
  failed_when:
    - false # the unit might not exist (e.g. certificate was never staged)
  loop: "{{ __run_acmesh_install_normalized_direct | ansible.builtin.product(['path', 'service']) }}"
  loop_control:
    loop_var: "__run_acmesh_deploy_unit_item"
    label: "{{ __run_acmesh_deploy_unit_item[0]['cert_id'] }} ({{ __run_acmesh_deploy_unit_item[1] }})"
  notify:
    - "run_acmesh: systemd daemon-reload"


- name: "Config | Default | Delete deploy resources of certificates with strategy 'direct'"
  ansible.builtin.file:
    path: "{{ __run_acmesh_deploy_resource_item }}"
    state: "absent"
  loop: >-
    {%- set paths = [] -%}
    {%- for _entry in __run_acmesh_install_normalized_direct -%}
    {%-   set _ = paths.append(__run_acmesh_deploy_unitfile_dir ~ '/' ~ __run_acmesh_deploy_unit_prefix ~ _entry['cert_id'] ~ '.path') -%}
    {%-   set _ = paths.append(__run_acmesh_deploy_unitfile_dir ~ '/' ~ __run_acmesh_deploy_unit_prefix ~ _entry['cert_id'] ~ '.service') -%}
    {%-   set _ = paths.append(__run_acmesh_deploy_manifest_dir_path ~ '/' ~ _entry['cert_id'] ~ '.json') -%}
    {%-   set _ = paths.append(_entry['staging_dir']) -%}
    {%- endfor -%}
    {{ paths }}
  loop_control:
    loop_var: "__run_acmesh_deploy_resource_item"
  notify:
    - "run_acmesh: systemd daemon-reload"
