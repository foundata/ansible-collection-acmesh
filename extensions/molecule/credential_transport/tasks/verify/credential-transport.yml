---
- name: "Molecule | Verify | Run the standalone credential suite on the controller"
  delegate_to: "localhost"
  become: false
  vars:
    __testing_credential_log_root: >-
      {{ lookup('ansible.builtin.env', 'ACMESH_CREDENTIAL_LOG_DIR')
         | ansible.builtin.default(molecule_scenario_directory ~ '/../../../tests/output/credential_transport', true) }}
  run_once: true # noqa: run-once[task]
  block:
    - name: "Molecule | Verify | Create the private log root outside ephemeral state"
      ansible.builtin.file:
        path: "{{ __testing_credential_log_root }}"
        state: "directory"
        mode: "u=rwx,g=,o=" # 0700

    - name: "Molecule | Verify | Create a private directory for this invocation"
      ansible.builtin.tempfile:
        state: "directory"
        path: "{{ __testing_credential_log_root }}"
        prefix: "credential-transport-"
      register: __testing_credential_directory

    - name: "Molecule | Verify | Report the private log directory"
      ansible.builtin.debug:
        msg: "Credential transport logs: {{ __testing_credential_directory['path'] }}/results"
        verbosity: 0

    - name: "Molecule | Verify | Check verbose SSH output, failures, previews and renewal"
      # The external process scans console and file logs independently of the
      # Ansible callback. Only its summary, never raw logs, reaches Molecule.
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ molecule_scenario_directory }}/../../../tests/credential_transport.py"
          - "--inventory"
          - "{{ molecule_ephemeral_directory }}/inventory"
          - "--work-dir"
          - "{{ __testing_credential_directory['path'] }}/results"
      changed_when:
        - true
