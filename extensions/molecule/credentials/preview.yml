# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later

---
- name: "Credentials | Preview with private pre-seeded files"
  hosts: "molecule"
  gather_facts: false
  become: true
  tasks:
    - name: "Credentials | Preview the role"
      ansible.builtin.include_role:
        name: "foundata.acmesh.run"
      vars:
        run_acmesh_cfg_accountemail: "transport@example.test"
        run_acmesh_environment:
          TRANSPORT_TOKEN: "{{ transport_secrets['token'] }}"
        run_acmesh_certs:
          - domains:
              - name: "{{ transport_domain }}"
                challenge:
                  type: "dns"
                  dns_provider: "dns_transport"
            server: "https://localhost:14000/dir"
            environment:
              TRANSPORT_GLOBAL: "{{ transport_secrets['global'] }}"
            install:
              fullchain_file: "/etc/pki/tls/certs/preview-{{ transport_domain }}/fullchain.cer"
              key_file: "/etc/pki/tls/certs/preview-{{ transport_domain }}/cert.key"
      no_log: true

    - name: "Credentials | Check the absent installation stayed absent"
      when:
        - transport_fresh | ansible.builtin.default(false)
      block:
        - name: "Credentials | Inspect the proposed home"
          ansible.builtin.stat:
            path: "{{ run_acmesh_cfg_home }}"
          register: __testing_preview_home

        - name: "Credentials | Assert preview created no installation"
          ansible.builtin.assert:
            that:
              - not __testing_preview_home['stat']['exists']
            quiet: true
