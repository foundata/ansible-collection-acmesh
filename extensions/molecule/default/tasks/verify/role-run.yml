- name: "Molecule | Verify | Permissions of test domain certificates (dns-01 challenge)"
  when:
    - __testing_missing_envvars_dns01 is not ansible.builtin.defined or
      ((__testing_missing_envvars_dns01 | ansible.builtin.length) <= 0)
    - ((lookup('ansible.builtin.env', 'TEST_ACMESH_TESTDOMAIN1') | ansible.builtin.length) > 0) or
      ((lookup('ansible.builtin.env', 'TEST_ACMESH_TESTDOMAIN2') | ansible.builtin.length) > 0)
  block:

    - name: "Molecule | Verify | Build list of installed certificate files (dns-01 challenge)"
      ansible.builtin.set_fact:
        __testing_acmesh_cert_files_installed: |
          {%- set _files = [] -%}

          {%- set _d1 = lookup('ansible.builtin.env', 'TEST_ACMESH_TESTDOMAIN1') -%}
          {%- if _d1 | ansible.builtin.length > 0 -%}
            {%- for _fname in ['ca.cer', 'cert.cer', 'fullchain.cer', 'cert.key'] -%}
              {%- set _ = _files.append('/etc/pki/tls/certs/' ~ _d1 ~ '/' ~ _fname) -%}
            {%- endfor -%}
          {%- endif -%}

          {%- set _d2 = lookup('ansible.builtin.env', 'TEST_ACMESH_TESTDOMAIN2') -%}
          {%- if _d2 | ansible.builtin.length > 0 -%}
            {%- for _fname in ['ca.cer', 'cert.cer', 'fullchain.cer', 'cert.key'] -%}
              {%- set _ = _files.append('/etc/pki/tls/certs/' ~ _d2 ~ '/' ~ _fname) -%}
            {%- endfor -%}
          {%- endif -%}

          {{ _files }}


    - name: "Molecule | Verify | Gather stats for installed certificate files (dns-01 challenge)"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop: "{{ __testing_acmesh_cert_files_installed | ansible.builtin.default([]) }}"
      register: __testing_acmesh_cert_files_installed_stat


    - name: "Molecule | Verify | Check existence, permissions and ownership: installed certificate files (dns-01 challenge)"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isreg']
          - item['stat']['mode'] == '0640'
          - item['stat']['pw_name'] == run_acmesh_user
          - item['stat']['gr_name'] == run_acmesh_group
        fail_msg: "{{ item['stat']['path'] }} does not exist or has incorrect permissions/ownership"
      loop: "{{ __testing_acmesh_cert_files_installed_stat['results'] | ansible.builtin.default([]) }}"
      loop_control:
        label: "{{ item['stat']['path'] | ansible.builtin.default('undefined') }}"
      when:
        - __testing_acmesh_cert_files_installed_stat is ansible.builtin.defined
        - __testing_acmesh_cert_files_installed_stat['results'] is ansible.builtin.defined
        - __testing_acmesh_cert_files_installed_stat['results'] | ansible.builtin.length > 0


## Files and directories: webroot (pebble) certificate

- name: "Molecule | Verify | Certificates (webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Gather stats for directory: certificate data dir (webroot challenge)"
      ansible.builtin.stat:
        path: "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test_ecc/"
        get_checksum: false
        get_mime: false
      register: __testing_acmesh_webroot_certdir_stat


    - name: "Molecule | Verify | Check existence, permissions and ownership: certificate data dir (webroot challenge)"
      ansible.builtin.assert:
        that:
          - __testing_acmesh_webroot_certdir_stat['stat']['exists']
          - __testing_acmesh_webroot_certdir_stat['stat']['isdir']
          - __testing_acmesh_webroot_certdir_stat['stat']['mode'] == '2750'
          - __testing_acmesh_webroot_certdir_stat['stat']['pw_name'] == run_acmesh_user
          - __testing_acmesh_webroot_certdir_stat['stat']['gr_name'] == run_acmesh_group
        fail_msg: "{{ run_acmesh_cfg_cert_home }}/acmesh-webroot.test_ecc/ does not exist or has incorrect permissions/ownership"


    # The webroot certificate uses the (default) "staged" strategy with
    # partial install.permissions overrides: directory and files root-owned
    # with the "molecule-ssl-cert" group, files 0640 via permissions.default,
    # the fullchain overridden to 0644 and the key below a parent directory
    # the service user cannot traverse.
    - name: "Molecule | Verify | Gather stats for installed certificate files (webroot challenge, staged)"
      ansible.builtin.stat:
        path: "{{ item['path'] }}"
        get_checksum: false
        get_mime: false
      loop:
        - path: "/etc/pki/tls/certs/acmesh-webroot.test/ca.cer"
          mode: "0640"
        - path: "/etc/pki/tls/certs/acmesh-webroot.test/cert.cer"
          mode: "0640"
        - path: "/etc/pki/tls/certs/acmesh-webroot.test/fullchain.cer"
          mode: "0644"
        - path: "/etc/molecule-acmesh-protected/acmesh-webroot.test/cert.key"
          mode: "0640"
      loop_control:
        label: "{{ item['path'] }}"
      register: __testing_acmesh_webroot_cert_files_stat


    - name: "Molecule | Verify | Check existence, permissions and ownership: installed certificate files (webroot challenge, staged)"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isreg']
          - item['stat']['mode'] == item['item']['mode']
          - item['stat']['pw_name'] == 'root'
          - item['stat']['gr_name'] == 'molecule-ssl-cert'
        fail_msg: >-
          {{ item['stat']['path'] | ansible.builtin.default(item['item']['path']) }}
          does not exist or has incorrect permissions/ownership (expected
          root:molecule-ssl-cert {{ item['item']['mode'] }})
      loop: "{{ __testing_acmesh_webroot_cert_files_stat['results'] | ansible.builtin.default([]) }}"
      loop_control:
        label: "{{ item['item']['path'] }}"
      when:
        - __testing_acmesh_webroot_cert_files_stat['results'] is ansible.builtin.defined
        - __testing_acmesh_webroot_cert_files_stat['results'] | ansible.builtin.length > 0


    - name: "Molecule | Verify | Gather stats for the destination directories (webroot challenge, staged)"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "/etc/pki/tls/certs/acmesh-webroot.test"
        - "/etc/molecule-acmesh-protected/acmesh-webroot.test"
      register: __testing_acmesh_webroot_cert_dirs_stat


    - name: "Molecule | Verify | Check permissions and ownership: destination directories (webroot challenge, staged)"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isdir']
          - item['stat']['mode'] == '0750'
          - item['stat']['pw_name'] == 'root'
          - item['stat']['gr_name'] == 'molecule-ssl-cert'
        fail_msg: >-
          {{ item['item'] }} does not exist or has incorrect
          permissions/ownership (expected root:molecule-ssl-cert 0750)
      loop: "{{ __testing_acmesh_webroot_cert_dirs_stat['results'] | ansible.builtin.default([]) }}"
      loop_control:
        label: "{{ item['item'] }}"


    - name: "Molecule | Verify | Try to read the protected private key as the service user (must fail)"
      ansible.builtin.command:
        argv:
          - "runuser"
          - "-u"
          - "{{ run_acmesh_user }}"
          - "--"
          - "cat"
          - "/etc/molecule-acmesh-protected/acmesh-webroot.test/cert.key"
      changed_when:
        - false
      failed_when:
        - __testing_acmesh_protected_key_read is ansible.builtin.success
      register: __testing_acmesh_protected_key_read


    - name: "Molecule | Verify | Read certificate SAN (Subject Alternative Name) (webroot challenge)"
      ansible.builtin.command:
        argv:
          - "openssl"
          - "x509"
          - "-in"
          - "/etc/pki/tls/certs/acmesh-webroot.test/cert.cer"
          - "-noout"
          - "-ext"
          - "subjectAltName"
      changed_when: false
      register: __testing_acmesh_webroot_cert_san


    - name: "Molecule | Verify | Assert certificate SAN contains expected domain (webroot challenge)"
      ansible.builtin.assert:
        that:
          - "'acmesh-webroot.test' in __testing_acmesh_webroot_cert_san['stdout']"
        fail_msg: >-
          Webroot certificate SAN does not contain 'acmesh-webroot.test'.
          Got: {{ __testing_acmesh_webroot_cert_san['stdout'] }}
        success_msg: "Webroot certificate SAN matches: {{ __testing_acmesh_webroot_cert_san['stdout'] }}"
      when:
        - __testing_acmesh_webroot_cert_san is ansible.builtin.defined


## Staged deployment resources (acmesh-deploy-*, staging area, manifest)

- name: "Molecule | Verify | Staged deployment resources (webroot challenge)"
  when:
    - __testing_state['__testing_pebble_available'] | ansible.builtin.default(false)
  block:

    - name: "Molecule | Verify | Gather stats for the staging base and certificate staging directory"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "{{ run_acmesh_cfg_cert_deploy_base_dir }}"
        - "{{ run_acmesh_cfg_cert_deploy_base_dir }}/acmesh-webroot.test"
      register: __testing_acmesh_staging_dirs_stat


    - name: "Molecule | Verify | Assert the staging base is root-owned and the staging directory service-user owned"
      ansible.builtin.assert:
        that:
          - __testing_acmesh_staging_dirs_stat['results'][0]['stat']['exists']
          - __testing_acmesh_staging_dirs_stat['results'][0]['stat']['isdir']
          - __testing_acmesh_staging_dirs_stat['results'][0]['stat']['mode'] == '0755'
          - __testing_acmesh_staging_dirs_stat['results'][0]['stat']['pw_name'] == 'root'
          - __testing_acmesh_staging_dirs_stat['results'][0]['stat']['gr_name'] == 'root'
          - __testing_acmesh_staging_dirs_stat['results'][1]['stat']['exists']
          - __testing_acmesh_staging_dirs_stat['results'][1]['stat']['isdir']
          - __testing_acmesh_staging_dirs_stat['results'][1]['stat']['mode'] == '0750'
          - __testing_acmesh_staging_dirs_stat['results'][1]['stat']['pw_name'] == run_acmesh_user
          - __testing_acmesh_staging_dirs_stat['results'][1]['stat']['gr_name'] == run_acmesh_group
        fail_msg: >-
          The staging base or the certificate staging directory does not exist
          or has incorrect permissions/ownership.


    - name: "Molecule | Verify | Gather stats for the staged certificate files"
      ansible.builtin.stat:
        path: "{{ run_acmesh_cfg_cert_deploy_base_dir }}/acmesh-webroot.test/{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "ca.cer"
        - "cert.cer"
        - "fullchain.cer"
        - "cert.key"
      register: __testing_acmesh_staging_files_stat


    - name: "Molecule | Verify | Assert the staged certificate files exist and are service-user owned"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isreg']
          - item['stat']['pw_name'] == run_acmesh_user
        fail_msg: >-
          Staged file {{ item['item'] }} does not exist or is not owned by the
          service user (acme.sh writes the staging area during installation
          and renewal).
      loop: "{{ __testing_acmesh_staging_files_stat['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"


    - name: "Molecule | Verify | Gather stats for the deployment manifest and unit files"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - "/etc/acmesh-deploy.d/acmesh-webroot.test.json"
        - "/etc/systemd/system/acmesh-deploy-acmesh-webroot.test.path"
        - "/etc/systemd/system/acmesh-deploy-acmesh-webroot.test.service"
        - "/usr/libexec/acmesh-deploy"
      register: __testing_acmesh_deploy_files_stat


    - name: "Molecule | Verify | Assert manifest, units and helper are root-owned and not group/world-writable"
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isreg']
          - item['stat']['pw_name'] == 'root'
          - item['stat']['gr_name'] == 'root'
          - item['stat']['wgrp'] is ansible.builtin.falsy
          - item['stat']['woth'] is ansible.builtin.falsy
        fail_msg: "{{ item['item'] }} does not exist or has unsafe ownership/permissions"
      loop: "{{ __testing_acmesh_deploy_files_stat['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"


    - name: "Molecule | Verify | Read the deployment manifest"
      ansible.builtin.slurp:
        src: "/etc/acmesh-deploy.d/acmesh-webroot.test.json"
      register: __testing_acmesh_manifest_slurp


    - name: "Molecule | Verify | Get the GID of the install permission group"
      ansible.builtin.getent:
        database: "group"
        key: "molecule-ssl-cert"


    - name: "Molecule | Verify | Assert the manifest holds the expected normalized, numeric deployment data"
      ansible.builtin.assert:
        that:
          - __testing_acmesh_manifest['version'] == 1
          - __testing_acmesh_manifest['certificate_id'] == 'acmesh-webroot.test'
          - __testing_acmesh_manifest['completion_artifact'] == 'fullchain_file'
          - __testing_acmesh_manifest['domains'] == ['acmesh-webroot.test']
          - __testing_acmesh_manifest['staging_dir'] == run_acmesh_cfg_cert_deploy_base_dir ~ '/acmesh-webroot.test'
          - __testing_acmesh_manifest['artifacts']['key_file']['uid'] == 0
          - __testing_acmesh_manifest['artifacts']['key_file']['gid'] == (ansible_facts['getent_group']['molecule-ssl-cert'][1] | ansible.builtin.int)
          - __testing_acmesh_manifest['artifacts']['key_file']['mode'] == '0640'
          - __testing_acmesh_manifest['artifacts']['key_file']['destination'] == '/etc/molecule-acmesh-protected/acmesh-webroot.test/cert.key'
          - __testing_acmesh_manifest['artifacts']['fullchain_file']['mode'] == '0644'
        fail_msg: >-
          The deployment manifest does not contain the expected normalized
          values: {{ __testing_acmesh_manifest }}
      vars:
        __testing_acmesh_manifest: "{{ __testing_acmesh_manifest_slurp['content'] | ansible.builtin.b64decode | ansible.builtin.from_json }}"


    - name: "Molecule | Verify | Get acmesh-deploy path unit state"
      ansible.builtin.command:
        argv:
          - "systemctl"
          - "show"
          - "acmesh-deploy-acmesh-webroot.test.path"
          - "--property=ActiveState,UnitFileState"
      changed_when:
        - false
      register: __testing_acmesh_deploy_path_state


    - name: "Molecule | Verify | Assert the acmesh-deploy path unit is active and enabled"
      ansible.builtin.assert:
        that:
          - "'ActiveState=active' in __testing_acmesh_deploy_path_state['stdout']"
          - "'UnitFileState=enabled' in __testing_acmesh_deploy_path_state['stdout']"
        fail_msg: >-
          The acmesh-deploy path unit is not active/enabled:
          {{ __testing_acmesh_deploy_path_state['stdout'] }}


    - name: "Molecule | Verify | Verify all acmesh-* systemd units with systemd-analyze"
      # The command or shell module is used intentionally:
      # Ansible provides no dedicated module to perform this operation.
      ansible.builtin.shell:
        cmd: |
          set -u              # no uninitialized vars
          set -e -o pipefail  # exit on (pipeline) errors
          systemd-analyze verify /etc/systemd/system/acmesh-*.service /etc/systemd/system/acmesh-*.path /etc/systemd/system/acmesh-*.timer
        executable: "/bin/bash"
      changed_when:
        - false


    - name: "Molecule | Verify | Check the deploy helper reports the deployment as in sync"
      ansible.builtin.command:
        argv:
          - "{{ __run_acmesh_deploy_python_exec_path }}"
          - "{{ __run_acmesh_deploy_helper_path }}"
          - "--check"
          - "/etc/acmesh-deploy.d/acmesh-webroot.test.json"
      changed_when:
        - false


    - name: "Molecule | Verify | Search the acmesh-deploy journal for private key material and the canary credential"
      # The command or shell module is used intentionally:
      # Ansible provides no dedicated module to perform this operation.
      ansible.builtin.shell:
        cmd: |
          set -u # no uninitialized vars
          set -o pipefail
          journalctl -t acmesh-deploy --no-pager 2>/dev/null \
            | grep -E -e 'PRIVATE KEY' -e 'molecule-canary-cred-do-not-print-1f9e' || true
        executable: "/bin/bash"
      changed_when:
        - false
      register: __testing_acmesh_deploy_journal_leaks


    - name: "Molecule | Verify | Assert the acmesh-deploy journal contains no private key material or credentials"
      ansible.builtin.assert:
        that:
          - (__testing_acmesh_deploy_journal_leaks['stdout'] | ansible.builtin.trim | ansible.builtin.length) == 0
        fail_msg: >-
          The acmesh-deploy journal leaked sensitive content:
          {{ __testing_acmesh_deploy_journal_leaks['stdout_lines'] | ansible.builtin.default([]) }}


## Direct installation strategy (pre-4.0.0 behavior, explicit opt-in)

